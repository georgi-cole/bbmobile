<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Intermission DR Verification</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #eee; }
    h1 { color: #4da6ff; }
    button { padding: 10px 20px; margin: 5px; font-size: 14px; cursor: pointer; }
    .log { background: #2a2a2a; padding: 15px; margin-top: 20px; max-height: 600px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .log-entry { padding: 3px; border-bottom: 1px solid #444; }
    .log-entry.success { color: #4ade80; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #60a5fa; }
    .log-entry.event { color: #fbbf24; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .screenshot-area { margin-top: 20px; padding: 15px; background: #2a2a2a; border-radius: 8px; }
    .screenshot-area img { max-width: 100%; border: 2px solid #4da6ff; border-radius: 4px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎯 Social Intermission DR Verification Test</h1>
  <p>This test simulates reaching social_intermission, triggers AI interactions, and captures DR evidence.</p>
  
  <div>
    <h2>Test Steps</h2>
    <button onclick="setupFullTest()">1. Setup Mock Game & Enable AI</button>
    <button onclick="runToSocialIntermission()">2. Fast-Track to social_intermission</button>
    <button onclick="triggerAIInteractions()">3. Trigger AI Interactions</button>
    <button onclick="checkDRButton()">4. Check DR Button State</button>
    <button onclick="showDREntries()">5. Show DR Entries</button>
  </div>
  
  <div id="status" class="status">
    <strong>Status:</strong> <span id="statusText">Ready</span>
  </div>
  
  <div class="log" id="log"></div>
  
  <div class="screenshot-area" id="screenshots">
    <h3>Screenshots & Evidence</h3>
    <div id="screenshotContent">No screenshots yet. Run the test to generate verification artifacts.</div>
  </div>

  <!-- Load required modules -->
  <script src="js/social-action-config.js"></script>
  <script src="js/social-maneuvers.js"></script>
  <script src="js/social-ai-scheduler.js"></script>
  <script src="js/social-highlights.js"></script>
  <script src="js/dr/diaryRoomLogger.js"></script>
  <!-- Event adapter for AI interactions to Diary Room (debug-gated) -->
  <script src="js/social/sm-to-dr-adapter.js"></script>
  <script src="js/social/social-ai-autostart.js"></script>

  <script>
    let testContext = {
      game: null,
      players: [],
      drEntries: []
    };

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[Test] ${message}`);
    }

    function updateStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function setupFullTest() {
      log('Setting up full test environment...');
      
      // Create comprehensive mock game
      window.game = {
        phase: 'social_intermission',
        week: 3,
        humanId: 0,
        currentPhaseToken: 5,
        hohId: 2,
        nominees: [3, 4],
        vetoHolder: null,
        vetoUsed: false,
        cfg: {
          aiSocialEnabled: true,
          debugSocialAI: true,
          enableSocialManeuvers: true
        },
        __sm_bankEnergy: new Map(),
        __sm_bankInfluence: new Map(),
        __sm_bankInformation: new Map()
      };
      
      // Create mock players with diverse names
      const playerNames = ['You', 'Remy', 'Rae', 'Rey', 'Jax', 'Nova', 'Lux', 'Kai'];
      window.players = [];
      for (let i = 0; i < 8; i++) {
        window.players.push({
          id: i,
          name: playerNames[i],
          evicted: false,
          human: i === 0
        });
        
        // Initialize banks
        window.game.__sm_bankEnergy.set(i, 10);
        window.game.__sm_bankInfluence.set(i, 0);
        window.game.__sm_bankInformation.set(i, 0);
      }
      
      // Setup helper functions
      window.alivePlayers = () => window.players.filter(p => !p.evicted);
      window.safeName = (id) => {
        const p = window.players.find(p => p.id === id);
        return p ? p.name : `Player ${id}`;
      };
      window.getP = (id) => window.players.find(p => p.id === id);
      
      // Setup event bus for DiaryRoomLogger
      window.game.bus = {
        listeners: {},
        on(event, handler) {
          if (!this.listeners[event]) this.listeners[event] = [];
          this.listeners[event].push(handler);
        },
        emit(event, data) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(h => h(data));
          }
        },
        off(event, handler) {
          if (this.listeners[event]) {
            this.listeners[event] = this.listeners[event].filter(h => h !== handler);
          }
        }
      };
      window.bbGameBus = window.game.bus;
      
      // Setup DR logs array and function
      window.game.drLogs = [];
      window.game.drLog = (text, category) => {
        const entry = { text, category, ts: Date.now() };
        window.game.drLogs.push(entry);
        log(`DR Log: ${text} [${category}]`, 'event');
      };
      
      // Initialize DiaryRoomLogger if available
      if (window.DiaryRoomLogger && window.DiaryRoomLogger.init) {
        window.DiaryRoomLogger.init();
        log('✓ DiaryRoomLogger initialized with event bus', 'success');
      }
      
      // Load DiaryTemplates mock for testing
      if (!window.DiaryTemplates) {
        window.DiaryTemplates = {
          resolveName: (id) => window.safeName(id),
          render: (template, data) => {
            let text = template;
            Object.keys(data).forEach(key => {
              text = text.replace(`{${key}}`, data[key]);
            });
            return text;
          },
          getSocialTemplate: (action) => `{actor} performed ${action} on {target}`,
          getSocialSummaryTemplate: () => '{actor} completed {count} actions in week {week}',
          deltaStr: (delta) => delta > 0 ? `(+${delta.toFixed(2)})` : `(${delta.toFixed(2)})`
        };
        log('✓ DiaryTemplates mock created', 'success');
      }
      
      log('✓ Test environment setup complete', 'success');
      log(`Created ${window.players.length} mock players with energy banks`);
      updateStatus('Ready for social_intermission test');
    }

    function runToSocialIntermission() {
      log('Fast-tracking to social_intermission phase...');
      
      if (!window.game) {
        log('✗ Game not setup! Run step 1 first.', 'error');
        return;
      }
      
      window.game.phase = 'social_intermission';
      log('✓ Phase set to social_intermission', 'success');
      updateStatus('In social_intermission phase');
    }

    function triggerAIInteractions() {
      log('Triggering AI social interactions...');
      
      if (!window.SocialAIScheduler) {
        log('✗ SocialAIScheduler not loaded!', 'error');
        return;
      }
      
      // Check if adapter is loaded
      if (window.__smToDrAdapterInstalled) {
        log('✓ sm-to-dr-adapter is installed', 'success');
      } else {
        log('⚠ sm-to-dr-adapter NOT installed - check if debugSocialAI is enabled', 'info');
      }
      
      // Setup event listener for sm-ai-interaction (scheduler output)
      window.addEventListener('sm-ai-interaction', (event) => {
        const d = event.detail;
        const actorName = window.safeName(d.actorId);
        const targetName = d.targetIds ? window.safeName(d.targetIds[0]) : 'unknown';
        log(`🤖 [sm-ai-interaction] ${actorName} → ${d.actionId} → ${targetName}`, 'event');
      });
      log('✓ Listener for sm-ai-interaction attached', 'success');
      
      // Setup event listener for social.action:result (adapter output)
      window.addEventListener('social.action:result', (event) => {
        const d = event.detail;
        const actorName = d.actor?.name || 'unknown';
        const targetName = d.target?.name || 'unknown';
        log(`📢 [social.action:result] ${actorName} → ${d.action} → ${targetName} (success: ${d.success})`, 'event');
        
        // Store DR entry
        testContext.drEntries.push({
          timestamp: new Date(),
          actor: actorName,
          action: d.action,
          target: targetName,
          success: d.success
        });
      });
      log('✓ Listener for social.action:result attached', 'success');
      
      // Setup event listener for bond.shift (adapter output)
      window.addEventListener('bond.shift', (event) => {
        const d = event.detail;
        const fromName = d.from?.name || 'unknown';
        const toName = d.to?.name || 'unknown';
        log(`💛 [bond.shift] ${fromName} ↔ ${toName}: ${d.delta > 0 ? '+' : ''}${d.delta.toFixed(2)}`, 'event');
      });
      log('✓ Listener for bond.shift attached', 'success');
      
      // Check energy before starting
      log('Checking AI player energy levels...');
      const aiPlayers = window.alivePlayers().filter(p => !p.human);
      aiPlayers.forEach(p => {
        const energy = window.game.__sm_bankEnergy.get(p.id) || 0;
        log(`  ${p.name}: ${energy} energy`, 'info');
      });
      
      // Start the AI scheduler
      log('Starting AI scheduler...');
      window.SocialAIScheduler.startAiSocialPhase({}, 'test-verification');
      
      setTimeout(() => {
        const state = window.__smDebug?.getState();
        if (state && state.isRunning) {
          log(`✓ AI scheduler running (ticks=${state.tickCount})`, 'success');
          updateStatus('AI Scheduler active');
        } else {
          log('⚠ AI scheduler may not be running', 'info');
        }
      }, 500);
      
      // Run manual tick and wait for results
      setTimeout(() => {
        log('Running manual AI tick...');
        if (window.__smDebug && window.__smDebug.runAiTickOnce) {
          window.__smDebug.runAiTickOnce();
          log('✓ Manual tick executed', 'success');
          
          // Check energy after tick
          setTimeout(() => {
            log('Checking AI player energy after tick...');
            aiPlayers.forEach(p => {
              const energy = window.game.__sm_bankEnergy.get(p.id) || 0;
              log(`  ${p.name}: ${energy} energy`, 'info');
            });
          }, 500);
        }
      }, 1000);
    }

    function checkDRButton() {
      log('Checking DR button state...');
      
      // Check if DR button exists and is blinking
      const drButton = document.querySelector('#btnDiaryRoom') || document.querySelector('[data-dr-button]');
      
      if (drButton) {
        const isBlinking = drButton.classList.contains('blink') || 
                          drButton.classList.contains('alert') ||
                          drButton.classList.contains('has-new') ||
                          drButton.style.animation.includes('blink');
        
        log(`✓ DR button found: ${drButton.tagName}`, 'success');
        log(`DR button classes: ${drButton.className}`);
        log(`Is blinking: ${isBlinking ? 'YES ✓' : 'NO'}`, isBlinking ? 'success' : 'info');
        
        if (isBlinking) {
          updateStatus('DR button is BLINKING - New important events!');
        } else {
          updateStatus('DR button found but not blinking');
        }
      } else {
        log('⚠ DR button not found in DOM', 'info');
        log('This is a test page - DR button may only exist in main game', 'info');
      }
    }

    function showDREntries() {
      log('Showing Diary Room entries...');
      
      // Check game.drLogs array
      if (window.game && window.game.drLogs && window.game.drLogs.length > 0) {
        log(`Found ${window.game.drLogs.length} DR logs from game.drLogs`, 'success');
        window.game.drLogs.forEach((entry, idx) => {
          log(`  DR Log ${idx + 1}: ${entry.text} [${entry.category}]`, 'info');
        });
      } else {
        log('No entries in game.drLogs', 'info');
      }
      
      // Check DiaryRoomLogger
      if (window.DiaryRoomLogger && window.DiaryRoomLogger.getEntries) {
        const entries = window.DiaryRoomLogger.getEntries();
        log(`Found ${entries.length} DR entries from DiaryRoomLogger.getEntries()`, 'success');
        
        entries.forEach((entry, idx) => {
          log(`  Entry ${idx + 1}: ${JSON.stringify(entry)}`, 'info');
        });
      }
      
      // Check test context entries
      if (testContext.drEntries.length > 0) {
        log(`Found ${testContext.drEntries.length} DR entries from event capture`, 'success');
        
        testContext.drEntries.forEach((entry, idx) => {
          const msg = `${entry.actor} → ${entry.action} → ${entry.target} (success: ${entry.success})`;
          log(`  Captured ${idx + 1}: ${msg}`, 'event');
        });
        
        // Display in screenshot area
        const screenshotDiv = document.getElementById('screenshotContent');
        let html = '<h4>✅ Captured Social Interactions via Adapter:</h4><ul>';
        testContext.drEntries.forEach(entry => {
          const icon = entry.success ? '✅' : '❌';
          html += `<li>${icon} <strong>${entry.actor}</strong> → <em>${entry.action}</em> → <strong>${entry.target}</strong></li>`;
        });
        html += '</ul>';
        
        // Add DR logs if any
        if (window.game && window.game.drLogs && window.game.drLogs.length > 0) {
          html += '<h4>📝 Diary Room Logs (from DiaryRoomLogger):</h4><ul>';
          window.game.drLogs.forEach(entry => {
            html += `<li><span style="color: #fbbf24;">${entry.category}</span>: ${entry.text}</li>`;
          });
          html += '</ul>';
        }
        
        screenshotDiv.innerHTML = html;
        
        updateStatus(`${testContext.drEntries.length} interactions captured, ${window.game?.drLogs?.length || 0} DR logs`);
      } else {
        log('No DR entries captured yet', 'info');
        log('Try running step 3 (Trigger AI Interactions) and wait a few seconds', 'info');
      }
    }

    // Log module loading
    window.addEventListener('DOMContentLoaded', () => {
      log('Test page loaded');
      if (window.SocialManeuvers) log('✓ SocialManeuvers loaded');
      if (window.SocialAIScheduler) log('✓ SocialAIScheduler loaded');
      if (window.SocialHighlights) log('✓ SocialHighlights loaded');
      if (window.DiaryRoomLogger) log('✓ DiaryRoomLogger loaded');
    });
  </script>
</body>
</html>
