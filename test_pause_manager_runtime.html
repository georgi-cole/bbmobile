<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PauseManager Runtime Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #0a0f1a;
      color: #e6e8ee;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
      background: #141a23;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2b3546;
    }
    h1 {
      color: #78b8ff;
      border-bottom: 2px solid #2b3546;
      padding-bottom: 10px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: #0f1320;
      border-radius: 8px;
      border: 1px solid #273041;
    }
    .test-result {
      margin: 5px 0;
      padding: 8px;
      border-radius: 4px;
    }
    .pass {
      background: #1a3a2a;
      color: #79d19a;
    }
    .fail {
      background: #3a1a1a;
      color: #f28c8c;
    }
    button {
      background: linear-gradient(135deg, #2877a0, #1a4a63);
      color: #fff;
      border: 1px solid #2d8ab4;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }
    button:hover {
      background: linear-gradient(135deg, #3088b5, #2a5a73);
    }
    .info {
      background: #1a2a3a;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      border-left: 3px solid #2877a0;
    }
    .code {
      background: #0a0f1a;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>PauseManager Runtime Test</h1>
    
    <div class="test-section">
      <h2>Test Results</h2>
      <div id="test-results"></div>
    </div>

    <div class="test-section">
      <h2>Manual Tests</h2>
      <div class="info">
        Use these buttons to manually test PauseManager functionality:
      </div>
      <button onclick="testOpen()">Open Modal</button>
      <button onclick="testClose()">Close Modal</button>
      <button onclick="testMultiple()">Open Multiple Modals</button>
      <button onclick="testReset()">Reset All</button>
      <div id="manual-results" style="margin-top: 15px;"></div>
    </div>

    <div class="test-section">
      <h2>State Monitor</h2>
      <div id="state-monitor" class="code"></div>
    </div>
  </div>

  <!-- Load global-pause.js -->
  <script src="js/ui/global-pause.js"></script>

  <script>
    const resultsEl = document.getElementById('test-results');
    const manualEl = document.getElementById('manual-results');
    const stateEl = document.getElementById('state-monitor');

    function addResult(message, isPassing) {
      const div = document.createElement('div');
      div.className = `test-result ${isPassing ? 'pass' : 'fail'}`;
      div.textContent = `${isPassing ? '✓' : '✗'} ${message}`;
      resultsEl.appendChild(div);
    }

    function updateState() {
      const pm = window.game?.pauseManager;
      if (!pm) {
        stateEl.textContent = 'PauseManager not available';
        return;
      }
      stateEl.textContent = `
isPaused: ${pm.isPaused()}
Open Modals: [${pm.getOpenModals().join(', ')}]
Count: ${pm.getOpenModals().length}
      `.trim();
    }

    function runTests() {
      // Test 1: Check if window.game.pauseManager exists
      const pm = window.game?.pauseManager;
      addResult('window.game.pauseManager exists', !!pm);

      if (!pm) {
        addResult('Cannot continue tests - PauseManager not found', false);
        return;
      }

      // Test 2: Check API methods exist
      addResult('open() method exists', typeof pm.open === 'function');
      addResult('close() method exists', typeof pm.close === 'function');
      addResult('isPaused() method exists', typeof pm.isPaused === 'function');
      addResult('getOpenModals() method exists', typeof pm.getOpenModals === 'function');
      addResult('reset() method exists', typeof pm.reset === 'function');

      // Test 3: Test functionality
      const initialState = pm.isPaused();
      addResult('Initial isPaused() is false', initialState === false);

      // Test 4: Open modal
      pm.open('test-modal-1');
      const pausedAfterOpen = pm.isPaused();
      addResult('isPaused() returns true after open', pausedAfterOpen === true);

      const modals = pm.getOpenModals();
      addResult('getOpenModals() contains test-modal-1', modals.includes('test-modal-1'));

      // Test 5: Open another modal
      pm.open('test-modal-2');
      const modals2 = pm.getOpenModals();
      addResult('Multiple modals tracked', modals2.length === 2);

      // Test 6: Close one modal
      pm.close('test-modal-1');
      const stillPaused = pm.isPaused();
      addResult('Still paused with one modal open', stillPaused === true);

      // Test 7: Close all modals
      pm.close('test-modal-2');
      const resumedAfterClose = pm.isPaused();
      addResult('isPaused() returns false after closing all', resumedAfterClose === false);

      // Test 8: Reset
      pm.open('test-modal-3');
      pm.reset();
      const clearedAfterReset = pm.isPaused();
      addResult('reset() clears all modals', clearedAfterReset === false);

      updateState();
    }

    // Manual test functions
    let modalCounter = 0;
    function testOpen() {
      modalCounter++;
      const id = `manual-modal-${modalCounter}`;
      window.game.pauseManager.open(id);
      manualEl.textContent = `Opened: ${id}`;
      updateState();
    }

    function testClose() {
      const modals = window.game.pauseManager.getOpenModals();
      if (modals.length > 0) {
        window.game.pauseManager.close(modals[modals.length - 1]);
        manualEl.textContent = `Closed: ${modals[modals.length - 1]}`;
      } else {
        manualEl.textContent = 'No modals to close';
      }
      updateState();
    }

    function testMultiple() {
      for (let i = 0; i < 3; i++) {
        modalCounter++;
        window.game.pauseManager.open(`multi-modal-${modalCounter}`);
      }
      manualEl.textContent = 'Opened 3 modals';
      updateState();
    }

    function testReset() {
      window.game.pauseManager.reset();
      manualEl.textContent = 'Reset all modals';
      updateState();
    }

    // Listen for events
    window.addEventListener('game:pause', () => {
      console.log('[Test] game:pause event received');
      const info = document.createElement('div');
      info.className = 'test-result pass';
      info.textContent = '✓ game:pause event fired';
      resultsEl.appendChild(info);
    });

    window.addEventListener('game:resume', () => {
      console.log('[Test] game:resume event received');
      const info = document.createElement('div');
      info.className = 'test-result pass';
      info.textContent = '✓ game:resume event fired';
      resultsEl.appendChild(info);
    });

    // Run tests on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runTests, 100);
    });
  </script>
</body>
</html>
