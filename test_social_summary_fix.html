<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Summary Bug Fix Test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .test-controls {
      margin-bottom: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 8px;
    }
    .test-controls button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 14px;
    }
    .test-log {
      margin-top: 20px;
      padding: 15px;
      background: #1e1e1e;
      color: #0f0;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .log-entry {
      margin-bottom: 5px;
    }
    .log-entry.error {
      color: #f00;
    }
    .log-entry.warn {
      color: #fa0;
    }
    .log-entry.info {
      color: #0ff;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
    }
    .status.pass {
      background: #d4edda;
      color: #155724;
    }
    .status.fail {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>🧪 Social Summary Popup Bug Fix Test</h1>
  
  <div class="test-controls">
    <h3>Test Controls</h3>
    <p>This test verifies the fix for the social summary popup reappearing bug.</p>
    
    <button id="setupBtn" onclick="setupTest()">1. Setup Test Environment</button>
    <button id="startSocialBtn" onclick="testStartSocialPhase()" disabled>2. Start Social Phase</button>
    <button id="triggerOnDoneBtn" onclick="testTriggerOnDone()" disabled>3. Trigger onDone (End Phase)</button>
    <button id="triggerOnDoneAgainBtn" onclick="testTriggerOnDoneAgain()" disabled>4. Trigger onDone AGAIN (Should be blocked)</button>
    <button id="resetBtn" onclick="resetTest()">Reset Test</button>
  </div>

  <div id="statusBox" class="status" style="display:none;">
    <strong>Status:</strong> <span id="statusText"></span>
  </div>

  <div class="test-log">
    <strong>Test Log:</strong>
    <div id="logOutput"></div>
  </div>

  <div id="panel" style="display:none;"></div>
  <div id="decisionDeck" style="display:none;"></div>

  <script type="module">
    // Mock game environment
    window.game = {
      cfg: {
        enableSocialManeuvers: true,
        tComms: 30
      },
      humanId: 'player1',
      week: 1,
      players: [
        { id: 'player1', name: 'Human', evicted: false },
        { id: 'player2', name: 'AI 1', evicted: false },
        { id: 'player3', name: 'AI 2', evicted: false }
      ]
    };

    let onDoneCalls = 0;
    let summaryShownCount = 0;
    let phaseAdvancedCount = 0;

    function log(message, type = 'info') {
      const logOutput = document.getElementById('logOutput');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logOutput.appendChild(entry);
      logOutput.scrollTop = logOutput.scrollHeight;
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    function updateStatus(message, pass) {
      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      statusBox.style.display = 'block';
      statusBox.className = `status ${pass ? 'pass' : 'fail'}`;
      statusText.textContent = message;
    }

    // Mock Social Maneuvers module
    window.SocialManeuvers = {
      isEnabled: () => true,
      
      onSocialPhaseStart: () => {
        log('SocialManeuvers.onSocialPhaseStart() called', 'info');
      },
      
      onSocialPhaseEnd: () => {
        log('SocialManeuvers.onSocialPhaseEnd() called', 'info');
      },
      
      generatePhaseSummary: () => {
        log('SocialManeuvers.generatePhaseSummary() called', 'info');
        return {
          resources: { energySpent: {}, informationSpent: {} },
          actions: { total: 5 },
          relationships: { changes: [], newAlliances: [], newRivalries: [] },
          memories: { created: 3 }
        };
      },
      
      showSummaryPanel: (summary) => {
        summaryShownCount++;
        log(`SocialManeuvers.showSummaryPanel() called (Call #${summaryShownCount})`, summaryShownCount > 1 ? 'warn' : 'info');
        
        // Simulate the OK button being clicked after a short delay
        setTimeout(() => {
          log('User clicked OK button on summary', 'info');
          const callback = window.game.__socialPhaseAdvanceCallback;
          if (callback) {
            callback();
          }
        }, 1000);
      }
    };

    // Mock functions
    window.cardQueueWaitIdle = async () => {
      log('cardQueueWaitIdle() called', 'info');
    };

    window.setPhase = (phaseName, duration, callback) => {
      log(`setPhase("${phaseName}", ${duration}, callback) called`, 'info');
      window.game.__currentPhaseCallback = callback;
    };

    window.setupTest = function() {
      log('=== Setting up test environment ===', 'info');
      onDoneCalls = 0;
      summaryShownCount = 0;
      phaseAdvancedCount = 0;
      window.game.__socialOnDoneFired = false;
      window.game.__socialPhaseAdvanceCallback = null;
      
      document.getElementById('setupBtn').disabled = true;
      document.getElementById('startSocialBtn').disabled = false;
      log('✓ Test environment ready', 'info');
    };

    window.testStartSocialPhase = function() {
      log('=== Starting Social Phase ===', 'info');
      
      // Clear the guard (as done in startSocialIntermission)
      if(window.game) window.game.__socialOnDoneFired = false;
      log('✓ Cleared __socialOnDoneFired guard', 'info');
      
      document.getElementById('startSocialBtn').disabled = true;
      document.getElementById('triggerOnDoneBtn').disabled = false;
      log('✓ Social phase started', 'info');
    };

    window.testTriggerOnDone = function() {
      log('=== Triggering onDone (First Call) ===', 'info');
      
      // Check idempotency guard
      if(window.game?.__socialOnDoneFired) {
        log('⚠️ onDone already fired this phase - ignoring duplicate call', 'warn');
        return;
      }
      window.game.__socialOnDoneFired = true;
      log('✓ Set __socialOnDoneFired = true', 'info');
      
      onDoneCalls++;
      log(`onDone execution #${onDoneCalls}`, 'info');
      
      // Call the Social Maneuvers callbacks
      if(window.SocialManeuvers?.onSocialPhaseEnd) {
        window.SocialManeuvers.onSocialPhaseEnd();
      }
      
      // Show summary
      let summaryShown = false;
      if(window.SocialManeuvers?.showSummaryPanel && window.SocialManeuvers?.generatePhaseSummary) {
        const summary = window.SocialManeuvers.generatePhaseSummary();
        if(summary) {
          window.game.__socialPhaseAdvanceCallback = () => {
            phaseAdvancedCount++;
            log(`✓ Phase advanced (Call #${phaseAdvancedCount})`, 'info');
          };
          window.SocialManeuvers.showSummaryPanel(summary);
          summaryShown = true;
          log('✓ Summary shown - early return (no fallback advancement)', 'info');
          
          document.getElementById('triggerOnDoneBtn').disabled = true;
          document.getElementById('triggerOnDoneAgainBtn').disabled = false;
          return; // Exit early
        }
      }
      
      // Fallback advancement (only if summary NOT shown)
      if(!summaryShown) {
        log('⚠️ Fallback advancement triggered', 'warn');
        phaseAdvancedCount++;
        log(`Phase advanced via fallback (Call #${phaseAdvancedCount})`, 'info');
      }
    };

    window.testTriggerOnDoneAgain = function() {
      log('=== Triggering onDone AGAIN (Should be blocked) ===', 'warn');
      
      // Check idempotency guard - THIS SHOULD BLOCK THE SECOND CALL
      if(window.game?.__socialOnDoneFired) {
        log('✅ SUCCESS: onDone already fired - duplicate call blocked by guard!', 'info');
        updateStatus('PASS: Idempotency guard prevented duplicate onDone execution', true);
        
        // Verify counters
        log('=== Final Verification ===', 'info');
        log(`onDone calls: ${onDoneCalls} (should be 1)`, onDoneCalls === 1 ? 'info' : 'error');
        log(`Summary shown: ${summaryShownCount} time(s) (should be 1)`, summaryShownCount === 1 ? 'info' : 'error');
        log(`Phase advanced: ${phaseAdvancedCount} time(s) (should be 1)`, phaseAdvancedCount === 1 ? 'info' : 'error');
        
        if (onDoneCalls === 1 && summaryShownCount === 1 && phaseAdvancedCount === 1) {
          log('✅ ALL CHECKS PASSED - Bug is fixed!', 'info');
        } else {
          log('❌ SOME CHECKS FAILED - Bug may still exist', 'error');
          updateStatus('FAIL: Bug may still exist - check counters', false);
        }
        return;
      }
      
      // This should never execute
      log('❌ FAIL: Guard did not prevent duplicate call!', 'error');
      updateStatus('FAIL: Idempotency guard did not work', false);
      onDoneCalls++;
    };

    window.resetTest = function() {
      log('=== Resetting test ===', 'info');
      document.getElementById('logOutput').innerHTML = '';
      document.getElementById('statusBox').style.display = 'none';
      document.getElementById('setupBtn').disabled = false;
      document.getElementById('startSocialBtn').disabled = true;
      document.getElementById('triggerOnDoneBtn').disabled = true;
      document.getElementById('triggerOnDoneAgainBtn').disabled = true;
      onDoneCalls = 0;
      summaryShownCount = 0;
      phaseAdvancedCount = 0;
      window.game.__socialOnDoneFired = false;
      window.game.__socialPhaseAdvanceCallback = null;
    };

    // Auto-setup on load
    log('Test page loaded. Click "1. Setup Test Environment" to begin.', 'info');
  </script>
</body>
</html>
