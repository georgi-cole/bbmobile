<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Intro Avatar Preload Test - BBMobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="src/ui/profileModal.css">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #fff;
  }
  
  .test-controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 20000;
    background: rgba(0,0,0,0.9);
    padding: 20px;
    border-radius: 12px;
    max-width: 380px;
    border: 2px solid #00d4ff;
  }
  
  .test-controls h2 {
    margin: 0 0 15px 0;
    font-size: 16px;
    color: #00d4ff;
  }
  
  .test-section {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #333;
  }
  
  .test-section:last-child {
    border-bottom: none;
    margin-bottom: 0;
  }
  
  .test-section h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #78b4f0;
  }
  
  .test-controls button {
    display: block;
    width: 100%;
    margin: 5px 0;
    padding: 10px;
    background: #0088ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s ease;
  }
  
  .test-controls button:hover {
    background: #0099ff;
  }
  
  .test-controls button.secondary {
    background: #333;
  }
  
  .test-controls button.secondary:hover {
    background: #444;
  }
  
  .test-controls button.success {
    background: #00aa66;
  }
  
  .test-controls button.success:hover {
    background: #00bb77;
  }
  
  .test-status {
    margin: 10px 0 0 0;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
  }
  
  .test-status.pass {
    border-left: 3px solid #00ff88;
  }
  
  .test-status.fail {
    border-left: 3px solid #ff4444;
  }
  
  .test-status.info {
    border-left: 3px solid #00d4ff;
  }
  
  .player-config {
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 6px;
    margin: 10px 0;
    font-size: 12px;
  }
  
  .player-config label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
  }
  
  .player-config input[type="checkbox"] {
    width: 16px;
    height: 16px;
  }
  
  .player-config input[type="number"] {
    width: 60px;
    padding: 4px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
  }
  
  #eventLog {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    z-index: 20000;
    background: rgba(0,0,0,0.95);
    padding: 15px;
    border-radius: 12px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    border: 2px solid #333;
  }
  
  #eventLog .log-header {
    font-weight: bold;
    color: #00d4ff;
    margin-bottom: 10px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.95);
    padding: 5px 0;
  }
  
  #eventLog .event {
    margin: 3px 0;
    padding: 5px;
    border-left: 2px solid #00d4ff;
    padding-left: 10px;
  }
  
  #eventLog .event.error {
    border-left-color: #ff4444;
    color: #ff8888;
  }
  
  #eventLog .event.success {
    border-left-color: #00ff88;
    color: #88ffbb;
  }
  
  #eventLog .event.warning {
    border-left-color: #ffaa00;
    color: #ffcc66;
  }
</style>
</head>
<body>

<div class="test-controls">
  <h2>🎭 Avatar Preload Test Suite</h2>
  
  <div class="test-section">
    <h3>Player Configuration</h3>
    <div class="player-config">
      <label>
        <span>Number of players:</span>
        <input type="number" id="playerCount" value="12" min="1" max="20">
      </label>
      <label>
        <input type="checkbox" id="includeMissing" checked>
        <span>Include some missing avatars</span>
      </label>
      <label>
        <input type="checkbox" id="simulateSlow">
        <span>Simulate slow network</span>
      </label>
    </div>
    <button id="btnSetupPlayers">Setup Test Players</button>
  </div>
  
  <div class="test-section">
    <h3>Background Gating Test</h3>
    <button id="btnTestBgGating">Test Background-First Paint</button>
    <div id="statusBgGating" class="test-status info">
      Verifies buttons are hidden until bg-ready class is added
    </div>
  </div>
  
  <div class="test-section">
    <h3>Avatar Preload Test</h3>
    <button id="btnShowIntro">Show Intro Hub</button>
    <button id="btnTestAvatarPreload" class="secondary">Test Avatar Preload Only</button>
    <button id="btnClickPlay" class="success">Click Play Button</button>
    <div id="statusAvatarPreload" class="test-status info">
      Click Play to see full preload workflow with overlay
    </div>
  </div>
  
  <div class="test-section">
    <h3>Accessibility Test</h3>
    <button id="btnTestA11y" class="secondary">Test Reduced Motion</button>
    <div id="statusA11y" class="test-status info">
      Tests spinner behavior with prefers-reduced-motion
    </div>
  </div>
  
  <div class="test-section">
    <button id="btnClearLog" class="secondary">Clear Event Log</button>
    <button id="btnReset" class="secondary">Reset All</button>
  </div>
</div>

<div id="eventLog">
  <div class="log-header">📋 Event Log</div>
</div>

<!-- Load dependencies -->
<script src="js/bbGameBus.js"></script>
<script src="js/avatar.js"></script>
<script src="src/utils/backgroundTheme.js"></script>
<script src="js/preload/avatars-preload.js"></script>
<script src="js/preload/avatar-queue.js"></script>
<script src="src/ui/IntroScreen.js"></script>

<script>
(function() {
  'use strict';
  
  // Initialize game bus and game object
  if (!window.game) window.game = {};
  window.game.bus = window.bbGameBus;
  window.game.players = [];
  window.game.cfg = {};
  
  // Mock audio controls
  window.game.audio = {
    toggleMusic: () => { logEvent('Music toggled', 'success'); return true; },
    toggleSound: () => { logEvent('Sound toggled', 'success'); return true; }
  };
  
  // Mock global functions
  window.StartupFlow = {
    enterGame: function() {
      logEvent('🎮 StartupFlow.enterGame() called - GAME STARTING!', 'success');
    }
  };
  
  window.showRulesModal = () => logEvent('Rules modal shown', 'success');
  window.showProfileModal = () => logEvent('Profile modal shown', 'success');
  window.showSettingsModal = () => logEvent('Settings modal shown', 'success');
  window.showLeaderboard = () => logEvent('Leaderboard shown', 'success');
  window.showCreditsModal = () => logEvent('Credits modal shown', 'success');
  
  // Sample avatar URLs (mix of valid and missing)
  const SAMPLE_AVATARS = [
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Alice',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Bob',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Charlie',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Diana',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Eve',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Frank',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Grace',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Henry',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Iris',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Jack',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Kate',
    'https://api.dicebear.com/6.x/avataaars/svg?seed=Leo'
  ];
  
  const MISSING_AVATARS = [
    './avatars/nonexistent1.png',
    './avatars/nonexistent2.jpg',
    'https://example.com/missing-avatar.png'
  ];
  
  // Initialize BackgroundTheme
  const bgTheme = window.BackgroundTheme.init({ bus: window.bbGameBus });
  
  // Initialize IntroScreen
  const introScreen = window.IntroScreen.init({ bus: window.bbGameBus });
  
  // Log events
  function logEvent(message, type = 'info') {
    const log = document.getElementById('eventLog');
    const entry = document.createElement('div');
    entry.className = `event ${type}`;
    const timestamp = new Date().toLocaleTimeString();
    entry.textContent = `[${timestamp}] ${message}`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
    console.log(`[Test] ${message}`);
  }
  
  // Setup test players
  document.getElementById('btnSetupPlayers').addEventListener('click', () => {
    const count = parseInt(document.getElementById('playerCount').value) || 12;
    const includeMissing = document.getElementById('includeMissing').checked;
    
    const players = [];
    const names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Iris', 'Jack', 'Kate', 'Leo', 'Mike', 'Nancy', 'Oscar', 'Paula', 'Quinn', 'Rose', 'Sam', 'Tina'];
    
    for (let i = 0; i < count; i++) {
      const name = names[i % names.length];
      const player = {
        id: i,
        name: name,
        human: i === 0
      };
      
      // Assign avatar - mix of valid and missing
      if (includeMissing && i % 4 === 0) {
        // Every 4th player has a missing avatar
        player.avatar = MISSING_AVATARS[i % MISSING_AVATARS.length];
      } else if (i < SAMPLE_AVATARS.length) {
        player.avatar = SAMPLE_AVATARS[i];
      }
      // Some players have no avatar set (will use resolveAvatar fallback)
      
      players.push(player);
    }
    
    window.game.players = players;
    logEvent(`✓ Created ${count} test players (${includeMissing ? 'with' : 'without'} missing avatars)`, 'success');
    
    // Log player details
    players.forEach(p => {
      const avatarStatus = p.avatar ? (p.avatar.includes('nonexistent') ? '❌ missing' : '✓ valid') : '⚠ fallback';
      logEvent(`  Player ${p.id}: ${p.name} [${avatarStatus}]`, 'info');
    });
  });
  
  // Test background gating
  document.getElementById('btnTestBgGating').addEventListener('click', async () => {
    const status = document.getElementById('statusBgGating');
    status.className = 'test-status info';
    status.textContent = 'Testing... Please wait...';
    
    logEvent('=== TEST: Background Gating ===', 'info');
    
    // Reset intro screen
    if (introScreen.reset) {
      introScreen.reset();
    }
    window.IntroScreen.init({ bus: window.bbGameBus });
    
    // Track when elements become visible
    let bgReadyTime = null;
    let buttonsVisibleTime = null;
    const startTime = performance.now();
    
    const observer = new MutationObserver(() => {
      const intro = document.getElementById('introScreen');
      if (!intro) return;
      
      const hasBgReady = intro.classList.contains('bg-ready');
      const buttons = intro.querySelector('.intro-screen__button-column');
      
      if (hasBgReady && !bgReadyTime) {
        bgReadyTime = performance.now() - startTime;
        logEvent(`✓ bg-ready class added at ${bgReadyTime.toFixed(2)}ms`, 'success');
      }
      
      if (buttons && hasBgReady && !buttonsVisibleTime) {
        const style = window.getComputedStyle(buttons);
        if (style.visibility === 'visible' && parseFloat(style.opacity) > 0) {
          buttonsVisibleTime = performance.now() - startTime;
          logEvent(`✓ Buttons visible at ${buttonsVisibleTime.toFixed(2)}ms`, 'success');
          
          observer.disconnect();
          
          if (bgReadyTime && bgReadyTime <= buttonsVisibleTime) {
            status.className = 'test-status pass';
            status.textContent = `✅ PASS: Buttons visible only after bg-ready`;
            logEvent('✅ TEST PASSED: Background gating works correctly', 'success');
          } else {
            status.className = 'test-status fail';
            status.textContent = `❌ FAIL: Buttons visible before bg-ready`;
            logEvent('❌ TEST FAILED: Buttons appeared too early', 'error');
          }
        }
      }
    });
    
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['class', 'style']
    });
    
    // Show intro screen
    await introScreen.showWithPreload();
    
    // Timeout fallback
    setTimeout(() => {
      observer.disconnect();
      if (!bgReadyTime || !buttonsVisibleTime) {
        status.className = 'test-status fail';
        status.textContent = '❌ FAIL: Timing measurement incomplete';
        logEvent('❌ TEST FAILED: Could not measure timing', 'error');
      }
    }, 5000);
  });
  
  // Show intro hub
  document.getElementById('btnShowIntro').addEventListener('click', async () => {
    logEvent('=== Showing Intro Hub ===', 'info');
    await introScreen.showWithPreload();
    logEvent('✓ Intro hub displayed', 'success');
  });
  
  // Test avatar preload only
  document.getElementById('btnTestAvatarPreload').addEventListener('click', async () => {
    const status = document.getElementById('statusAvatarPreload');
    status.className = 'test-status info';
    status.textContent = 'Preloading avatars...';
    
    logEvent('=== TEST: Avatar Preload ===', 'info');
    
    const players = window.game.players;
    if (!players || players.length === 0) {
      logEvent('⚠ No players set up - click "Setup Test Players" first', 'warning');
      status.className = 'test-status fail';
      status.textContent = '❌ No players - set up players first';
      return;
    }
    
    const preloadAvatars = window.preloadAvatars;
    if (!preloadAvatars) {
      logEvent('❌ preloadAvatars not available', 'error');
      status.className = 'test-status fail';
      status.textContent = '❌ preloadAvatars module not loaded';
      return;
    }
    
    // Check if slow network simulation is enabled
    const simulateSlow = document.getElementById('simulateSlow').checked;
    const timeout = simulateSlow ? 2000 : 6000;
    
    const startTime = Date.now();
    
    try {
      const result = await preloadAvatars(players, {
        timeout: timeout,
        onProgress: (loaded, total) => {
          const percent = total > 0 ? Math.round((loaded / total) * 100) : 0;
          logEvent(`Progress: ${loaded}/${total} (${percent}%)`, 'info');
          status.textContent = `Loading... ${percent}%`;
        }
      });
      
      const elapsed = Date.now() - startTime;
      
      if (result.timedOut) {
        status.className = 'test-status warning';
        status.textContent = `⚠ Timeout: ${result.loaded}/${result.total} loaded in ${elapsed}ms`;
        logEvent(`⚠ Avatar preload timed out: ${result.loaded}/${result.total}`, 'warning');
      } else {
        status.className = 'test-status pass';
        status.textContent = `✅ Complete: ${result.loaded}/${result.total} in ${elapsed}ms`;
        logEvent(`✅ Avatar preload complete: ${result.loaded}/${result.total} in ${elapsed}ms`, 'success');
      }
    } catch (err) {
      status.className = 'test-status fail';
      status.textContent = `❌ Error: ${err.message}`;
      logEvent(`❌ Avatar preload error: ${err.message}`, 'error');
    }
  });
  
  // Click Play button
  document.getElementById('btnClickPlay').addEventListener('click', () => {
    const playBtn = document.getElementById('intro-btn-play');
    if (playBtn) {
      logEvent('=== Clicking Play Button ===', 'info');
      logEvent('Expect: Avatar preload overlay → Progress → Game start', 'info');
      playBtn.click();
    } else {
      logEvent('❌ Play button not found - show intro hub first', 'error');
    }
  });
  
  // Test accessibility
  document.getElementById('btnTestA11y').addEventListener('click', () => {
    const status = document.getElementById('statusA11y');
    logEvent('=== TEST: Accessibility ===', 'info');
    
    // Check if prefers-reduced-motion is honored
    const overlay = document.createElement('div');
    overlay.className = 'intro-avatar-preload-overlay intro-avatar-preload-overlay--visible';
    overlay.innerHTML = '<div class="intro-avatar-preload-spinner"></div>';
    document.body.appendChild(overlay);
    
    const spinner = overlay.querySelector('.intro-avatar-preload-spinner');
    const animation = window.getComputedStyle(spinner).animation;
    
    logEvent(`Spinner animation: ${animation}`, 'info');
    
    // Check ARIA attributes
    const ariaChecks = [
      { attr: 'role', expected: 'alert' },
      { attr: 'aria-live', expected: 'polite' },
      { attr: 'aria-busy', expected: 'true' }
    ];
    
    let passed = true;
    
    // Check if the overlay built by the module has correct attributes
    const builtOverlay = document.getElementById('avatarPreloadOverlay');
    const testOverlay = builtOverlay || overlay;
    
    ariaChecks.forEach(({ attr, expected }) => {
      const actual = testOverlay.getAttribute(attr);
      if (actual === expected) {
        logEvent(`✓ ${attr}="${actual}"`, 'success');
      } else {
        logEvent(`❌ ${attr}="${actual}" (expected "${expected}")`, 'error');
        passed = false;
      }
    });
    
    // Clean up
    overlay.remove();
    
    if (passed) {
      status.className = 'test-status pass';
      status.textContent = '✅ PASS: ARIA attributes correct';
      logEvent('✅ TEST PASSED: Accessibility attributes verified', 'success');
    } else {
      status.className = 'test-status fail';
      status.textContent = '❌ FAIL: Some ARIA attributes missing';
      logEvent('❌ TEST FAILED: Missing accessibility attributes', 'error');
    }
  });
  
  // Clear log
  document.getElementById('btnClearLog').addEventListener('click', () => {
    const log = document.getElementById('eventLog');
    log.innerHTML = '<div class="log-header">📋 Event Log (Cleared)</div>';
    logEvent('Log cleared', 'info');
  });
  
  // Reset all
  document.getElementById('btnReset').addEventListener('click', () => {
    logEvent('=== Resetting All ===', 'info');
    
    // Reset intro screen
    if (introScreen.reset) {
      introScreen.reset();
    }
    
    // Reinitialize
    window.IntroScreen.init({ bus: window.bbGameBus });
    
    // Clear players
    window.game.players = [];
    
    logEvent('✓ All reset - ready for new tests', 'success');
  });
  
  // Listen to events
  const events = [
    'intro:play',
    'intro:open:rules',
    'intro:open:profile',
    'intro:open:leaderboard',
    'intro:open:settings',
    'intro:open:credits',
    'theme:bg-change'
  ];
  
  events.forEach(event => {
    window.bbGameBus.on(event, () => {
      logEvent(`Event: ${event}`, 'info');
    });
  });
  
  // Initial log
  logEvent('Test suite initialized', 'success');
  logEvent('Modules loaded: avatar, avatars-preload, BackgroundTheme, IntroScreen', 'success');
  logEvent('Ready to run tests! Click "Setup Test Players" first.', 'info');
  
})();
</script>

</body>
</html>
