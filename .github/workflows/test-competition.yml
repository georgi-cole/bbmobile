name: Test Competition System

on:
  push:
    branches: [ main ]
    paths:
      - 'js/competition/**'
      - 'test/competition/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'js/competition/**'
      - 'test/competition/**'

jobs:
  test-competition:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Run ResultsCalculator tests
      run: node test/competition/results-calculator.test.mjs

    - name: Run AIPlayer tests
      run: node test/competition/ai-player.test.mjs

    - name: Run StorageAdapter tests
      run: node test/competition/storage-adapter.test.mjs
