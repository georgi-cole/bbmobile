name: Houseguests Grid Screenshots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'css/houseguests-grid.css'
      - 'css/tv-hud.css'
      - 'src/ui/houseguestsGrid.js'
      - 'src/ui/tvHud.js'
      - 'test_houseguests_grid_tv_hud.html'
      - 'scripts/capture_houseguests_grid.mjs'
      - '.github/workflows/screenshot-houseguests.yml'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        npm install
    
    - name: Install Playwright browsers
      run: |
        npx playwright install --with-deps chromium
    
    - name: Capture screenshots
      run: |
        npm run screenshot:houseguests
    
    - name: Upload screenshots as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: houseguests-grid-screenshots
        path: screenshots/houseguests_grid_*.png
        retention-days: 30
    
    - name: List generated screenshots
      run: |
        echo "Generated screenshots:"
        ls -lh screenshots/houseguests_grid_*.png || echo "No screenshots found"
