name: Guard Social Module PR Scope

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'js/social.js'
      - 'js/social-*.js'
      - 'js/socialize-mobile.js'
      - 'js/minigames/social-strings.js'
      - 'js/logic/social/**'
      - 'js/data/config/interactionCatalog.js'
      - 'css/social-maneuvers.css'
      - 'socialize-mobile.css'
      - 'test_social*.html'
      - 'test_social*.spec.js'
      - 'test_socialize*.html'
      - 'test_game_progression_social*'
      - 'test_hotfix_socialize*'
      - 'test_player_social*'
      - 'verify_social*'
      - 'screenshots/social*'
      - 'docs/social*'
      - 'audio/social.mp3'
      - 'SOCIAL*.md'
      - 'SOCIALIZE*.md'

jobs:
  validate-scope:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Check PR scope
      run: |
        echo "Checking files changed in this PR..."
        
        # Get list of changed files
        git fetch origin main
        CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        echo ""
        
        # Define allowed paths for Social module PR
        ALLOWED_PATTERNS=(
          "^js/social\.js$"
          "^js/social-.*\.js$"
          "^js/socialize-mobile\.js$"
          "^js/minigames/social-strings\.js$"
          "^js/logic/social/.*"
          "^js/data/config/interactionCatalog\.js$"
          "^css/social-maneuvers\.css$"
          "^socialize-mobile\.css$"
          "^index\.html$"
          "^\.github/workflows/guard-social-pr\.yml$"
          "^test_social.*\.html$"
          "^test_social.*\.spec\.js$"
          "^test_socialize.*\.html$"
          "^test_game_progression_social.*"
          "^test_hotfix_socialize.*"
          "^test_player_social.*"
          "^verify_social.*"
          "^screenshots/social.*"
          "^docs/social.*"
          "^audio/social\.mp3$"
          "^SOCIAL.*\.md$"
          "^SOCIALIZE.*\.md$"
        )
        
        # Check each changed file
        VIOLATIONS=""
        while IFS= read -r file; do
          if [ -z "$file" ]; then
            continue
          fi
          
          MATCHED=false
          for pattern in "${ALLOWED_PATTERNS[@]}"; do
            if echo "$file" | grep -qE "$pattern"; then
              MATCHED=true
              echo "✓ Allowed: $file"
              break
            fi
          done
          
          if [ "$MATCHED" = false ]; then
            echo "✗ NOT ALLOWED: $file"
            VIOLATIONS="${VIOLATIONS}${file}\n"
          fi
        done <<< "$CHANGED_FILES"
        
        if [ -n "$VIOLATIONS" ]; then
          echo ""
          echo "❌ PR SCOPE VIOLATION"
          echo "The following files are outside the allowed Social module scope:"
          echo -e "$VIOLATIONS"
          echo ""
          echo "This PR should only modify Social-related files."
          echo "Please remove unrelated changes or create a separate PR."
          exit 1
        else
          echo ""
          echo "✅ All changed files are within the allowed Social module scope."
        fi
