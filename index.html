<!-- CRITICAL: Protective guard to prevent destructive window.game reassignment -->
<script>
(function guardGame(){
  const original = window.game || (window.game = {});
  Object.defineProperty(window, 'game', {
    configurable: true,
    get(){ return original; },
    set(v){
      if (v && typeof v === 'object'){
        console.warn('[GameGuard] Merging new properties into window.game instead of replacing');
        Object.assign(original, v);
      } else {
        console.warn('[GameGuard] Ignored non-object game replacement');
      }
    }
  });
  original.cfg = original.cfg || {};
  console.info('[GameGuard] window.game protected from destructive reassignment');
})();
</script>

<!-- Feature Flag: Social Maneuvers (default: enabled, runtime toggleable) -->
<script>
  (function() {
    if (!window.game) window.game = {};
    if (!window.game.cfg) window.game.cfg = {};
    // Default to NEW Social Maneuvers implementation
    // Set to false to use legacy Social
    if (window.game.cfg.enableSocialManeuvers === undefined) {
      window.game.cfg.enableSocialManeuvers = true;
    }
    console.info('[Social FF] enableSocialManeuvers =', window.game.cfg.enableSocialManeuvers);
  })();
</script>

<!-- Mobile Roster Fallback Initializer -->
<script>
(function() {
  'use strict';
  // Redundant fallback to ensure Mobile Roster initializes on iOS Safari
  window.addEventListener('load', function() {
    try {
      var ua = navigator.userAgent || '';
      if (/iPhone|iPod|Android|Mobile/i.test(ua)) {
        window.FORCE_MOBILE_ROSTER = true;
        window.MOBILE_ROSTER_DISABLE_SPOTLIGHT = true;
      }
      if (window.MobileRoster && typeof window.MobileRoster.init === 'function') {
        if (!document.body.getAttribute('data-mobile-roster-active')) {
          console.info('[MobileRoster Fallback] Forcing init on window.load');
          window.MobileRoster.init();
          window.MobileRoster.refresh && window.MobileRoster.refresh();
        }
      }
    } catch(e) { console.error('[MobileRoster Fallback] Error', e); }
  });
})();
</script>

<script type="module">
  import { UICleanup } from './js/ui/uiCleanup.js';
  
  // Wait for game to be initialized
  function initUICleanup() {
    if (!window.game) {
      setTimeout(initUICleanup, 100);
      return;
    }
    
    // Create a minimal event bus if none exists
    if (!window.game.bus) {
      window.game.bus = {
        listeners: {},
        on(event, handler) {
          if (!this.listeners[event]) this.listeners[event] = [];
          this.listeners[event].push(handler);
        },
        emit(event, ...args) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(h => {
              try { h(...args); } catch(e) { console.error(`[EventBus] Error in ${event} handler:`, e); }
            });
          }
          return true;
        }
      };
    }
    
    // Initialize UICleanup with the event bus
    UICleanup.init(window.game.bus);
    console.info('[UICleanup] Initialized with event bus');
    
    // Expose globally for testing and manual cleanup
    window.UICleanup = UICleanup;
  }
  
  // Start initialization when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUICleanup);
  } else {
    initUICleanup();
  }
</script>

<!-- BackgroundTheme Alias Bridge: Ensure window.game.BackgroundTheme exists -->
<script>
(function bridgeBackgroundTheme() {
  'use strict';
  
  // Wait for BackgroundTheme to be available, then establish alias
  const MAX_RETRIES = 20;
  const RETRY_DELAY = 50; // ms
  let attempts = 0;
  
  function tryBridge() {
    attempts++;
    
    if (window.BackgroundTheme) {
      // Ensure window.game exists
      if (!window.game) {
        window.game = {};
      }
      
      // Create alias if not already present
      if (!window.game.BackgroundTheme) {
        window.game.BackgroundTheme = window.BackgroundTheme;
        console.info('[BackgroundThemeBridge] Aliased window.BackgroundTheme to window.game.BackgroundTheme');
      }
      
      // Success - stop retrying
      return true;
    } else if (attempts < MAX_RETRIES) {
      // Keep trying
      setTimeout(tryBridge, RETRY_DELAY);
      return false;
    } else {
      console.warn('[BackgroundThemeBridge] Failed to establish alias after', attempts, 'attempts');
      return false;
    }
  }
  
  // Start trying immediately
  tryBridge();
})();
</script>

<!-- Recovery Watchdog: Ensures IntroScreen appears even if initialization fails -->
<script>
(function recoveryWatchdog() {
  'use strict';
  const WATCHDOG_TIMEOUT = 2500; // ms - wait before checking
  
  // Helper to log telemetry
  function logTelemetry(event, data) {
    if (window.Telemetry && typeof window.Telemetry.log === 'function') {
      window.Telemetry.log(event, data);
    }
  }
  
  // Run watchdog after all scripts have had a chance to load
  setTimeout(() => {
    // Check if IntroScreen API exists (try both namespaces)
    const hasAPI = (window.IntroScreen && typeof window.IntroScreen.showWithPreload === 'function') ||
                   (window.game && window.game.IntroScreen && typeof window.game.IntroScreen.showWithPreload === 'function');
    
    // Check if hub DOM element exists
    const hasElement = !!document.getElementById('introScreen');
    
    // Check if hub should be shown (no game started yet)
    const shouldShow = !window.__bbGameStarted && !window.game?.players?.length;
    
    // Log watchdog check
    logTelemetry('recovery_watchdog_check', { 
      hasAPI, 
      hasElement, 
      shouldShow,
      hasWindowIntroScreen: !!(window.IntroScreen),
      hasGameIntroScreen: !!(window.game && window.game.IntroScreen)
    });
    
    if (!hasAPI) {
      console.error('[RecoveryWatchdog] CRITICAL: IntroScreen API missing after timeout');
      console.error('[RecoveryWatchdog] Attempting recovery by re-fetching IntroScreen.js...');
      
      // Log recovery attempt
      logTelemetry('recovery_watchdog_api_missing', {});
      
      // Attempt recovery by re-loading the script
      const script = document.createElement('script');
      script.src = 'src/ui/IntroScreen.js?recovery=' + Date.now();
      script.onload = () => {
        console.info('[RecoveryWatchdog] IntroScreen.js re-loaded, attempting to show hub');
        
        logTelemetry('recovery_watchdog_script_reloaded', {});
        
        // Get API from either namespace
        const introAPI = window.IntroScreen || (window.game && window.game.IntroScreen);
        
        if (introAPI && typeof introAPI.init === 'function') {
          introAPI.init({ bus: window.bbGameBus });
        }
        if (introAPI && typeof introAPI.showWithPreload === 'function' && shouldShow) {
          introAPI.showWithPreload();
          logTelemetry('recovery_watchdog_show_attempted', {});
        }
      };
      script.onerror = () => {
        console.error('[RecoveryWatchdog] FATAL: Failed to re-load IntroScreen.js');
        logTelemetry('recovery_watchdog_reload_failed', {});
      };
      document.body.appendChild(script);
      return;
    }
    
    if (!hasElement && shouldShow) {
      console.warn('[RecoveryWatchdog] Hub element missing but API exists - attempting to show hub');
      
      logTelemetry('recovery_watchdog_element_missing', { hasAPI, shouldShow });
      
      // Get API from either namespace
      const introAPI = window.IntroScreen || (window.game && window.game.IntroScreen);
      
      if (introAPI && typeof introAPI.showWithPreload === 'function') {
        introAPI.showWithPreload();
        logTelemetry('recovery_watchdog_show_attempted', {});
      }
      return;
    }
    
    // Everything looks good
    if (hasAPI && hasElement) {
      console.info('[RecoveryWatchdog] IntroScreen healthy - API and element present');
      logTelemetry('recovery_watchdog_healthy', { hasAPI, hasElement });
    } else if (hasAPI && !shouldShow) {
      console.info('[RecoveryWatchdog] IntroScreen API present, game already started');
      logTelemetry('recovery_watchdog_game_started', { hasAPI, shouldShow });
    }
  }, WATCHDOG_TIMEOUT);
})();
</script>

<script>
(function(){
  // Skip button handling moved to progress bar - no longer needed
  
  // Update timer header with week, phase, and next phase info
  function updateTimerHeader(){
    const game = window.game || {};
    const seasonBadge = document.getElementById('timerSeasonBadge');
    const weekBadge = document.getElementById('timerWeekBadge');
    const phaseName = document.getElementById('timerPhaseName');
    
    // Update season
    if(seasonBadge){
      const season = game.season || 1;
      seasonBadge.textContent = `Season ${season}`;
    }
    
    if(weekBadge && phaseName){
      // Determine week text
      let aliveCount = 0;
      try{ aliveCount = (window.alivePlayers?.() || []).length; }catch{}
      
      let weekText = 'Week 1';
      if(game.phase && game.phase !== 'lobby'){
        if(aliveCount <= 2){
          weekText = 'Final';
        } else {
          weekText = `Week ${game.week || 1}`;
        }
      }
      weekBadge.textContent = weekText;
      
      // Determine phase name (full name instead of abbreviation)
      let phaseText = '';
      if(game.phase && game.phase !== 'lobby'){
        phaseText = getFullPhaseName(game.phase);
      }
      phaseName.textContent = phaseText;
    }
    
    // Also update the main dashboard title header
    updateDashboardHeader();
    
    // Update compact HUD if available
    if(window.CompactHud && typeof window.CompactHud.update === 'function'){
      window.CompactHud.update();
    }
  }
  
  // Helper function to get full phase name for tooltip
  function getFullPhaseName(phase){
    const fullNames = {
      'opening': 'Season Premiere',
      'intermission': 'Strategizing',
      'hoh': 'HOH Competition',
      'nominations': 'Nominations',
      'veto_comp': 'Veto Competition',
      'veto': 'Veto Competition',
      'veto_ceremony': 'Veto Ceremony',
      'livevote': 'Eviction',
      'jury': 'Jury Deliberation',
      'return_twist': 'Return Challenge',
      'final3_comp1': 'Final 3 – Part 1',
      'final3_comp2': 'Final 3 – Part 2',
      'final3_decision': 'Final 3 – Decision',
      'social': 'Social Time',
      'social_intermission': 'Social Time'
    };
    return fullNames[phase] || phase;
  }
  
  // Update main dashboard title header with week and phase info
  function updateDashboardHeader(){
    const game = window.game || {};
    const weekBadge = document.getElementById('dashboardWeekBadge');
    const phaseName = document.getElementById('dashboardPhaseName');
    
    if(weekBadge && phaseName){
      // Determine week text
      let aliveCount = 0;
      try{ aliveCount = (window.alivePlayers?.() || []).length; }catch{}
      
      let weekText = 'House';
      if(game.phase && game.phase !== 'lobby'){
        if(aliveCount <= 2){
          weekText = 'Final Week';
        } else {
          weekText = `Week ${game.week || 1}`;
        }
      }
      weekBadge.textContent = weekText;
      
      // Determine phase name
      let phaseText = '';
      if(game.phase && game.phase !== 'lobby'){
        const phaseNames = {
          'opening': 'Season Premiere',
          'intermission': 'Strategizing',
          'hoh': 'HOH Competition',
          'nominations': 'Nominations',
          'veto_comp': 'Veto Competition',
          'veto': 'Veto Competition',
          'veto_ceremony': 'Veto Ceremony',
          'livevote': 'Eviction',
          'jury': 'Jury Deliberation',
          'return_twist': 'Return Challenge',
          'final3_comp1': 'Final 3 – Part 1',
          'final3_comp2': 'Final 3 – Part 2',
          'final3_decision': 'Final 3 – Decision',
          'social': 'Social Time'
        };
        phaseText = phaseNames[game.phase] || game.phase.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      }
      phaseName.textContent = phaseText;
      phaseName.title = phaseText; // Tooltip for truncated text
    }
  }
  
  // Expose to window for external access
  window.updateDashboardHeader = updateDashboardHeader;

  // Hover: Winner/Runner-up/12th... on top roster tiles
  function placementsHover(){
    const ord = n => { n=+n; const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
    const getEvictWeek = p => p?.evictWeek ?? p?.evictedWeek ?? p?.weekEvicted ?? p?.evictionWeek ?? p?.evict_wk ?? null;
    const isWinner   = p => !!(p.winner||p.isWinner||p.finalPlace===1||p.place===1||p.rank===1);
    const isRunnerUp = p => !!(p.runnerUp||p.isRunnerUp||p.finalPlace===2||p.place===2||p.rank===2);
    const nameOf = p => (p?.name||p?.Name||p?.displayName||'').trim().toLowerCase();

    function computePlacements(){
      const players = (window.game?.players || window.players || []).slice();
      if (!players.length) return new Map();
      const total = players.length;
      const ev = players
        .filter(p => !!(p.evicted || p.state==='evicted' || getEvictWeek(p)!=null))
        .sort((a,b)=>{ const aw=getEvictWeek(a), bw=getEvictWeek(b);
          if (aw!=null&&bw!=null) return aw-bw; if (aw!=null) return -1; if (bw!=null) return 1; return 0; });
      const m = new Map();
      ev.forEach((p,i)=> m.set(nameOf(p), ord(total - i)));
      players.forEach(p=>{ const nm=nameOf(p); if (!nm) return;
        if (isWinner(p)) m.set(nm,'Winner'); else if (isRunnerUp(p)) m.set(nm,'Runner-up'); });
      return m;
    }

    function apply(){
      const map = computePlacements();
      document.querySelectorAll('.top-roster-tile').forEach(tile=>{
        const nm = (tile.querySelector('.top-tile-name')?.textContent||'').trim().toLowerCase();
        const label = map.get(nm);
        if (label){ tile.title = label; tile.dataset.placeLabel = label; }
      });
    }

    const host = document.querySelector('.top-roster-row') || document.getElementById('panel') || document.getElementById('actionCard');
    if (!host){ setTimeout(placementsHover, 400); return; }
    apply();
    const mo = new MutationObserver(apply);
    mo.observe(host, { childList:true, subtree:true, characterData:true });
    window.addEventListener('bb:eviction', apply, { passive:true });
    window.addEventListener('bb:winner', apply, { passive:true });
  }

  // Add Rules button between Settings and Start
  function ensureRulesButton(){
    const topbar = document.querySelector('.topbar');
    if(!topbar) return;
    
    // Check if Rules button already exists
    if(document.getElementById('btnRules')) return;
    
    const settingsBtn = document.getElementById('btnOpenSettings');
    const startBtn = document.getElementById('btnStartQuick');
    if(!settingsBtn || !startBtn) return;
    
    const rulesBtn = document.createElement('button');
    rulesBtn.id = 'btnRules';
    rulesBtn.className = 'btn iconOnly';
    rulesBtn.textContent = '📋';
    rulesBtn.setAttribute('aria-label', 'Rules');
    rulesBtn.setAttribute('title', 'Rules');
    
    rulesBtn.onclick = ()=>{
      // Use the new showRulesModal function from rules.js
      if(typeof window.showRulesModal === 'function'){
        window.showRulesModal();
      }
    };
    
    // Insert after Settings button
    settingsBtn.parentNode.insertBefore(rulesBtn, startBtn);
  }
  
  // Add Profile button between Rules and Start
  function ensureProfileButton(){
    const topbar = document.querySelector('.topbar');
    if(!topbar) return;
    
    // Check if Profile button already exists
    if(document.getElementById('btnProfile')) return;
    
    const startBtn = document.getElementById('btnStartQuick');
    if(!startBtn) return;
    
    const profileBtn = document.createElement('button');
    profileBtn.id = 'btnProfile';
    profileBtn.className = 'btn iconOnly';
    profileBtn.textContent = '👤';
    profileBtn.setAttribute('aria-label', 'Profile');
    profileBtn.setAttribute('title', 'Switch Profile');
    
    profileBtn.onclick = ()=>{
      // Use the showProfileModal function from player-profile-modal.js
      if(typeof window.showProfileModal === 'function'){
        window.showProfileModal();
      }
    };
    
    // Insert before Start button
    startBtn.parentNode.insertBefore(profileBtn, startBtn);
  }
  
  // Initialize skip progress bar
  function initSkipProgressBar(){
    const progressBar = document.getElementById('timerSkipProgressBar');
    const progressFill = document.getElementById('timerSkipProgressFill');
    
    if(!progressBar) return;
    
    // Handle click on progress bar to skip
    const handleSkip = () => {
      // Directly call fastForwardPhase if available
      if(typeof window.fastForwardPhase === 'function'){
        window.fastForwardPhase();
      } else if(typeof window.advancePhase === 'function'){
        window.advancePhase();
      } else {
        console.warn('[Skip Progress Bar] No skip function available');
      }
    };
    
    // Mouse/touch click
    progressBar.addEventListener('click', handleSkip);
    
    // Keyboard accessibility (Enter or Space)
    progressBar.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        handleSkip();
      }
    });
    
    // Update progress bar based on timer
    // This will be called by the timer update logic
    window.updateSkipProgress = (elapsed, total) => {
      if(!progressFill || !total) return;
      
      // Progress depletes right-to-left (width decreases as time runs out)
      const percentage = Math.max(0, Math.min(100, ((total - elapsed) / total) * 100));
      progressFill.style.width = `${percentage}%`;
    };
  }
  
  function init(){ 
    initSkipProgressBar();
    
    // Initialize compact HUD
    const hudContainer = document.getElementById('compactHud');
    if(hudContainer && window.CompactHud){
      window.CompactHud.init(hudContainer);
    }
    
    placementsHover(); 
    ensureRulesButton();
    ensureProfileButton();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once:true });
  else init();
  
  // Expose updateTimerHeader globally so it can be called from ui.hud-and-router.js
  window.updateTimerHeader = updateTimerHeader;
})();
</script>
