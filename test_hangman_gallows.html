<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman Gallows Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e3ecf5;
      min-height: 100vh;
    }
    #test-container {
      max-width: 800px;
      margin: 0 auto;
      background: #0f1419;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #5bd68a;
      margin-bottom: 20px;
    }
    .info {
      background: #1a2a3a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #83bfff;
    }
    #game-host {
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div id="test-container">
    <h1>🎮 Hangman Gallows Test</h1>
    <div class="info">
      <strong>Testing:</strong> Graphical gallows with 6-stage figure progression
      <br><strong>Expected:</strong> Body parts appear progressively with each wrong guess
      <br><strong>Stages:</strong> 1=head, 2=torso, 3=left arm, 4=right arm, 5=left leg, 6=right leg
    </div>
    <div id="game-host"></div>
  </div>

  <script type="module">
    // Initialize minimal game globals
    window.game = window.game || {};
    window.MinigameModules = window.MinigameModules || {};
    window.MiniGames = window.MiniGames || {};

    // Load the hangman module
    const module = await import('./js/minigames/hangman.js');
    
    console.log('Hangman module loaded');
    console.log('MinigameModules:', window.MinigameModules);
    
    // Render the game
    const host = document.getElementById('game-host');
    
    function onComplete(score) {
      console.log('Game completed with score:', score);
      
      setTimeout(() => {
        const again = confirm('Play again?');
        if(again) {
          host.innerHTML = '';
          if(window.MinigameModules.hangman) {
            window.MinigameModules.hangman.render(host, onComplete, { debugMode: true });
          }
        }
      }, 100);
    }
    
    if(window.MinigameModules.hangman) {
      window.MinigameModules.hangman.render(host, onComplete, { debugMode: true });
    } else {
      host.innerHTML = '<p style="color:#ff6b9d;">Error: Hangman module not loaded</p>';
    }
  </script>
</body>
</html>
