<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Maneuvers E2E - Simple Test</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="socialize-mobile.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #0a0f1a;
      color: #fff;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #1a2d45, #0f1e32);
      border: 1px solid rgba(100, 180, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { color: #4a90e2; margin: 0 0 10px 0; }
    .test-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(100, 180, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-step {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid #4a90e2;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .test-step h3 {
      margin: 0 0 10px 0;
      color: #66b3ff;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .status-pass { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
    .status-fail { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    .test-btn {
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin: 5px;
    }
    .test-btn:hover {
      background: linear-gradient(135deg, #5a9ff2, #4585c7);
    }
    .log {
      background: #000;
      border: 1px solid rgba(100, 180, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-info { color: #2196f3; }
    .log-success { color: #4caf50; }
    .log-error { color: #f44336; }
    #tv {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      margin: 20px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .tvViewport {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tvOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎮 Social Maneuvers E2E Test</h1>
      <p>Automated end-to-end verification of all implemented features</p>
    </div>

    <div class="test-panel">
      <h2>Test Results</h2>
      <div id="results"></div>
      <button class="test-btn" onclick="runTests()" id="runBtn">▶ Run All Tests</button>
    </div>

    <div class="test-panel">
      <h2>Console Logs</h2>
      <div class="log" id="consoleLog"></div>
    </div>

    <div class="test-panel">
      <h2>Live Game View</h2>
      <div id="tv">
        <div class="tvViewport">
          <h2 style="color: #4a90e2;">Big Brother Game</h2>
          <div id="phaseDisplay">Phase: Initializing...</div>
        </div>
        <div id="tvOverlay"></div>
      </div>
    </div>
  </div>

  <script>window.global = window;</script>
  <script>
    // Game setup
    window.game = {
      cfg: { enableSocialManeuvers: true, tComms: 180 },
      phase: 'none',
      week: 1,
      humanId: 1,
      endAt: null,
      phaseEndsAt: null,
      players: [
        { id: 1, name: 'Alice', affinity: {2: 0.1, 3: -0.1, 4: 0.3}, evicted: false },
        { id: 2, name: 'Bob', affinity: {1: 0.15, 3: 0.2, 4: -0.05}, evicted: false },
        { id: 3, name: 'Charlie', affinity: {1: -0.05, 2: 0.25, 4: 0.1}, evicted: false },
        { id: 4, name: 'Diana', affinity: {1: 0.35, 2: 0.0, 3: 0.15}, evicted: false }
      ]
    };
    
    window.getP = (id) => window.game.players.find(p => p.id === id);
    window.alivePlayers = () => window.game.players.filter(p => !p.evicted);
    window.safeName = (id) => window.getP(id)?.name || `Player ${id}`;
    window.updateHud = () => log('[updateHud] HUD refreshed', 'info');
    
    window.GameTimer = {
      pause: () => { log('[GameTimer] ⏸️ Paused', 'success'); GameTimer._paused = true; },
      resume: () => { log('[GameTimer] ▶️ Resumed', 'success'); GameTimer._paused = false; },
      _paused: false
    };
    
    window.setPhase = function(phase, duration, callback) {
      log(`[setPhase] → ${phase} (${duration}s)`, 'info');
      window.game.phase = phase;
      window.game.endAt = Date.now() + (duration * 1000);
      window.game.phaseEndsAt = window.game.endAt;
      document.getElementById('phaseDisplay').textContent = `Phase: ${phase}`;
      if (callback) window._phaseCallback = callback;
    };
    
    function log(msg, type = 'info') {
      const logDiv = document.getElementById('consoleLog');
      const entry = document.createElement('div');
      entry.className = `log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }
    
    function addResult(title, status, details) {
      const div = document.createElement('div');
      div.className = 'test-step';
      div.innerHTML = `
        <h3>${title} <span class="status status-${status}">${status.toUpperCase()}</span></h3>
        <p>${details}</p>
      `;
      document.getElementById('results').appendChild(div);
    }
    
    async function runTests() {
      document.getElementById('runBtn').disabled = true;
      document.getElementById('results').innerHTML = '';
      document.getElementById('consoleLog').innerHTML = '';
      
      log('=== Starting E2E Test Suite ===', 'success');
      
      // Test 1: Initialize
      try {
        log('TEST 1: Initialize Game', 'info');
        if (!window.SocialManeuvers) throw new Error('SocialManeuvers not loaded');
        window.game.players.forEach(p => window.SocialManeuvers.SocialResources.init(p.id));
        addResult('1. Initialize Game', 'pass', 'Social Maneuvers loaded, resources initialized');
        log('✓ Test 1 passed', 'success');
      } catch (e) {
        addResult('1. Initialize Game', 'fail', e.message);
        log(`✗ Test 1 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 2: Enter social_intermission
      try {
        log('TEST 2: Enter social_intermission', 'info');
        window.setPhase('social_intermission', 180, () => {});
        await new Promise(r => setTimeout(r, 500));
        
        const launcher = document.querySelector('#socializeLauncher');
        if (!launcher) throw new Error('Launcher not mounted');
        
        const resources = window.SocialManeuvers.SocialResources.getAll(1);
        addResult('2. Enter social_intermission', 'pass', 
          `Launcher mounted. Energy: ${resources.energy}, Influence: ${resources.influence}, Info: ${resources.information}`);
        log('✓ Test 2 passed', 'success');
      } catch (e) {
        addResult('2. Enter social_intermission', 'fail', e.message);
        log(`✗ Test 2 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 3: Mount target fallback
      try {
        log('TEST 3: Test Mount Target Fallback', 'info');
        const tvOverlay = document.querySelector('#tvOverlay');
        if (tvOverlay) tvOverlay.remove();
        await new Promise(r => setTimeout(r, 300));
        
        const newOverlay = document.querySelector('#tvOverlay');
        if (!newOverlay) throw new Error('Fallback not created');
        
        addResult('3. Mount Target Fallback', 'pass', 'Fallback #tvOverlay created successfully');
        log('✓ Test 3 passed', 'success');
      } catch (e) {
        addResult('3. Mount Target Fallback', 'fail', e.message);
        log(`✗ Test 3 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 4: Open modal & pause timer
      try {
        log('TEST 4: Open Socialize Modal', 'info');
        if (window.SocializeMobile?.openModal) {
          window.SocializeMobile.openModal();
          await new Promise(r => setTimeout(r, 400));
          
          const modal = document.querySelector('#socializeModal');
          if (!modal) throw new Error('Modal not opened');
          
          const timerPaused = window.GameTimer._paused;
          addResult('4. Open Modal & Pause Timer', 'pass', 
            `Modal opened. Timer paused: ${timerPaused}. Backdrop created.`);
          log('✓ Test 4 passed', 'success');
        } else {
          throw new Error('SocializeMobile.openModal not available');
        }
      } catch (e) {
        addResult('4. Open Modal & Pause Timer', 'fail', e.message);
        log(`✗ Test 4 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 5: Execute action
      try {
        log('TEST 5: Execute Social Action', 'info');
        const result = window.SocialManeuvers.executeAction(1, 2, 'smalltalk', []);
        if (!result.success) throw new Error(`Action failed: ${result.reason}`);
        
        const resources = window.SocialManeuvers.SocialResources.getAll(1);
        addResult('5. Execute Action', 'pass', 
          `Action executed via engine. Outcome: ${result.outcome?.type}. Energy: ${resources.energy}`);
        log('✓ Test 5 passed', 'success');
      } catch (e) {
        addResult('5. Execute Action', 'fail', e.message);
        log(`✗ Test 5 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 6: Close modal & resume timer
      try {
        log('TEST 6: Close Modal & Resume Timer', 'info');
        if (window.SocializeMobile?.closeModal) {
          window.SocializeMobile.closeModal();
          await new Promise(r => setTimeout(r, 400));
          
          const modal = document.querySelector('#socializeModal');
          if (modal) throw new Error('Modal still exists');
          
          const timerResumed = !window.GameTimer._paused;
          addResult('6. Close Modal & Resume Timer', 'pass', 
            `Modal closed. Timer resumed: ${timerResumed}`);
          log('✓ Test 6 passed', 'success');
        } else {
          throw new Error('SocializeMobile.closeModal not available');
        }
      } catch (e) {
        addResult('6. Close Modal & Resume Timer', 'fail', e.message);
        log(`✗ Test 6 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 7: Exit phase & summary
      try {
        log('TEST 7: Exit Phase & Generate Summary', 'info');
        window.setPhase('nominations', 60, () => {});
        await new Promise(r => setTimeout(r, 500));
        
        const launcher = document.querySelector('#socializeLauncher');
        const hidden = !launcher || launcher.style.display === 'none';
        
        const summary = window.game.__latestSocialSummary;
        const summaryGenerated = !!summary;
        
        addResult('7. Exit Phase & Summary', 'pass', 
          `Launcher hidden: ${hidden}. Summary generated: ${summaryGenerated}`);
        log('✓ Test 7 passed', 'success');
      } catch (e) {
        addResult('7. Exit Phase & Summary', 'fail', e.message);
        log(`✗ Test 7 failed: ${e.message}`, 'error');
      }
      
      await new Promise(r => setTimeout(r, 500));
      
      // Test 8: Weekly reset
      try {
        log('TEST 8: Weekly Reset', 'info');
        window.SocialManeuvers.SocialResources.recordWeeklyEvent(1, 'hohWin', true);
        window.game.week = 2;
        
        if (window.socialOnNewWeek) {
          window.socialOnNewWeek();
          await new Promise(r => setTimeout(r, 200));
          
          const resources = window.SocialManeuvers.SocialResources.getAll(1);
          addResult('8. Weekly Reset', 'pass', 
            `Energy reset: ${resources.energy} (base 5 + HOH bonus 5)`);
          log('✓ Test 8 passed', 'success');
        } else {
          throw new Error('socialOnNewWeek not available');
        }
      } catch (e) {
        addResult('8. Weekly Reset', 'fail', e.message);
        log(`✗ Test 8 failed: ${e.message}`, 'error');
      }
      
      log('', 'info');
      log('═══════════════════════════', 'success');
      log('✓ ALL TESTS COMPLETED', 'success');
      log('═══════════════════════════', 'success');
    }
  </script>
  
  <script src="js/social-action-config.js"></script>
  <script src="js/social-maneuvers.js"></script>
  <script src="js/social-maneuvers-launcher-bootstrap.js"></script>
  <script src="js/socialize-mobile.js"></script>
  <script src="js/social.js"></script>
</body>
</html>
