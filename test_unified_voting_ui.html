<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Unified Voting UI</title>
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/tv-screen.css">
  
  <style>
    body {
      background: #0a0f16;
      color: #e8f4ff;
      padding: 20px;
    }
    
    #tv {
      margin: 20px auto;
      max-width: 1200px;
    }
    
    .test-controls {
      text-align: center;
      margin: 20px auto;
      max-width: 800px;
    }
    
    .test-btn {
      padding: 12px 24px;
      margin: 8px;
      background: #00e0cc;
      color: #001a18;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    
    .test-btn:hover {
      transform: scale(1.05);
    }
    
    h2 {
      color: #00e0cc;
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h2>Test Unified Voting UI - Grid Selector</h2>
  
  <div class="test-controls">
    <button class="test-btn" onclick="testVoting2()">Test Voting (2 nominees)</button>
    <button class="test-btn" onclick="testVoting4()">Test Voting (4 nominees)</button>
    <button class="test-btn" onclick="testNomination2()">Test Nomination (2 nominees)</button>
    <button class="test-btn" onclick="testNomination3()">Test Nomination (3 nominees)</button>
  </div>
  
  <div id="tv">
    <div class="tvViewport">
      <div class="tvNow" id="tvNow">Ready to test</div>
      <div id="tvOverlay"></div>
    </div>
  </div>
  
  <div id="output" style="max-width: 800px; margin: 20px auto; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 8px;">
    <h3 style="color: #00e0cc;">Console Output:</h3>
    <div id="log"></div>
  </div>
  
  <script>
    // Mock global namespace
    window.global = window;
    
    // Mock players
    window.players = [
      { id: 1, name: 'Alice', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Alice', affinity: {2: 0.5, 3: -0.5, 4: 0.3, 5: -0.2} },
      { id: 2, name: 'Bob', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Bob', affinity: {1: 0.6, 3: 0.2, 4: -0.4, 5: 0.1} },
      { id: 3, name: 'Charlie', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Charlie', affinity: {1: -0.3, 2: 0.4, 4: 0.5, 5: -0.6} },
      { id: 4, name: 'Diana', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Diana', affinity: {1: 0.2, 2: -0.5, 3: 0.6, 5: 0.3} },
      { id: 5, name: 'Eve', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Eve', affinity: {1: -0.4, 2: 0.3, 3: -0.7, 4: 0.2} }
    ];
    
    window.getP = function(id) {
      return window.players.find(p => p.id === id);
    };
    
    window.safeName = function(id) {
      const p = window.getP(id);
      return p ? p.name : 'Unknown';
    };
    
    window.resolveAvatar = function(player) {
      return player.avatar || 'https://api.dicebear.com/6.x/bottts/svg?seed=default';
    };
    
    // Logging
    function log(msg) {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      entry.style.padding = '4px 0';
      entry.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
      logEl.appendChild(entry);
      console.log(msg);
    }
    
    // Test functions
    function testVoting2() {
      log('Testing voting UI with 2 nominees');
      document.getElementById('tvNow').textContent = 'Cast your vote to evict.';
      
      window.FullscreenGridSelector.show({
        candidates: [1, 2], // Alice, Bob
        required: 1,
        title: 'Cast your vote to evict.',
        confirmText: 'Evict',
        actorId: 4, // Diana voting
        showRelations: false,
        onConfirm: (selectedIds) => {
          log(`Vote confirmed: ${window.safeName(selectedIds[0])}`);
          document.getElementById('tvNow').textContent = `Voted to evict ${window.safeName(selectedIds[0])}`;
        },
        onCancel: () => {
          log('Vote cancelled');
          document.getElementById('tvNow').textContent = 'Ready to test';
        }
      });
    }
    
    function testVoting4() {
      log('Testing voting UI with 4 nominees');
      document.getElementById('tvNow').textContent = 'Cast your vote to evict.';
      
      window.FullscreenGridSelector.show({
        candidates: [1, 2, 3, 5], // Alice, Bob, Charlie, Eve
        required: 1,
        title: 'Cast your vote to evict.',
        confirmText: 'Evict',
        actorId: 4, // Diana voting
        showRelations: false,
        onConfirm: (selectedIds) => {
          log(`Vote confirmed: ${window.safeName(selectedIds[0])}`);
          document.getElementById('tvNow').textContent = `Voted to evict ${window.safeName(selectedIds[0])}`;
        },
        onCancel: () => {
          log('Vote cancelled');
          document.getElementById('tvNow').textContent = 'Ready to test';
        }
      });
    }
    
    function testNomination2() {
      log('Testing nomination UI with 2 nominees required');
      document.getElementById('tvNow').textContent = 'Select 2 nominees.';
      
      window.FullscreenGridSelector.show({
        candidates: [1, 2, 3, 5], // All except HOH (Diana)
        required: 2,
        title: 'Select your nominees',
        confirmText: 'Nominate',
        actorId: 4, // Diana is HOH
        showRelations: true, // Show ally/enemy indicators
        onConfirm: (selectedIds) => {
          log(`Nominations confirmed: ${selectedIds.map(id => window.safeName(id)).join(', ')}`);
          document.getElementById('tvNow').textContent = `Nominated: ${selectedIds.map(id => window.safeName(id)).join(', ')}`;
        },
        onCancel: () => {
          log('Nomination cancelled');
          document.getElementById('tvNow').textContent = 'Ready to test';
        }
      });
    }
    
    function testNomination3() {
      log('Testing nomination UI with 3 nominees required');
      document.getElementById('tvNow').textContent = 'Select 3 nominees.';
      
      window.FullscreenGridSelector.show({
        candidates: [1, 2, 3, 5], // All except HOH (Diana)
        required: 3,
        title: 'Select your nominees',
        confirmText: 'Nominate',
        actorId: 4, // Diana is HOH
        showRelations: true, // Show ally/enemy indicators
        onConfirm: (selectedIds) => {
          log(`Nominations confirmed: ${selectedIds.map(id => window.safeName(id)).join(', ')}`);
          document.getElementById('tvNow').textContent = `Nominated: ${selectedIds.map(id => window.safeName(id)).join(', ')}`;
        },
        onCancel: () => {
          log('Nomination cancelled');
          document.getElementById('tvNow').textContent = 'Ready to test';
        }
      });
    }
  </script>
  
  <script src="js/ui/fullscreen-grid-selector.js"></script>
</body>
</html>
