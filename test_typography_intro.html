<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Typography Intro Screen Test - BBMobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/intro.css">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10000;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 8px;
    max-width: 300px;
  }
  .controls h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #fff;
  }
  .controls button {
    display: block;
    width: 100%;
    margin: 5px 0;
    padding: 8px;
    background: #0088ff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls button:hover {
    background: #0099ff;
  }
  .controls .info {
    margin: 10px 0;
    padding: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    font-size: 12px;
    color: #fff;
  }
  #eventLog {
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 10000;
    background: rgba(0,0,0,0.9);
    padding: 10px;
    border-radius: 8px;
    max-width: 400px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 11px;
    font-family: monospace;
    color: #fff;
  }
  #eventLog .event {
    margin: 2px 0;
    padding: 4px;
    border-left: 2px solid #00d4ff;
    padding-left: 8px;
  }
</style>
</head>
<body>

<div class="controls">
  <h3>Typography Test Controls</h3>
  <button id="btnShow">Show IntroScreen</button>
  <button id="btnHide">Hide IntroScreen</button>
  <div class="info">
    <strong>Test Focus:</strong> Typography utilities on intro screen (text-label, text-heading-lg, text-body)
  </div>
</div>

<div id="eventLog">
  <strong>Event Log:</strong>
</div>

<!-- Load dependencies -->
<script src="js/bbGameBus.js"></script>
<script src="src/utils/backgroundTheme.js"></script>
<script src="src/ui/IntroScreen.js"></script>

<script>
(function() {
  'use strict';
  
  // Initialize game bus
  if (!window.game) window.game = {};
  window.game.bus = window.bbGameBus;
  
  // Mock audio controls for testing
  window.game.audio = {
    toggleMusic: function() {
      logEvent('Music toggled');
      return true;
    },
    toggleSound: function() {
      logEvent('Sound toggled');
      return true;
    },
    setMusicEnabled: function(enabled) {
      logEvent(`Music ${enabled ? 'enabled' : 'disabled'}`);
    },
    setSfxEnabled: function(enabled) {
      logEvent(`SFX ${enabled ? 'enabled' : 'disabled'}`);
    }
  };
  
  // Mock global functions for button actions
  window.game.showRulesModal = function() {
    logEvent('Rules modal opened');
  };
  
  window.game.showProfileModal = function() {
    logEvent('Profile modal opened');
  };
  
  window.game.showLeaderboard = function() {
    logEvent('Leaderboard opened');
  };
  
  window.game.showCreditsModal = function() {
    logEvent('Credits modal opened');
  };
  
  window.game.enterGame = function() {
    logEvent('Play button clicked - entering game');
  };
  
  // Initialize BackgroundTheme
  const bgTheme = window.BackgroundTheme.init({ bus: window.bbGameBus });
  
  // Initialize IntroScreen
  const introScreen = window.IntroScreen.init({ bus: window.bbGameBus });
  
  // Listen to all intro events
  const events = [
    'intro:play',
    'intro:open:rules',
    'intro:open:profile',
    'intro:open:leaderboard',
    'intro:open:settings',
    'intro:open:credits',
    'intro:open:help',
    'theme:bg-change'
  ];
  
  events.forEach(event => {
    window.bbGameBus.on(event, (data) => {
      logEvent(`Event: ${event}`, data);
    });
  });
  
  // Button handlers
  document.getElementById('btnShow').addEventListener('click', () => {
    introScreen.show();
    logEvent('Show IntroScreen');
  });
  
  document.getElementById('btnHide').addEventListener('click', () => {
    introScreen.hide();
    logEvent('Hide IntroScreen');
  });
  
  // Log events
  function logEvent(message, data) {
    const log = document.getElementById('eventLog');
    const entry = document.createElement('div');
    entry.className = 'event';
    entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
    if (data && typeof data === 'object') {
      entry.textContent += ` ${JSON.stringify(data, null, 2)}`;
    }
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }
  
  logEvent('Typography test initialized - check for title group with .text-label, .text-heading-lg, .text-body classes');
  
  // Auto-show after 1 second for demo
  setTimeout(() => {
    introScreen.show();
    logEvent('Auto-showing IntroScreen with typography');
    
    // Log typography elements after 2 seconds
    setTimeout(() => {
      const label = document.querySelector('.intro-screen__label');
      const title = document.querySelector('.intro-screen__title');
      const subtitle = document.querySelector('.intro-screen__subtitle');
      
      if (label && title && subtitle) {
        logEvent('✓ Typography elements found', {
          label: label.textContent,
          title: title.textContent,
          subtitle: subtitle.textContent.substring(0, 50) + '...'
        });
      } else {
        logEvent('✗ Typography elements NOT found');
      }
    }, 2000);
  }, 1000);
  
})();
</script>

</body>
</html>
