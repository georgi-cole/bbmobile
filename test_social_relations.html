<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Relations Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1, h2, h3 { color: #ff9933; }
    .test-section {
      background: #2a2a2a;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
    }
    .pass {
      background: #1a3a1a;
      border-left: 4px solid #4caf50;
    }
    .fail {
      background: #3a1a1a;
      border-left: 4px solid #f44336;
    }
    .info {
      background: #1a2a3a;
      border-left: 4px solid #2196f3;
    }
    button {
      background: #ff9933;
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background: #ffaa55;
    }
    pre {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .player-card {
      background: #333;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #555;
    }
    .player-name {
      font-weight: bold;
      color: #ff9933;
      margin-bottom: 10px;
    }
    .affinity-list {
      font-size: 0.9em;
    }
    .affinity-list dt {
      color: #aaa;
      font-weight: bold;
      margin-top: 8px;
    }
    .affinity-list dd {
      margin: 4px 0 4px 10px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Social Relations System Test</h1>
  
  <div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="testClassification()">Test Classification</button>
    <button onclick="testHysteresis()">Test Hysteresis</button>
    <button onclick="testWeeklyReset()">Test Weekly Reset</button>
    <button onclick="testVisibilityGate()">Test Week 2 Gate</button>
    <button onclick="visualizeRelations()">Visualize Relations</button>
    <button onclick="seedTestData()">Seed Test Data</button>
    <button onclick="clearResults()">Clear Results</button>
  </div>
  
  <div id="results" class="test-section">
    <h2>Test Results</h2>
    <div id="testOutput"></div>
  </div>
  
  <div id="visualization" class="test-section" style="display:none;">
    <h2>Relations Visualization</h2>
    <div id="vizOutput"></div>
  </div>

  <!-- Load minimal dependencies -->
  <script>
    // Minimal game state setup
    window.game = {
      cfg: {},
      week: 1,
      phase: 'lobby',
      players: [],
      __relationsHistory: new Map()
    };
    
    window.alivePlayers = function() {
      return window.game.players.filter(p => !p.evicted);
    };
    
    window.addLog = function(msg, type) {
      console.log(`[LOG:${type}] ${msg}`);
    };
  </script>
  
  <!-- Load the module under test -->
  <script src="js/social-relations.js"></script>
  
  <script>
    // Test utilities
    function logResult(message, passed = true) {
      const output = document.getElementById('testOutput');
      const div = document.createElement('div');
      div.className = `test-result ${passed ? 'pass' : 'fail'}`;
      div.textContent = `${passed ? '✓' : '✗'} ${message}`;
      output.appendChild(div);
      console.log(`${passed ? 'PASS' : 'FAIL'}: ${message}`);
    }
    
    function logInfo(message) {
      const output = document.getElementById('testOutput');
      const div = document.createElement('div');
      div.className = 'test-result info';
      div.textContent = `ℹ ${message}`;
      output.appendChild(div);
      console.log(`INFO: ${message}`);
    }
    
    function clearResults() {
      document.getElementById('testOutput').innerHTML = '';
      document.getElementById('vizOutput').innerHTML = '';
      document.getElementById('visualization').style.display = 'none';
    }
    
    // Create test players
    function createTestPlayers() {
      window.game.players = [
        { id: 1, name: 'Alice', human: true, evicted: false, affinity: {}, stats: {} },
        { id: 2, name: 'Bob', human: false, evicted: false, affinity: {}, stats: {} },
        { id: 3, name: 'Charlie', human: false, evicted: false, affinity: {}, stats: {} },
        { id: 4, name: 'Diana', human: false, evicted: false, affinity: {}, stats: {} },
        { id: 5, name: 'Eve', human: false, evicted: false, affinity: {}, stats: {} },
        { id: 6, name: 'Frank', human: false, evicted: false, affinity: {}, stats: {} }
      ];
      
      // Initialize empty affinities
      window.game.players.forEach(p => {
        window.game.players.forEach(other => {
          if(p.id !== other.id) {
            p.affinity[other.id] = 0;
          }
        });
      });
    }
    
    function seedTestData() {
      createTestPlayers();
      window.game.week = 2;
      
      const alice = window.game.players[0];
      const bob = window.game.players[1];
      const charlie = window.game.players[2];
      const diana = window.game.players[3];
      const eve = window.game.players[4];
      const frank = window.game.players[5];
      
      // Alice has strong allies
      alice.affinity[bob.id] = 0.55;      // Strong ally
      alice.affinity[charlie.id] = 0.35;  // Ally
      alice.affinity[diana.id] = 0.20;    // Near threshold (should not show)
      alice.affinity[eve.id] = -0.30;     // Enemy
      alice.affinity[frank.id] = -0.50;   // Strong enemy
      
      // Bob reciprocates
      bob.affinity[alice.id] = 0.50;
      bob.affinity[charlie.id] = 0.28;
      
      // Charlie has mixed feelings
      charlie.affinity[alice.id] = 0.30;
      charlie.affinity[bob.id] = 0.25;
      charlie.affinity[eve.id] = -0.35;
      
      logInfo('Test data seeded: Alice has 2 allies (Bob, Charlie) and 2 enemies (Eve, Frank)');
      logInfo('Week set to 2 for visibility');
    }
    
    // Test 1: Basic Classification
    function testClassification() {
      logInfo('=== Test 1: Basic Classification ===');
      createTestPlayers();
      window.game.week = 2;
      
      const alice = window.game.players[0];
      const bob = window.game.players[1];
      const charlie = window.game.players[2];
      
      // Set affinities
      alice.affinity[bob.id] = 0.30;    // Should be ally
      alice.affinity[charlie.id] = -0.30; // Should be enemy
      
      const result = window.SocialRelations.computeAlliesEnemies(alice.id);
      
      logResult('Ally threshold works', result.alliesIds.includes(bob.id));
      logResult('Enemy threshold works', result.enemiesIds.includes(charlie.id));
      logResult('Caps at 3 allies', result.alliesIds.length <= 3);
      logResult('Caps at 3 enemies', result.enemiesIds.length <= 3);
    }
    
    // Test 2: Hysteresis
    function testHysteresis() {
      logInfo('=== Test 2: Hysteresis ===');
      createTestPlayers();
      window.game.week = 2;
      window.game.__relationsHistory = new Map();
      
      const alice = window.game.players[0];
      const bob = window.game.players[1];
      
      // First week: Bob is an ally
      alice.affinity[bob.id] = 0.30;
      let result1 = window.SocialRelations.computeAlliesEnemies(alice.id, {
        lastRelations: {}
      });
      logResult('Bob classified as ally', result1.alliesIds.includes(bob.id));
      
      // Second week: affinity drops to 0.22 (above hysteresis threshold of 0.20)
      alice.affinity[bob.id] = 0.22;
      let result2 = window.SocialRelations.computeAlliesEnemies(alice.id, {
        lastRelations: { [bob.id]: 'ally' }
      });
      logResult('Bob stays ally due to hysteresis', result2.alliesIds.includes(bob.id));
      
      // Third week: affinity drops to 0.18 (below hysteresis threshold)
      alice.affinity[bob.id] = 0.18;
      let result3 = window.SocialRelations.computeAlliesEnemies(alice.id, {
        lastRelations: { [bob.id]: 'ally' }
      });
      logResult('Bob becomes neutral below hysteresis', !result3.alliesIds.includes(bob.id) && !result3.enemiesIds.includes(bob.id));
    }
    
    // Test 3: Weekly Reset Hook
    function testWeeklyReset() {
      logInfo('=== Test 3: Weekly Reset Hook ===');
      seedTestData();
      
      // Simulate weekly reset
      window.SocialRelations.recomputeAllRelations();
      
      const alice = window.game.players[0];
      logResult('Alice has allies array', Array.isArray(alice.allies));
      logResult('Alice has enemies array', Array.isArray(alice.enemies));
      logResult('Allies populated correctly', alice.allies.length === 2);
      logResult('Enemies populated correctly', alice.enemies.length === 2);
      
      logInfo(`Alice allies: ${alice.allies.join(', ')}`);
      logInfo(`Alice enemies: ${alice.enemies.join(', ')}`);
    }
    
    // Test 4: Week 2+ Visibility Gate
    function testVisibilityGate() {
      logInfo('=== Test 4: Week 2+ Visibility Gate ===');
      createTestPlayers();
      
      const alice = window.game.players[0];
      alice.affinity[2] = 0.50;
      
      // Week 1: should show nothing
      window.game.week = 1;
      window.SocialRelations.recomputeAllRelations();
      logResult('Week 1: No allies shown', !alice.allies || alice.allies.length === 0);
      
      // Week 2: should show allies
      window.game.week = 2;
      window.SocialRelations.recomputeAllRelations();
      logResult('Week 2: Allies shown', alice.allies && alice.allies.length > 0);
    }
    
    // Test 5: Minimum Signal Filter
    function testMinSignalFilter() {
      logInfo('=== Test 5: Minimum Signal Filter ===');
      createTestPlayers();
      window.game.week = 2;
      
      const alice = window.game.players[0];
      alice.affinity[2] = 0.10;  // Below MIN_SIGNAL (0.15)
      alice.affinity[3] = 0.30;  // Above MIN_SIGNAL and ALLY threshold
      
      const result = window.SocialRelations.computeAlliesEnemies(alice.id);
      logResult('Low signal filtered out', !result.alliesIds.includes(2));
      logResult('High signal included', result.alliesIds.includes(3));
    }
    
    // Test 6: Evicted Players Excluded
    function testEvictedExclusion() {
      logInfo('=== Test 6: Evicted Players Excluded ===');
      createTestPlayers();
      window.game.week = 2;
      
      const alice = window.game.players[0];
      const bob = window.game.players[1];
      
      alice.affinity[bob.id] = 0.50;
      bob.evicted = true;
      
      const result = window.SocialRelations.computeAlliesEnemies(alice.id);
      logResult('Evicted player not included', !result.alliesIds.includes(bob.id));
    }
    
    // Run all tests
    function runAllTests() {
      clearResults();
      logInfo('Running all tests...\n');
      
      testClassification();
      testHysteresis();
      testWeeklyReset();
      testVisibilityGate();
      testMinSignalFilter();
      testEvictedExclusion();
      
      logInfo('\n✓ All tests completed');
    }
    
    // Visualization
    function visualizeRelations() {
      seedTestData();
      window.SocialRelations.recomputeAllRelations();
      
      const viz = document.getElementById('visualization');
      const output = document.getElementById('vizOutput');
      viz.style.display = 'block';
      
      let html = '<div class="player-grid">';
      
      window.game.players.forEach(player => {
        const allies = (player.allies || []).map(id => {
          const p = window.game.players.find(x => x.id === id);
          const aff = player.affinity[id] || 0;
          return `${p?.name} (${aff.toFixed(2)})`;
        });
        
        const enemies = (player.enemies || []).map(id => {
          const p = window.game.players.find(x => x.id === id);
          const aff = player.affinity[id] || 0;
          return `${p?.name} (${aff.toFixed(2)})`;
        });
        
        html += `
          <div class="player-card">
            <div class="player-name">${player.name} (ID: ${player.id})</div>
            <dl class="affinity-list">
              <dt>Allies:</dt>
              <dd>${allies.length ? allies.join('<br>') : 'None'}</dd>
              <dt>Enemies:</dt>
              <dd>${enemies.length ? enemies.join('<br>') : 'None'}</dd>
            </dl>
          </div>
        `;
      });
      
      html += '</div>';
      output.innerHTML = html;
      
      logInfo('Relations visualization generated');
    }
    
    // Auto-run tests on load
    window.addEventListener('load', () => {
      logInfo('Social Relations Test Page Loaded');
      logInfo('Module loaded: ' + (typeof window.SocialRelations !== 'undefined' ? 'YES' : 'NO'));
      logInfo('Click "Run All Tests" to begin\n');
    });
  </script>
</body>
</html>
