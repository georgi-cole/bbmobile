<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compact Live Vote Layout Test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #0a0f16 0%, #1a2332 100%);
      color: #e8f4ff;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
    }
    
    .test-header {
      max-width: 900px;
      margin: 0 auto 20px;
      padding: 20px;
      background: rgba(20,35,55,0.8);
      border-radius: 12px;
      border: 1px solid rgba(143,211,255,0.2);
    }
    
    .test-header h1 {
      margin: 0 0 12px 0;
      color: #00e0cc;
      font-size: 1.5rem;
    }
    
    .test-header p {
      margin: 6px 0;
      font-size: 0.9rem;
    }
    
    .viewport-info {
      margin: 10px 0;
      padding: 10px;
      background: rgba(131,191,255,0.1);
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 3px solid #83bfff;
    }
    
    .test-controls {
      max-width: 900px;
      margin: 0 auto 20px;
      padding: 15px;
      background: rgba(20,35,55,0.8);
      border-radius: 12px;
      border: 1px solid rgba(143,211,255,0.2);
    }
    
    .test-controls button {
      background: linear-gradient(135deg, #00e0cc, #00b8a3);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: #001a18;
      font-weight: 700;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s;
      font-size: 0.9rem;
    }
    
    .test-controls button:hover {
      transform: translateY(-2px);
    }
    
    .test-controls button.danger {
      background: linear-gradient(135deg, #ff6b6b, #d94f4f);
      color: white;
    }
    
    #tv {
      position: relative;
      width: 100%;
      height: 600px;
      background: linear-gradient(135deg, #0d1a2b 0%, #1a2640 100%);
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(143,211,255,0.2);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      margin: 0 auto;
      max-width: 1200px;
    }
    
    @media (max-width: 768px) {
      #tv {
        height: 500px;
      }
    }
    
    @media (max-width: 480px) {
      #tv {
        height: 100vh;
        border-radius: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="test-header">
    <h1>🎬 Compact Live Vote Layout Test</h1>
    <p><strong>Purpose:</strong> Test the new compact/centered LV2 live vote layout on mobile and laptop viewports</p>
    <p><strong>Expected behavior:</strong> Evict CTA should always be visible and centered, avatars should be compact but tappable</p>
    <div class="viewport-info">
      <strong>Current viewport:</strong> <span id="viewport-size"></span>
      <br><strong>Compact mode:</strong> <span id="compact-status"></span> (activates at ≤1280px width)
    </div>
  </div>

  <div class="test-controls">
    <button onclick="showLiveVote(2)">2 Nominees (Standard Eviction)</button>
    <button onclick="showLiveVote(3)">3 Nominees (Triple Eviction)</button>
    <button onclick="showLiveVote(4)">4 Nominees (Quad Eviction)</button>
    <button class="danger" onclick="hideLiveVote()">Hide Overlay</button>
  </div>

  <!-- TV Container -->
  <div id="tv"></div>

  <script>
    // Update viewport info
    function updateViewportInfo() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      document.getElementById('viewport-size').textContent = `${width}px × ${height}px`;
      document.getElementById('compact-status').textContent = width <= 1280 ? 'ACTIVE ✓' : 'Inactive';
    }
    
    updateViewportInfo();
    window.addEventListener('resize', updateViewportInfo);

    // Mock player data
    const mockPlayers = [
      { id: 'p1', name: 'Alice Johnson', avatar: 'avatars/player1.png' },
      { id: 'p2', name: 'Bob Smith', avatar: 'avatars/player2.png' },
      { id: 'p3', name: 'Carol Davis', avatar: 'avatars/player3.png' },
      { id: 'p4', name: 'David Wilson', avatar: 'avatars/player4.png' }
    ];

    let selectedPlayer = null;

    function showLiveVote(numNominees) {
      const tv = document.getElementById('tv');
      const nominees = mockPlayers.slice(0, numNominees);
      
      // Clear existing overlay
      const existingOverlay = tv.querySelector('.lv2-overlay');
      if (existingOverlay) {
        existingOverlay.remove();
      }

      // Create LV2 overlay
      const overlay = document.createElement('div');
      overlay.className = 'lv2-overlay lv2-responsive';
      
      const fit = document.createElement('div');
      fit.className = 'lv2-fit';
      
      const panel = document.createElement('div');
      panel.className = 'lv2-panel';
      
      // Header
      const header = document.createElement('div');
      header.className = 'lv2-header';
      header.innerHTML = '<h3>Cast Your Vote</h3>';
      
      // Instructions
      const instructions = document.createElement('div');
      instructions.className = 'lv2-instructions';
      instructions.textContent = 'Select a houseguest to evict';
      
      // Grid
      const grid = document.createElement('div');
      grid.className = 'lv2-grid';
      
      nominees.forEach(player => {
        const contestant = document.createElement('div');
        contestant.className = 'lv2-contestant';
        contestant.dataset.playerId = player.id;
        
        // Avatar
        const avatar = document.createElement('div');
        avatar.className = 'lv2-avatar';
        avatar.style.background = `conic-gradient(from 45deg, rgba(131,191,255,0.4), rgba(102,217,255,0.2), rgba(131,191,255,0.4))`;
        avatar.style.borderRadius = '50%';
        avatar.style.display = 'flex';
        avatar.style.alignItems = 'center';
        avatar.style.justifyContent = 'center';
        avatar.innerHTML = `<div style="width: calc(100% - 8px); height: calc(100% - 8px); background: #1a2640; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #83bfff;">${player.name.charAt(0)}</div>`;
        
        // Name button (acts as evict button when selected)
        const nameBtn = document.createElement('button');
        nameBtn.className = 'lv2-name-btn';
        nameBtn.textContent = player.name;
        nameBtn.onclick = () => selectPlayer(player.id, nameBtn);
        
        contestant.appendChild(avatar);
        contestant.appendChild(nameBtn);
        grid.appendChild(contestant);
      });
      
      // CTA row (for the selected evict button)
      const ctaRow = document.createElement('div');
      ctaRow.className = 'lv2-cta-row';
      ctaRow.style.display = 'none'; // Initially hidden
      
      panel.appendChild(header);
      panel.appendChild(instructions);
      panel.appendChild(grid);
      panel.appendChild(ctaRow);
      fit.appendChild(panel);
      overlay.appendChild(fit);
      tv.appendChild(overlay);
      
      selectedPlayer = null;
    }

    function selectPlayer(playerId, btnElement) {
      // Deselect all
      document.querySelectorAll('.lv2-name-btn, .lv2-name-btn-selected').forEach(btn => {
        btn.className = 'lv2-name-btn';
        btn.style.background = 'transparent';
      });
      
      // Select this one
      btnElement.className = 'lv2-name-btn-selected';
      btnElement.style.background = 'linear-gradient(135deg, #e63946, #c1121f)';
      btnElement.style.color = '#ffffff';
      
      selectedPlayer = playerId;
      
      // Show confirmation
      setTimeout(() => {
        if (confirm(`Confirm eviction of ${btnElement.textContent}?`)) {
          alert(`Vote cast to evict ${btnElement.textContent}`);
          hideLiveVote();
        } else {
          // Deselect
          btnElement.className = 'lv2-name-btn';
          btnElement.style.background = 'transparent';
          btnElement.style.color = '';
          selectedPlayer = null;
        }
      }, 100);
    }

    function hideLiveVote() {
      const tv = document.getElementById('tv');
      const overlay = tv.querySelector('.lv2-overlay');
      if (overlay) {
        overlay.remove();
      }
      selectedPlayer = null;
    }

    // Show 2-nominee example on load
    setTimeout(() => showLiveVote(2), 500);
  </script>
</body>
</html>
