<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eviction Visuals Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e3ecf5;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(20, 30, 45, 0.9);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      color: #83bfff;
      text-align: center;
      margin-bottom: 30px;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(13, 21, 31, 0.5);
      border-radius: 8px;
      border: 1px solid #2c3a4d;
    }
    .test-section h2 {
      color: #f2ce7b;
      margin-top: 0;
      font-size: 1.3rem;
    }
    .btn {
      background: linear-gradient(135deg, #4a6fa5 0%, #2d5aa0 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin: 5px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #5a7fb5 0%, #3d6ab0 100%);
    }
    .btn.danger {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
    }
    .status {
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
      margin: 5px;
    }
    .status.pass {
      background: #22c55e;
      color: #fff;
    }
    .status.fail {
      background: #dc2626;
      color: #fff;
    }
    .status.pending {
      background: #f2ce7b;
      color: #000;
    }
    #tv {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: #1a1a1a;
      border-radius: 8px;
      margin: 20px auto;
      overflow: hidden;
    }
    #rosterBar {
      margin: 20px 0;
    }
    .log {
      background: rgba(13, 21, 31, 0.7);
      padding: 15px;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  </style>
  
  <!-- Load required CSS from main app -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🎬 Eviction Visual Enhancement Test</h1>
    <p style="color: #f2ce7b; text-align: center; margin-bottom: 20px;">
      Tests the faux TV animation only (roster badges removed)
    </p>
    
    <div class="test-section">
      <h2>Test Controls</h2>
      <button class="btn" onclick="setupGame()">Setup Game (12 players)</button>
      <button class="btn danger" onclick="simulateEviction(1)">Evict Player 1</button>
      <button class="btn danger" onclick="simulateEviction(2)">Evict Player 2</button>
      <button class="btn danger" onclick="simulateEviction(3)">Evict Player 3</button>
      <button class="btn" onclick="simulateFinal3Eviction(4)">Final 3 Eviction (Player 4)</button>
      <button class="btn" onclick="checkStatus()">Check Status</button>
      <button class="btn" onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="test-section">
      <h2>Status</h2>
      <div id="status">
        <span class="status pending">Not Started</span>
      </div>
    </div>
    
    <div class="test-section">
      <h2>Faux TV (Animation Container)</h2>
      <div id="tv">
        <div id="tvNow" style="padding: 20px; text-align: center; color: #fff;">
          TV Screen - Animations will appear here
        </div>
      </div>
    </div>
    
    <div class="test-section">
      <h2>Roster</h2>
      <div id="rosterBar"></div>
    </div>
    
    <div class="test-section">
      <h2>Console Log</h2>
      <div id="log" class="log"></div>
    </div>
  </div>
  
  <!-- Load required scripts -->
  <script src="js/avatar.js"></script>
  <script src="js/eviction-visuals.js"></script>
  
  <script>
    // Mock game state
    window.game = {
      players: [],
      week: 1,
      __evictVisualDone: {}
    };
    
    // Mock helper functions
    window.getP = function(id) {
      return window.game.players.find(p => p.id === id);
    };
    
    window.safeName = function(id) {
      const p = window.getP(id);
      return p ? p.name : `Player ${id}`;
    };
    
    window.alivePlayers = function() {
      return window.game.players.filter(p => !p.evicted);
    };
    
    window.cardQueueWaitIdle = function() {
      return new Promise(resolve => setTimeout(resolve, 100));
    };
    
    window.updateHud = function() {
      renderRoster();
      log('HUD updated');
    };
    
    // Logging
    function log(message) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.insertBefore(entry, logDiv.firstChild);
    }
    
    function clearLog() {
      document.getElementById('log').innerHTML = '';
      log('Log cleared');
    }
    
    // Setup game
    function setupGame() {
      window.game.players = [];
      for(let i = 1; i <= 12; i++) {
        window.game.players.push({
          id: i,
          name: `Player ${i}`,
          evicted: false,
          avatar: `https://api.dicebear.com/6.x/bottts/svg?seed=player${i}`,
          finalRank: null
        });
      }
      window.game.__evictVisualDone = {};
      renderRoster();
      updateStatus('Game setup with 12 players', 'pass');
      log('Game initialized with 12 players');
    }
    
    // Simulate eviction
    async function simulateEviction(playerId) {
      const player = window.getP(playerId);
      if(!player) {
        updateStatus(`Player ${playerId} not found`, 'fail');
        return;
      }
      
      if(player.evicted) {
        updateStatus(`Player ${playerId} already evicted`, 'fail');
        return;
      }
      
      updateStatus(`Evicting ${player.name}...`, 'pending');
      log(`Starting eviction for ${player.name}`);
      
      // Mark as evicted
      player.evicted = true;
      player.weekEvicted = window.game.week;
      
      // Calculate finalRank
      const aliveCount = window.alivePlayers().length + 1;
      player.finalRank = aliveCount;
      
      log(`${player.name} marked as evicted, rank: ${player.finalRank}`);
      
      // Run visual enhancement
      try {
        if(typeof window.runEvictionVisual === 'function') {
          await window.runEvictionVisual(playerId, { reason: 'vote' });
          updateStatus(`${player.name} evicted successfully`, 'pass');
          log(`Visual enhancement completed for ${player.name}`);
        } else {
          updateStatus('runEvictionVisual not found', 'fail');
          log('ERROR: runEvictionVisual function not found');
        }
      } catch(e) {
        updateStatus(`Error: ${e.message}`, 'fail');
        log(`ERROR: ${e.message}`);
      }
      
      window.game.week++;
    }
    
    // Simulate Final 3 eviction
    async function simulateFinal3Eviction(playerId) {
      const player = window.getP(playerId);
      if(!player) {
        updateStatus(`Player ${playerId} not found`, 'fail');
        return;
      }
      
      updateStatus(`Final 3 eviction: ${player.name}...`, 'pending');
      log(`Starting Final 3 eviction for ${player.name}`);
      
      player.evicted = true;
      player.weekEvicted = window.game.week;
      player.finalRank = 3;
      
      try {
        if(typeof window.runEvictionVisual === 'function') {
          await window.runEvictionVisual(playerId, { reason: 'final3' });
          updateStatus(`${player.name} evicted (3rd place)`, 'pass');
          log(`Visual enhancement completed for ${player.name} (Final 3)`);
        } else {
          updateStatus('runEvictionVisual not found', 'fail');
        }
      } catch(e) {
        updateStatus(`Error: ${e.message}`, 'fail');
        log(`ERROR: ${e.message}`);
      }
    }
    
    // Render roster
    function renderRoster() {
      const rosterBar = document.getElementById('rosterBar');
      rosterBar.innerHTML = '';
      
      const row = document.createElement('div');
      row.className = 'top-roster-row';
      row.style.display = 'flex';
      row.style.flexWrap = 'wrap';
      row.style.gap = '10px';
      
      window.game.players.forEach(p => {
        const tile = document.createElement('div');
        tile.className = 'top-roster-tile';
        tile.dataset.playerId = p.id;
        if(p.evicted) tile.classList.add('evicted');
        
        const wrap = document.createElement('div');
        wrap.className = 'top-tile-avatar-wrap';
        
        const img = document.createElement('img');
        img.className = 'top-tile-avatar' + (p.evicted ? ' grayed' : '');
        img.src = p.avatar;
        img.alt = p.name;
        wrap.appendChild(img);
        
        // Add evicted cross (always shown for evicted players)
        if(p.evicted) {
          const cross = document.createElement('div');
          cross.className = 'evicted-cross';
          cross.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 4 L20 20 M20 4 L4 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
          wrap.appendChild(cross);
        }
        
        const name = document.createElement('div');
        name.className = 'top-tile-name';
        name.textContent = p.name;
        
        tile.appendChild(wrap);
        tile.appendChild(name);
        row.appendChild(tile);
      });
      
      rosterBar.appendChild(row);
      log('Roster rendered');
    }
    
    // Update status
    function updateStatus(message, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = `<span class="status ${type}">${message}</span>`;
    }
    
    // Check status
    function checkStatus() {
      const evicted = window.game.players.filter(p => p.evicted);
      
      log(`Status: ${evicted.length} evicted players`);
      updateStatus(`${evicted.length} evicted (roster shows red X only)`, 'pass');
    }
    
    // Initialize
    log('Test page loaded');
    log('Call setupGame() to begin');
  </script>
</body>
</html>
