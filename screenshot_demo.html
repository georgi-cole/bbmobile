<!DOCTYPE html>
<html>
<head>
<title>Social Summary Screenshots</title>
<link rel="stylesheet" href="http://127.0.0.1:8080/css/main.css">
<style>
body { background: #0a0e14; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.revealCard { background: linear-gradient(135deg, #1e2a38 0%, #2d3e52 100%); border-radius: 12px; padding: 2em; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 680px; margin: 100px auto; }
h3 { text-align: center; margin: 0 0 1em; font-size: 1.5em; }
.btn { padding: 0.6em 1.5em; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95em; transition: all 0.2s; }
.btn.small { padding: 0.5em 1.2em; font-size: 0.9em; }
.social-summary-content { font-size: 0.9rem; line-height: 1.6; text-align: center; }
.social-summary-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); z-index: 9998; }
#decisionDeck { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; }
</style>
</head>
<body>

<!-- Empty State Summary -->
<div id="decisionDeck">
  <div class="revealCard social-summary-card" style="max-width: 680px; pointer-events: auto;">
    <h3>🎭 Summary</h3>
    <div class="social-summary-content" style="font-size: 0.9rem; line-height: 1.6; text-align: center;">
      <div style="padding: 1.5em 0; color: #888; font-style: italic;">No social interactions this phase</div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 1.5em; justify-content: center; flex-wrap: wrap;">
      <button class="btn small">More</button>
      <button class="btn small" style="background: #3498db;">OK</button>
    </div>
  </div>
</div>

<script>
// Capture after 1 second
setTimeout(() => {
  console.log('Ready for screenshot 1: Empty state summary');
}, 1000);

// Show filled state after 3 seconds
setTimeout(() => {
  const content = document.querySelector('.social-summary-content');
  content.innerHTML = `
    <div><strong>⚡ Energy:</strong> 8 spent</div>
    <div style="margin-top: 0.5em;"><strong>🎯 Actions:</strong> 4 total</div>
    <div style="margin-top: 0.5em;"><strong>💕 Relationships:</strong> 2 big changes</div>
    <div style="margin-top: 0.5em; color: #27ae60; font-weight: 600;"><strong>🤝 New alliances:</strong> 1</div>
    <div style="margin-top: 0.5em;"><strong>💭 Memories:</strong> 3 new</div>
  `;
  console.log('Ready for screenshot 2: Summary with data');
}, 3000);
</script>
</body>
</html>
