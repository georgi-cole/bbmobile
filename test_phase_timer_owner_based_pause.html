<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner-Based Pause Controller Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 { color: #3498db; }
    .test-section {
      background: #16213e;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border-left: 4px solid #0f3460;
    }
    .timer-display {
      font-size: 64px;
      font-family: monospace;
      text-align: center;
      padding: 30px;
      background: #0f3460;
      border-radius: 12px;
      margin: 20px 0;
      font-weight: bold;
    }
    .status-bar {
      background: #0f3460;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .status-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 4px;
    }
    .status-label { color: #888; font-size: 0.85em; }
    .status-value { font-weight: bold; font-size: 1.1em; }
    .btn {
      padding: 12px 24px;
      margin: 5px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .btn:hover { background: #2980b9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.success { background: #27ae60; }
    .btn.danger { background: #e74c3c; }
    .btn.warning { background: #f39c12; }
    .log {
      background: #000;
      padding: 15px;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      margin-top: 15px;
    }
    .log-entry { margin: 3px 0; padding: 2px; }
    .log-info { color: #3498db; }
    .log-success { color: #27ae60; }
    .log-warn { color: #f39c12; }
    .log-error { color: #e74c3c; }
    .owners-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .owner-badge {
      background: #3498db;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.9em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .owner-badge::before {
      content: '🔒';
    }
  </style>
</head>
<body>
  <h1>🧪 Owner-Based Pause Controller Test</h1>
  <p>This test demonstrates the new owner-based pause system that fixes the social phase timer bug.</p>
  
  <div class="test-section">
    <h2>Phase Timer</h2>
    <div class="timer-display" id="timer">--:--</div>
    
    <div class="status-bar">
      <div class="status-item">
        <div class="status-label">Status</div>
        <div class="status-value" id="status">Not Started</div>
      </div>
      <div class="status-item">
        <div class="status-label">Paused By</div>
        <div class="status-value" id="isPaused">No</div>
      </div>
      <div class="status-item">
        <div class="status-label">Captured Remaining</div>
        <div class="status-value" id="capturedRemaining">--</div>
      </div>
      <div class="status-item">
        <div class="status-label">Active Owners</div>
        <div class="status-value" id="ownerCount">0</div>
      </div>
    </div>
    
    <div class="owners-list" id="ownersList"></div>
    
    <h3>Actions</h3>
    <button class="btn success" onclick="startTimer()">Start 30s Timer</button>
    <button class="btn" onclick="pauseWith('social-modal')">Pause (social-modal)</button>
    <button class="btn" onclick="pauseWith('social-summary')">Pause (social-summary)</button>
    <button class="btn" onclick="pauseWith('social-summary-more')">Pause (social-summary-more)</button>
    <br>
    <button class="btn warning" onclick="resumeWith('social-modal')">Resume (social-modal)</button>
    <button class="btn warning" onclick="resumeWith('social-summary')">Resume (social-summary)</button>
    <button class="btn warning" onclick="resumeWith('social-summary-more')">Resume (social-summary-more)</button>
    <br>
    <button class="btn danger" onclick="setTimerTo1Second()">Set Timer to 1s (OK Button Simulation)</button>
    <button class="btn" onclick="resetTest()">Reset</button>
    
    <div class="log" id="log"></div>
  </div>

  <script src="js/flow/PauseController.js"></script>
  <script>
    // Mock game object
    window.game = {
      endAt: null,
      phaseEndsAt: null,
      timerPaused: false,
      pausedTimeRemaining: null,
      phase: 'social_intermission',
      week: 1
    };

    let tickInterval = null;
    let startTime = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateDisplay() {
      const now = Date.now();
      const game = window.game;
      
      // Update timer display
      let displayTime;
      if (window.PauseController && window.PauseController.isPaused()) {
        // Use captured time when paused
        displayTime = game.pausedTimeRemaining || 0;
      } else {
        // Use endAt when running
        displayTime = Math.max(0, game.endAt - now);
      }
      
      document.getElementById('timer').textContent = formatTime(displayTime);
      
      // Update status
      const isPaused = window.PauseController && window.PauseController.isPaused();
      document.getElementById('status').textContent = isPaused ? 'Paused' : 'Running';
      document.getElementById('isPaused').textContent = isPaused ? 'Yes' : 'No';
      document.getElementById('capturedRemaining').textContent = 
        game.pausedTimeRemaining != null ? formatTime(game.pausedTimeRemaining) : '--';
      
      // Update owners
      const owners = window.PauseController ? window.PauseController.getOwners() : [];
      document.getElementById('ownerCount').textContent = owners.length;
      
      const ownersList = document.getElementById('ownersList');
      ownersList.innerHTML = '';
      owners.forEach(owner => {
        const badge = document.createElement('div');
        badge.className = 'owner-badge';
        badge.textContent = owner;
        ownersList.appendChild(badge);
      });
      
      // Check if expired
      if (!isPaused && displayTime <= 0 && game.endAt) {
        if (tickInterval) {
          clearInterval(tickInterval);
          tickInterval = null;
        }
        log('⏰ Timer expired!', 'warn');
        document.getElementById('status').textContent = 'Expired';
      }
    }

    function startTimer() {
      const duration = 30000; // 30 seconds
      window.game.endAt = Date.now() + duration;
      window.game.phaseEndsAt = window.game.endAt;
      startTime = Date.now();
      
      log('▶️ Started 30-second timer', 'success');
      
      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(updateDisplay, 100);
      updateDisplay();
    }

    function pauseWith(ownerId) {
      if (!window.PauseController) {
        log('❌ PauseController not available', 'error');
        return;
      }
      
      window.PauseController.pause(ownerId);
      log(`⏸️ Paused with owner: ${ownerId}`, 'info');
      updateDisplay();
    }

    function resumeWith(ownerId) {
      if (!window.PauseController) {
        log('❌ PauseController not available', 'error');
        return;
      }
      
      window.PauseController.resume(ownerId);
      log(`▶️ Resumed owner: ${ownerId}`, 'success');
      updateDisplay();
    }

    function setTimerTo1Second() {
      const now = Date.now();
      window.game.endAt = now + 1000;
      window.game.phaseEndsAt = window.game.endAt;
      
      // Resume if paused
      if (window.PauseController && window.PauseController.isPaused()) {
        const owners = window.PauseController.getOwners();
        log(`⏱️ Setting timer to 1 second and resuming (removing ${owners.length} owner(s))`, 'warn');
        owners.forEach(owner => window.PauseController.resume(owner));
      } else {
        log('⏱️ Set timer to 1 second', 'warn');
      }
      
      updateDisplay();
    }

    function resetTest() {
      if (tickInterval) {
        clearInterval(tickInterval);
        tickInterval = null;
      }
      
      // Reset game state
      window.game.endAt = null;
      window.game.phaseEndsAt = null;
      window.game.timerPaused = false;
      window.game.pausedTimeRemaining = null;
      
      // Reset PauseController (hack: clear owners)
      if (window.PauseController) {
        const owners = window.PauseController.getOwners();
        owners.forEach(owner => window.PauseController.resume(owner));
      }
      
      document.getElementById('log').innerHTML = '';
      log('🔄 Test reset', 'info');
      updateDisplay();
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      log('✓ Test page loaded', 'success');
      log('✓ PauseController available: ' + (window.PauseController ? 'Yes' : 'No'), 
          window.PauseController ? 'success' : 'error');
      updateDisplay();
    });
  </script>
</body>
</html>
