<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>iOS Sound Consent Flow Test</title>
  
  <!-- Core styles -->
  <link rel="stylesheet" href="css/intro.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e14;
      color: #fff;
    }
    
    .test-controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.8);
      padding: 16px;
      border-radius: 8px;
      max-width: 300px;
      font-size: 13px;
    }
    
    .test-controls h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }
    
    .test-controls button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      background: #00d4ff;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }
    
    .test-controls button:hover {
      background: #00e4ff;
    }
    
    .test-info {
      margin: 12px 0;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.4;
    }
    
    .test-info strong {
      color: #00d4ff;
    }
    
    .test-log {
      margin-top: 12px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 10px;
      font-family: monospace;
    }
    
    .test-log div {
      margin: 2px 0;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="test-controls">
    <h3>🧪 iOS Sound Consent Test</h3>
    
    <div class="test-info">
      <strong>Device:</strong> <span id="device-info">Detecting...</span><br>
      <strong>Consent:</strong> <span id="consent-status">Not set</span><br>
      <strong>Music:</strong> <span id="music-status">Unknown</span><br>
      <strong>SFX:</strong> <span id="sfx-status">Unknown</span>
    </div>
    
    <button onclick="testShowHub()">🎮 Show Intro Hub</button>
    <button onclick="testShowConsent()">📢 Show Consent Prompt</button>
    <button onclick="testClearConsent()">🗑️ Clear Consent</button>
    <button onclick="testGrantConsent()">✅ Grant Consent</button>
    <button onclick="testDenyConsent()">❌ Deny Consent</button>
    <button onclick="testPlayMusic()">🎵 Play Intro Hub Music</button>
    <button onclick="testClickSound()">🔊 Test Click SFX</button>
    
    <div class="test-log" id="test-log"></div>
  </div>

  <!-- Core scripts -->
  <script>window.MUSIC_BASE = 'audio/';</script>
  <script src="js/bbGameBus.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/audio-bridge.js"></script>
  <script src="js/ui/introHubSfx.js"></script>
  <script src="src/ui/IntroScreen.js"></script>
  <script>
    
    // Initialize window.game
    window.game = window.game || {};
    window.game.cfg = window.game.cfg || { musicOn: true, sfxOn: true };
    
    // Initialize event bus
    window.game.bus = window.game.bbGameBus = window.bbGameBus || {
      on: () => {},
      emit: () => {},
      off: () => {}
    };
    
    // Test helpers
    const log = (msg) => {
      const logEl = document.getElementById('test-log');
      const entry = document.createElement('div');
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${msg}`;
      logEl.insertBefore(entry, logEl.firstChild);
      if (logEl.children.length > 50) {
        logEl.removeChild(logEl.lastChild);
      }
      console.log(`[Test] ${msg}`);
    };
    
    const updateStatus = () => {
      try {
        const consent = localStorage.getItem('bb_sound_consent');
        document.getElementById('consent-status').textContent = 
          consent === '1' ? 'Granted ✅' : 
          consent === '0' ? 'Denied ❌' : 
          'Not set';
        
        const cfg = window.game.cfg || {};
        document.getElementById('music-status').textContent = cfg.musicOn ? 'ON 🎵' : 'OFF 🔇';
        document.getElementById('sfx-status').textContent = cfg.sfxOn ? 'ON 🔊' : 'OFF 🔇';
      } catch(e) {
        log('Failed to update status: ' + e.message);
      }
    };
    
    // Detect device
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = 
      (('standalone' in navigator) && (navigator.standalone === true)) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    
    document.getElementById('device-info').textContent = 
      isIOS ? (isStandalone ? 'iOS Standalone 📱' : 'iOS Safari 🌐') : 'Desktop/Other 💻';
    
    // Test functions
    window.testShowHub = () => {
      log('Showing intro hub...');
      if (window.game.IntroScreen) {
        window.game.IntroScreen.showWithPreload(true);
        log('Intro hub shown');
      } else {
        log('ERROR: IntroScreen not available');
      }
    };
    
    window.testShowConsent = () => {
      log('Dispatching bb:audio:autoplay-blocked...');
      window.dispatchEvent(new CustomEvent('bb:audio:autoplay-blocked'));
      log('Event dispatched - consent should appear');
    };
    
    window.testClearConsent = () => {
      try {
        localStorage.removeItem('bb_sound_consent');
        updateStatus();
        log('Consent cleared from localStorage');
      } catch(e) {
        log('ERROR: ' + e.message);
      }
    };
    
    window.testGrantConsent = () => {
      try {
        localStorage.setItem('bb_sound_consent', '1');
        window.dispatchEvent(new CustomEvent('bb:sound-consent-granted'));
        document.dispatchEvent(new CustomEvent('bb:sound-consent-granted'));
        updateStatus();
        log('Consent granted and event dispatched');
      } catch(e) {
        log('ERROR: ' + e.message);
      }
    };
    
    window.testDenyConsent = () => {
      try {
        localStorage.setItem('bb_sound_consent', '0');
        updateStatus();
        log('Consent denied');
      } catch(e) {
        log('ERROR: ' + e.message);
      }
    };
    
    window.testPlayMusic = () => {
      log('Attempting to play intro hub music...');
      try {
        if (window.game.audio && typeof window.game.audio.playMusicForPhase === 'function') {
          window.game.audio.playMusicForPhase('intro_hub');
          log('Music playback requested');
        } else {
          log('ERROR: Audio API not available');
        }
      } catch(e) {
        log('ERROR: ' + e.message);
      }
    };
    
    window.testClickSound = () => {
      log('Testing click SFX...');
      try {
        if (window.IntroHubSfx) {
          // Manually trigger the play function if available
          log('IntroHubSfx is available, triggering via pointerdown simulation');
          const btn = document.createElement('button');
          btn.textContent = 'Test Button';
          document.body.appendChild(btn);
          window.IntroHubSfx.attach(document.body);
          btn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
          setTimeout(() => document.body.removeChild(btn), 100);
        } else {
          log('ERROR: IntroHubSfx not available');
        }
      } catch(e) {
        log('ERROR: ' + e.message);
      }
    };
    
    // Listen for events
    window.addEventListener('bb:audio:autoplay-blocked', () => {
      log('EVENT: bb:audio:autoplay-blocked received');
    });
    
    window.addEventListener('bb:sound-consent-granted', () => {
      log('EVENT: bb:sound-consent-granted received');
      updateStatus();
    });
    
    document.addEventListener('bb:sound-consent-granted', () => {
      log('EVENT: bb:sound-consent-granted (document) received');
    });
    
    // Initialize IntroScreen
    if (window.game.IntroScreen) {
      window.game.IntroScreen.init({ bus: window.game.bus });
      log('IntroScreen initialized');
    }
    
    // Initial status update
    updateStatus();
    log('Test page loaded and ready');
    log(`Device: ${isIOS ? 'iOS' : 'Desktop'}, Standalone: ${isStandalone}`);
  </script>
</body>
</html>
