<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Lifecycle Test - SM-only</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 { color: #4CAF50; }
    h2 { color: #2196F3; margin-top: 30px; }
    .test-section {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    .pass {
      background: rgba(76, 175, 80, 0.2);
      border-left: 4px solid #4CAF50;
    }
    .fail {
      background: rgba(244, 67, 54, 0.2);
      border-left: 4px solid #f44336;
    }
    .info {
      background: rgba(33, 150, 243, 0.2);
      border-left: 4px solid #2196F3;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }
    button:hover { background: #45a049; }
    button:active { transform: scale(0.98); }
    .summary {
      background: #2a2a2a;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }
    .summary h3 { margin-top: 0; color: #4CAF50; }
    pre {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔄 Weekly Lifecycle Test - SM-only</h1>
  <p>Testing weekly finalization with unlimited carryover and configurable bonus/penalty values.</p>

  <div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="runAllTests()">▶️ Run All Tests</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
  </div>

  <div id="results"></div>

  <div id="summary" class="summary" style="display:none;">
    <h3>Test Summary</h3>
    <div id="summaryContent"></div>
  </div>

  <script>
    // Mock game environment
    window.game = {
      cfg: { enableSocialManeuvers: true },
      week: 1,
      humanId: 1,
      __socialResources: new Map(),
      __weeklyEvents: new Map(),
      __pairwiseInfluence: new Map(),
      __weeklyInteractions: new Map(),
      __phaseRefunds: new Map(),
      __sm_nextWeekSeedEnergy: new Map()
    };

    // Mock helpers
    window.alivePlayers = () => [
      { id: 1, name: 'Alice' },
      { id: 2, name: 'Bob' },
      { id: 3, name: 'Charlie' }
    ];

    window.getP = (id) => window.alivePlayers().find(p => p.id === id);
    window.safeName = (id) => window.getP(id)?.name || `Player ${id}`;

    let testResults = [];
    let passCount = 0;
    let failCount = 0;

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `test-result ${type}`;
      div.textContent = message;
      document.getElementById('results').appendChild(div);
      
      testResults.push({ message, type });
      if (type === 'pass') passCount++;
      if (type === 'fail') failCount++;
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').style.display = 'none';
      testResults = [];
      passCount = 0;
      failCount = 0;
    }

    function showSummary() {
      const summary = document.getElementById('summary');
      const content = document.getElementById('summaryContent');
      
      const totalTests = passCount + failCount;
      const passRate = totalTests > 0 ? ((passCount / totalTests) * 100).toFixed(1) : 0;
      
      content.innerHTML = `
        <p><strong>Total Tests:</strong> ${totalTests}</p>
        <p><strong>Passed:</strong> ${passCount} ✓</p>
        <p><strong>Failed:</strong> ${failCount} ✗</p>
        <p><strong>Pass Rate:</strong> ${passRate}%</p>
      `;
      
      summary.style.display = 'block';
    }

    function assert(condition, message) {
      if (condition) {
        log(`✓ ${message}`, 'pass');
      } else {
        log(`✗ ${message}`, 'fail');
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual === expected) {
        log(`✓ ${message} (${actual})`, 'pass');
      } else {
        log(`✗ ${message} - Expected: ${expected}, Got: ${actual}`, 'fail');
      }
    }
  </script>

  <script src="js/social-maneuvers.js"></script>

  <script>
    async function runAllTests() {
      clearResults();
      log('=== Starting Weekly Lifecycle Tests ===', 'info');

      // Test 1: Module loaded
      log('\n--- Test 1: Module Loaded ---', 'info');
      assert(typeof window.SocialManeuvers !== 'undefined', 'SocialManeuvers module loaded');
      assert(typeof window.SocialManeuvers.SocialResources !== 'undefined', 'SocialResources available');
      assert(typeof window.SocialManeuvers.SocialResources.finalizeWeekForAll === 'function', 'finalizeWeekForAll method exists');

      // Test 2: Constants are configurable
      log('\n--- Test 2: Configurable Constants ---', 'info');
      assert(typeof window.SocialManeuvers.WEEKLY_ENERGY_BONUSES !== 'undefined', 'WEEKLY_ENERGY_BONUSES exported');
      assert(typeof window.SocialManeuvers.WEEKLY_ENERGY_PENALTIES !== 'undefined', 'WEEKLY_ENERGY_PENALTIES exported');
      assert(window.SocialManeuvers.WEEKLY_ENERGY_BONUSES.HOH_WIN === 5, 'HOH_WIN bonus is 5 (default)');
      assert(window.SocialManeuvers.WEEKLY_ENERGY_PENALTIES.COMP_SKIPPED === -3, 'COMP_SKIPPED penalty is -3 (default)');

      // Test 3: Initialize players
      log('\n--- Test 3: Initialize Players ---', 'info');
      const SR = window.SocialManeuvers.SocialResources;
      const players = window.alivePlayers();
      
      players.forEach(p => {
        SR.init(p.id);
      });
      
      assert(game.__socialResources.size === 3, 'All 3 players initialized');

      // Test 4: Set initial energy and weekly events
      log('\n--- Test 4: Set Initial Energy and Events ---', 'info');
      
      // Alice: 3 energy remaining, HOH winner, nominated
      SR.set(1, 'energy', 3);
      SR.recordWeeklyEvent(1, 'hohWin', true);
      SR.recordWeeklyEvent(1, 'nominated', true);
      
      // Bob: 7 energy remaining, POV winner
      SR.set(2, 'energy', 7);
      SR.recordWeeklyEvent(2, 'povWin', true);
      
      // Charlie: 0 energy remaining, comp skipped, broke alliance
      SR.set(3, 'energy', 0);
      SR.recordWeeklyEvent(3, 'compSkipped', true);
      SR.recordWeeklyEvent(3, 'brokeAlliance', true);
      
      assertEqual(SR.get(1, 'energy'), 3, 'Alice has 3 energy');
      assertEqual(SR.get(2, 'energy'), 7, 'Bob has 7 energy');
      assertEqual(SR.get(3, 'energy'), 0, 'Charlie has 0 energy');

      // Test 5: Preview energy calculation
      log('\n--- Test 5: Preview Energy (with carryover) ---', 'info');
      
      // Alice: Base(5) + HOH(5) + Nominated(4) + Carryover(3) = 17 -> capped at 10
      const alicePreview = SR.getPreviewEnergy(1);
      assertEqual(alicePreview, 10, 'Alice preview: 17 capped to 10 (max)');
      
      // Bob: Base(5) + POV(3) + Carryover(7) = 15 -> capped at 10
      const bobPreview = SR.getPreviewEnergy(2);
      assertEqual(bobPreview, 10, 'Bob preview: 15 capped to 10 (max)');
      
      // Charlie: Base(5) - CompSkipped(3) - BrokeAlliance(3) + Carryover(0) = -1 -> 0
      const charliePreview = SR.getPreviewEnergy(3);
      assertEqual(charliePreview, 0, 'Charlie preview: -1 clamped to 0 (min)');

      // Test 6: Preview breakdown
      log('\n--- Test 6: Preview Breakdown ---', 'info');
      const aliceBreakdown = SR.getPreviewEnergyBreakdown(1);
      assert(aliceBreakdown.carryover === 3, 'Alice breakdown includes carryover');
      assert(aliceBreakdown.bonusTotal === 9, 'Alice bonusTotal = 9 (HOH 5 + Nominated 4)');
      assert(aliceBreakdown.total === 10, 'Alice total capped at 10');

      // Test 7: Finalize week for all
      log('\n--- Test 7: Finalize Week for All ---', 'info');
      SR.finalizeWeekForAll();
      
      assert(game.__sm_nextWeekSeedEnergy.size === 3, 'Seeds computed for all 3 players');
      
      const aliceSeed = game.__sm_nextWeekSeedEnergy.get(1);
      const bobSeed = game.__sm_nextWeekSeedEnergy.get(2);
      const charlieSeed = game.__sm_nextWeekSeedEnergy.get(3);
      
      assertEqual(aliceSeed, 10, 'Alice seed: 10 (capped)');
      assertEqual(bobSeed, 10, 'Bob seed: 10 (capped)');
      assertEqual(charlieSeed, 0, 'Charlie seed: 0 (clamped)');
      
      log('Seed calculation details:', 'info');
      log(`  Alice:   Base(5) + Bonuses(9) - Penalties(0) + Carryover(3) = ${aliceSeed}`, 'info');
      log(`  Bob:     Base(5) + Bonuses(3) - Penalties(0) + Carryover(7) = ${bobSeed}`, 'info');
      log(`  Charlie: Base(5) + Bonuses(0) - Penalties(6) + Carryover(0) = ${charlieSeed}`, 'info');

      // Test 8: Reset weekly (consume seeds)
      log('\n--- Test 8: Reset Weekly (Consume Seeds) ---', 'info');
      
      // Advance to week 2
      game.week = 2;
      
      SR.resetWeekly(1);
      SR.resetWeekly(2);
      SR.resetWeekly(3);
      
      assertEqual(SR.get(1, 'energy'), 10, 'Alice energy after reset: 10 (from seed)');
      assertEqual(SR.get(2, 'energy'), 10, 'Bob energy after reset: 10 (from seed)');
      assertEqual(SR.get(3, 'energy'), 0, 'Charlie energy after reset: 0 (from seed)');
      
      assert(game.__sm_nextWeekSeedEnergy.size === 0, 'Seeds consumed after reset');

      // Test 9: Fallback path (no precomputed seed)
      log('\n--- Test 9: Fallback Path (Legacy) ---', 'info');
      
      // Clear seeds to test fallback
      game.__sm_nextWeekSeedEnergy.clear();
      
      // Alice gets nominated again
      SR.recordWeeklyEvent(1, 'nominated', true);
      SR.set(1, 'energy', 2);
      
      // Advance to week 3
      game.week = 3;
      
      // Reset without seed (should use legacy calculation)
      SR.resetWeekly(1);
      
      // Expected: Base(5) + Nominated(4) = 9 (no carryover in legacy mode)
      assertEqual(SR.get(1, 'energy'), 9, 'Alice fallback: Base(5) + Nominated(4) = 9');

      // Test 10: Unlimited carryover (high value)
      log('\n--- Test 10: Unlimited Carryover ---', 'info');
      
      // Set Alice to high energy (should be capped at 10 max)
      SR.set(1, 'energy', 10);
      
      // Bob gets all bonuses
      SR.set(2, 'energy', 8);
      SR.recordWeeklyEvent(2, 'hohWin', true);
      SR.recordWeeklyEvent(2, 'povWin', true);
      SR.recordWeeklyEvent(2, 'nominated', true);
      
      // Finalize
      SR.finalizeWeekForAll();
      
      const bobSeed2 = game.__sm_nextWeekSeedEnergy.get(2);
      // Base(5) + HOH(5) + POV(3) + Nominated(4) + Carryover(8) = 25 -> capped at 10
      assertEqual(bobSeed2, 10, 'Bob with all bonuses capped at 10 (unlimited carryover tested)');

      // Summary
      showSummary();
      log('\n=== Test Run Complete ===', 'info');
    }

    // Auto-run tests on load
    window.addEventListener('load', () => {
      setTimeout(runAllTests, 500);
    });
  </script>
</body>
</html>
