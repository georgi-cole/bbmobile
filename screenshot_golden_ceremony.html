<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden POV Ceremony - Replacement Selection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e1a;
      color: #e6e8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .tv-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .ceremony-card {
      background: linear-gradient(135deg, #1a2f44 0%, #243a50 100%);
      border: 2px solid #3d5a75;
      border-radius: 16px;
      padding: 35px 45px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.9);
    }
    
    h2 {
      color: #ffd700;
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    
    .info {
      font-size: 1rem;
      color: #b2c2d5;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }
    
    .info strong {
      color: #ffd700;
    }
    
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    
    .player-option {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #3d5a75;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .player-option:hover {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
    }
    
    .player-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2877a0, #1a4a63);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 2px solid #3d5a75;
    }
    
    .player-name {
      font-size: 1.1rem;
      color: #e6e8ee;
      font-weight: 600;
    }
    
    .badge {
      display: inline-block;
      background: #ffd700;
      color: #0a0e1a;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 8px;
      font-weight: 600;
    }
    
    .hint {
      margin-top: 25px;
      text-align: center;
      font-size: 0.9rem;
      color: #9aa3b2;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="tv-overlay">
    <div class="ceremony-card">
      <h2>🏆 Select Replacement Nominee</h2>
      <div class="info">
        <strong>POV Holder Jessica</strong> will now choose the replacement nominee.<br>
        Saved: Mark | Cannot nominate: HOH, Self, Saved player
      </div>
      
      <div class="player-grid">
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">Sarah</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">James</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">Emily</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">David</div>
        </div>
      </div>
      
      <div class="hint">
        Click on a houseguest to nominate them as the replacement
      </div>
    </div>
  </div>
</body>
</html>
