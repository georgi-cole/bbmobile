<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Cache Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
      color: white;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .test-section {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .test-section h3 {
      margin-top: 0;
      color: #00d4ff;
    }
    .test-btn {
      padding: 14px 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d4ff 0%, #0088ff 100%);
      border: 1px solid rgba(0, 212, 255, 0.5);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms ease;
      margin: 5px;
    }
    .test-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }
    .log {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid #00d4ff;
      padding-left: 10px;
    }
    .log-entry.success {
      border-left-color: #00ff88;
    }
    .log-entry.error {
      border-left-color: #ff4444;
    }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .avatar-item {
      text-align: center;
    }
    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      object-fit: cover;
    }
    .avatar-name {
      font-size: 11px;
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.7);
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .stat {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
    }
    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🖼️ Avatar Cache Test</h1>
    <p>Test the unified avatar cache system with houseguests and players.</p>

    <div class="test-section">
      <h3>Cache Statistics</h3>
      <div class="stats" id="stats">
        <div class="stat">
          <div class="stat-value" id="totalStat">0</div>
          <div class="stat-label">Total Cached</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="loadedStat">0</div>
          <div class="stat-label">Loaded</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="loadingStat">0</div>
          <div class="stat-label">Loading</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="errorStat">0</div>
          <div class="stat-label">Errors</div>
        </div>
      </div>
    </div>

    <div class="test-section">
      <h3>Test Controls</h3>
      <button class="test-btn" onclick="testPreloadHouseguests()">Preload Houseguests</button>
      <button class="test-btn" onclick="testPreloadPlayers()">Preload Players</button>
      <button class="test-btn" onclick="testPreloadAll()">Preload All</button>
      <button class="test-btn" onclick="testCacheRetrieval()">Test Cache Retrieval</button>
      <button class="test-btn" onclick="clearCache()">Clear Cache</button>
      <button class="test-btn" onclick="clearLog()">Clear Log</button>
    </div>

    <div class="test-section">
      <h3>Cached Avatars</h3>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>

    <div class="test-section">
      <h3>Test Log</h3>
      <div class="log" id="testLog"></div>
    </div>
  </div>

  <!-- Load dependencies -->
  <script>
    // Initialize minimal game object
    window.game = window.game || { cfg: {}, players: [] };
  </script>
  <script src="js/config/defaults.js"></script>
  <script src="js/data/houseguests.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/preload/avatar-cache.js"></script>

  <script>
    // Logging utilities
    function log(message, type = 'info') {
      const logDiv = document.getElementById('testLog');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      document.getElementById('testLog').innerHTML = '';
      log('Log cleared');
    }

    // Update statistics
    function updateStats() {
      const AvatarCache = window.AvatarCache;
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      const stats = AvatarCache.getStats();
      document.getElementById('totalStat').textContent = stats.total;
      document.getElementById('loadedStat').textContent = stats.loaded;
      document.getElementById('loadingStat').textContent = stats.loading;
      document.getElementById('errorStat').textContent = stats.error;

      renderAvatarGrid();
    }

    // Render avatar grid
    function renderAvatarGrid() {
      const AvatarCache = window.AvatarCache;
      const grid = document.getElementById('avatarGrid');
      grid.innerHTML = '';

      // Get all houseguests
      const houseguests = window.Houseguests ? window.Houseguests.getAll() : [];
      
      houseguests.forEach(hg => {
        const cached = AvatarCache.get(hg);
        if (cached && cached.status === 'loaded') {
          const item = document.createElement('div');
          item.className = 'avatar-item';
          
          const img = document.createElement('img');
          img.className = 'avatar-img';
          img.src = cached.url;
          img.alt = hg.name;
          
          const name = document.createElement('div');
          name.className = 'avatar-name';
          name.textContent = hg.name;
          
          item.appendChild(img);
          item.appendChild(name);
          grid.appendChild(item);
        }
      });

      if (grid.children.length === 0) {
        grid.innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.5);">No cached avatars yet</p>';
      }
    }

    // Test functions
    async function testPreloadHouseguests() {
      log('Starting houseguest preload...');
      const AvatarCache = window.AvatarCache;
      
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      try {
        const result = await AvatarCache.preloadHouseguests({
          onProgress: (loaded, total) => {
            log(`Progress: ${loaded}/${total} (${Math.round((loaded/total)*100)}%)`);
          }
        });

        log(`Preload complete: ${result.loaded}/${result.total} loaded, ${result.cached} cached, ${result.failed} failed (${result.elapsed}ms)`, 'success');
        updateStats();
      } catch (err) {
        log(`Preload error: ${err.message}`, 'error');
      }
    }

    async function testPreloadPlayers() {
      log('Starting player preload...');
      const AvatarCache = window.AvatarCache;
      
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      // Create dummy players
      const players = [
        { id: 0, name: 'You' },
        { id: 1, name: 'Player1' },
        { id: 2, name: 'Player2' }
      ];

      try {
        const result = await AvatarCache.preloadPlayers(players, {
          onProgress: (loaded, total) => {
            log(`Progress: ${loaded}/${total} (${Math.round((loaded/total)*100)}%)`);
          }
        });

        log(`Preload complete: ${result.loaded}/${result.total} loaded, ${result.cached} cached, ${result.failed} failed (${result.elapsed}ms)`, 'success');
        updateStats();
      } catch (err) {
        log(`Preload error: ${err.message}`, 'error');
      }
    }

    async function testPreloadAll() {
      log('Starting preload all...');
      const AvatarCache = window.AvatarCache;
      
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      // Create dummy players
      const players = [
        { id: 0, name: 'You' },
        { id: 1, name: 'Player1' },
        { id: 2, name: 'Player2' }
      ];

      try {
        const result = await AvatarCache.preloadAll({
          players,
          onProgress: (loaded, total) => {
            log(`Progress: ${loaded}/${total} (${Math.round((loaded/total)*100)}%)`);
          }
        });

        log(`Preload complete: ${result.loaded}/${result.total} loaded, ${result.cached} cached, ${result.failed} failed (${result.elapsed}ms)`, 'success');
        log(`  - Houseguests: ${result.houseguestsCount}, Players: ${result.playersCount}`);
        updateStats();
      } catch (err) {
        log(`Preload error: ${err.message}`, 'error');
      }
    }

    function testCacheRetrieval() {
      log('Testing cache retrieval...');
      const AvatarCache = window.AvatarCache;
      
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      const houseguests = window.Houseguests ? window.Houseguests.getAll() : [];
      if (houseguests.length === 0) {
        log('No houseguests available', 'error');
        return;
      }

      const hg = houseguests[0];
      log(`Testing retrieval for ${hg.name}...`);
      
      const cached = AvatarCache.get(hg);
      if (cached) {
        log(`  - Status: ${cached.status}`, 'success');
        log(`  - URL: ${cached.url}`, 'success');
        log(`  - Has image: ${!!cached.image}`, 'success');
      } else {
        log(`  - Not in cache`, 'error');
      }

      const has = AvatarCache.has(hg);
      log(`  - has() check: ${has}`, has ? 'success' : 'error');

      const url = AvatarCache.getUrl(hg);
      log(`  - getUrl(): ${url}`, url ? 'success' : 'error');
    }

    function clearCache() {
      log('Clearing cache...');
      const AvatarCache = window.AvatarCache;
      
      if (!AvatarCache) {
        log('AvatarCache not available', 'error');
        return;
      }

      AvatarCache.clear();
      log('Cache cleared', 'success');
      updateStats();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      log('Avatar Cache Test initialized');
      log(`AvatarCache available: ${!!window.AvatarCache}`);
      log(`Houseguests available: ${!!(window.Houseguests && window.Houseguests.getAll())}`);
      
      if (window.Houseguests) {
        const hg = window.Houseguests.getAll();
        log(`Houseguest count: ${hg.length}`);
      }

      updateStats();
    });
  </script>
</body>
</html>
