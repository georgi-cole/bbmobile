<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IntroScreen Test - BBMobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="css/intro.css">
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #fff;
  }
  .controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10000;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 8px;
    max-width: 300px;
  }
  .controls h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
  }
  .controls button {
    display: block;
    width: 100%;
    margin: 5px 0;
    padding: 8px;
    background: #0088ff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls button:hover {
    background: #0099ff;
  }
  .controls .info {
    margin: 10px 0;
    padding: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    font-size: 12px;
  }
  #eventLog {
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 10000;
    background: rgba(0,0,0,0.9);
    padding: 10px;
    border-radius: 8px;
    max-width: 400px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 11px;
    font-family: monospace;
  }
  #eventLog .event {
    margin: 2px 0;
    padding: 4px;
    border-left: 2px solid #00d4ff;
    padding-left: 8px;
  }
</style>
</head>
<body>

<div class="controls">
  <h3>IntroScreen Test Controls</h3>
  <button id="btnShow">Show IntroScreen</button>
  <button id="btnHide">Hide IntroScreen</button>
  <button id="btnChangeTheme">Change Background Theme</button>
  <button id="btnToggleAdaptive">Toggle Adaptive BG</button>
  <div class="info">
    <strong>Current Theme:</strong> <span id="currentTheme">None</span><br>
    <strong>Adaptive:</strong> <span id="adaptiveStatus">true</span>
  </div>
</div>

<div id="eventLog">
  <strong>Event Log:</strong>
</div>

<!-- Load dependencies -->
<script src="js/bbGameBus.js"></script>
<script src="src/utils/backgroundTheme.js"></script>
<script src="src/ui/IntroScreen.js"></script>

<script>
(function() {
  'use strict';
  
  // Initialize game bus
  if (!window.game) window.game = {};
  window.game.bus = window.bbGameBus;
  
  // Mock audio controls for testing
  window.game.audio = {
    toggleMusic: function() {
      logEvent('Music toggled');
      return true;
    },
    toggleSound: function() {
      logEvent('Sound toggled');
      return true;
    }
  };
  
  // Initialize BackgroundTheme
  const bgTheme = window.BackgroundTheme.init({ bus: window.bbGameBus });
  
  // Initialize IntroScreen
  const introScreen = window.IntroScreen.init({ bus: window.bbGameBus });
  
  // Listen to all intro events
  const events = [
    'intro:play',
    'intro:open:rules',
    'intro:open:profile',
    'intro:open:leaderboard',
    'intro:open:settings',
    'intro:open:credits',
    'intro:open:help',
    'intro:chip:daily',
    'intro:chip:news',
    'theme:bg-change'
  ];
  
  events.forEach(event => {
    window.bbGameBus.on(event, (data) => {
      logEvent(`${event}`, data);
    });
  });
  
  // Button handlers
  document.getElementById('btnShow').addEventListener('click', () => {
    introScreen.show();
    logEvent('Show IntroScreen');
  });
  
  document.getElementById('btnHide').addEventListener('click', () => {
    introScreen.hide();
    logEvent('Hide IntroScreen');
  });
  
  document.getElementById('btnChangeTheme').addEventListener('click', () => {
    bgTheme.updateTheme(true);
    const current = bgTheme.getCurrent();
    updateThemeDisplay(current);
    logEvent('Theme update forced', current);
  });
  
  document.getElementById('btnToggleAdaptive').addEventListener('click', () => {
    const currentStatus = document.getElementById('adaptiveStatus').textContent === 'true';
    bgTheme.setAdaptive(!currentStatus);
    document.getElementById('adaptiveStatus').textContent = !currentStatus;
    logEvent('Adaptive BG toggled', { enabled: !currentStatus });
  });
  
  // Update theme display
  function updateThemeDisplay(theme) {
    if (theme) {
      document.getElementById('currentTheme').textContent = `${theme.key} (${theme.reason})`;
    }
  }
  
  // Log events
  function logEvent(message, data) {
    const log = document.getElementById('eventLog');
    const entry = document.createElement('div');
    entry.className = 'event';
    entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
    if (data && typeof data === 'object') {
      entry.textContent += ` ${JSON.stringify(data, null, 2)}`;
    }
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }
  
  // Initial theme
  const initialTheme = bgTheme.getCurrent();
  if (initialTheme) {
    updateThemeDisplay(initialTheme);
  }
  
  logEvent('Test initialized');
  
  // Auto-show after 1 second for demo
  setTimeout(() => {
    introScreen.show();
    logEvent('Auto-showing IntroScreen');
  }, 1000);
  
})();
</script>

</body>
</html>
