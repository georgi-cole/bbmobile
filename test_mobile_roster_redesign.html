<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Roster Redesign Test</title>
  
  <!-- Base styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/mobileRoster.css?v=roster-ui-4">
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .test-container {
      max-width: 520px;
      margin: 0 auto;
    }
    
    .test-header {
      margin-bottom: 20px;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    
    .test-header h1 {
      margin: 0 0 12px 0;
      font-size: 1.5rem;
    }
    
    .test-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    
    .test-btn {
      padding: 8px 16px;
      background: var(--primary-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      font-size: 0.875rem;
    }
    
    .test-btn:hover {
      background: var(--primary-3);
    }
    
    .test-info {
      margin-top: 12px;
      padding: 12px;
      background: var(--card-2);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .test-status {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    
    .test-status.success {
      background: rgba(39, 174, 96, 0.1);
      color: #27ae60;
      border: 1px solid rgba(39, 174, 96, 0.3);
    }
    
    .test-status.error {
      background: rgba(231, 76, 60, 0.1);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
    
    .test-status.info {
      background: rgba(52, 152, 219, 0.1);
      color: #3498db;
      border: 1px solid rgba(52, 152, 219, 0.3);
    }
    
    /* Mock game elements */
    #rosterBar {
      margin: 16px 0;
      padding: 12px;
      background: var(--card);
      border-radius: 8px;
      text-align: center;
      color: var(--muted-2);
    }
    
    #tvNow {
      min-height: 200px;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <h1>🧪 Mobile Roster Redesign Test</h1>
      <p style="margin: 0 0 12px 0; color: var(--muted-2); font-size: 0.875rem;">
        Testing auto-init, hold behavior, badge system, and space optimization
      </p>
      
      <div class="test-controls">
        <button class="test-btn" onclick="runDiagnostics()">Run Diagnostics</button>
        <button class="test-btn" onclick="forceEnable()">Force Enable</button>
        <button class="test-btn" onclick="testBadges()">Test Badges</button>
        <button class="test-btn" onclick="addPlayer()">Add Test Player</button>
        <button class="test-btn" onclick="evictPlayer()">Evict Player</button>
        <button class="test-btn" onclick="clearConsole()">Clear Info</button>
      </div>
      
      <div id="testStatus"></div>
      <div id="testInfo" class="test-info" style="display:none;"></div>
    </div>
    
    <!-- Mock game structure -->
    <div id="rosterBar">Default Roster Bar (should be hidden when mobile roster active)</div>
    
    <!-- Mobile roster container will be injected here by MobileRoster.init() -->
    
    <div id="tvNow">TV Area</div>
  </div>
  
  <!-- Mock game object -->
  <script>
    window.game = window.game || {};
    window.game.players = [
      { id: 1, name: 'Alice', hoh: true, evicted: false },
      { id: 2, name: 'Bob', nominated: true, evicted: false },
      { id: 3, name: 'Charlie', pov: true, nominated: true, evicted: false },
      { id: 4, name: 'Diana', safe: true, evicted: false },
      { id: 5, name: 'Eve', evicted: false },
      { id: 6, name: 'Frank', evicted: false },
      { id: 7, name: 'Grace', hoh: true, pov: true, evicted: false },
      { id: 8, name: 'Henry', evicted: true, evictedAt: 1 }
    ];
    window.game.season = 1;
    window.game.week = 3;
    window.game.phase = 'nominations';
    
    // Force mobile roster for testing
    window.FORCE_MOBILE_ROSTER = true;
    
    let nextPlayerId = 9;
    
    function logToTest(message, type = 'info') {
      const infoDiv = document.getElementById('testInfo');
      const statusDiv = document.getElementById('testStatus');
      
      infoDiv.style.display = 'block';
      infoDiv.textContent += message + '\n';
      infoDiv.scrollTop = infoDiv.scrollHeight;
      
      statusDiv.innerHTML = `<div class="test-status ${type}">${message}</div>`;
    }
    
    function runDiagnostics() {
      if (!window.MobileRosterDiagnostics) {
        logToTest('❌ MobileRosterDiagnostics not found', 'error');
        return;
      }
      
      const status = window.MobileRosterDiagnostics.getStatus();
      logToTest('📊 Diagnostics:\n' + JSON.stringify(status, null, 2), 'info');
      
      if (status.active) {
        logToTest('✅ Mobile roster is active', 'success');
      } else {
        logToTest('⚠️ Mobile roster is not active', 'error');
      }
    }
    
    function forceEnable() {
      if (!window.MobileRoster) {
        logToTest('❌ MobileRoster not found', 'error');
        return;
      }
      
      window.MobileRoster.forceEnable();
      logToTest('✅ Force enable triggered', 'success');
      
      setTimeout(runDiagnostics, 500);
    }
    
    function testBadges() {
      // Count players with statuses
      const playersWithStatus = window.game.players.filter(p => 
        !p.evicted && (p.hoh || p.pov || p.nominated || p.safe)
      );
      
      logToTest(`📛 ${playersWithStatus.length} players have statuses`, 'info');
      
      playersWithStatus.forEach(p => {
        const statuses = [];
        if (p.hoh) statuses.push('HOH');
        if (p.pov) statuses.push('POV');
        if (p.nominated) statuses.push('NOM');
        if (p.safe) statuses.push('SAFE');
        logToTest(`  - ${p.name}: ${statuses.join('+')}`, 'info');
      });
    }
    
    function addPlayer() {
      const newPlayer = {
        id: nextPlayerId,
        name: `Player${nextPlayerId}`,
        evicted: false,
        nominated: Math.random() > 0.7
      };
      nextPlayerId++;
      
      window.game.players.push(newPlayer);
      
      if (window.MobileRoster) {
        window.MobileRoster.refresh();
      }
      
      logToTest(`✅ Added ${newPlayer.name}`, 'success');
    }
    
    function evictPlayer() {
      const activePlayers = window.game.players.filter(p => !p.evicted);
      if (activePlayers.length === 0) {
        logToTest('❌ No active players to evict', 'error');
        return;
      }
      
      const player = activePlayers[Math.floor(Math.random() * activePlayers.length)];
      player.evicted = true;
      player.evictedAt = window.game.week;
      
      if (window.MobileRoster) {
        window.MobileRoster.refresh();
      }
      
      logToTest(`✅ Evicted ${player.name}`, 'success');
    }
    
    function clearConsole() {
      document.getElementById('testInfo').textContent = '';
      document.getElementById('testStatus').innerHTML = '';
    }
    
    // Log when script loads
    window.addEventListener('load', () => {
      logToTest('🚀 Test page loaded', 'info');
      setTimeout(() => {
        runDiagnostics();
      }, 1000);
    });
  </script>
  
  <!-- Mobile Roster Script -->
  <script defer src="js/ui/mobileRoster.js?v=roster-ui-3"></script>
</body>
</html>
