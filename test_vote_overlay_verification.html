<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Overlay Verification Test</title>
  <link rel="stylesheet" href="css/livevote-voteoverlay.css">
  <link rel="stylesheet" href="css/livevote-voteoverlay-patch.css">
  <link rel="stylesheet" href="css/eviction-layout-containment.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e14;
      color: #fff;
    }
    .test-controls {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10000;
      background: rgba(20, 30, 40, 0.95);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(143, 211, 255, 0.3);
    }
    button {
      background: #2d7a9c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }
    button:hover {
      background: #357fa0;
    }
    .info {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="test-controls">
    <h3>Vote Overlay Test</h3>
    <button id="btnOpen2">Open with 2 Nominees</button>
    <button id="btnOpen4">Open with 4 Nominees</button>
    <button id="btnClose">Close Overlay</button>
    <div class="info">
      <p><strong>Test Points:</strong></p>
      <ol>
        <li>Click nominee names to select</li>
        <li>Evict button should be visible</li>
        <li>"Cast your vote" text should be clear</li>
        <li>Test on desktop and mobile</li>
      </ol>
    </div>
  </div>

  <script type="module">
    // Mock global functions needed by the overlay
    window.getP = (id) => {
      const players = {
        1: { id: 1, name: 'Alice' },
        2: { id: 2, name: 'Bob' },
        3: { id: 3, name: 'Charlie' },
        4: { id: 4, name: 'Eve' }
      };
      return players[id] || { id, name: `Player${id}` };
    };

    window.safeName = (id) => {
      const player = window.getP(id);
      return player ? player.name : `Player${id}`;
    };

    window.resolveAvatar = (player) => {
      return `https://api.dicebear.com/6.x/bottts/svg?seed=${encodeURIComponent(player.name || 'player')}`;
    };

    // Import the overlay module
    const module = await import('./js/livevote-voteoverlay.js');
    const LiveVoteOverlay = module.LiveVoteOverlay || window.LiveVoteOverlay;

    // Test buttons
    document.getElementById('btnOpen2').onclick = async () => {
      console.log('Opening overlay with 2 nominees');
      await LiveVoteOverlay.open({
        nominees: [1, 2],
        onSubmit: (nomineeId) => {
          console.log('Vote submitted for:', nomineeId);
          alert(`Voted to evict: ${window.getP(nomineeId).name}`);
          LiveVoteOverlay.close();
        },
        allowClose: true,
        onCancel: () => {
          console.log('Voting cancelled');
          LiveVoteOverlay.close();
        }
      });
    };

    document.getElementById('btnOpen4').onclick = async () => {
      console.log('Opening overlay with 4 nominees');
      await LiveVoteOverlay.open({
        nominees: [1, 2, 3, 4],
        onSubmit: (nomineeId) => {
          console.log('Vote submitted for:', nomineeId);
          alert(`Voted to evict: ${window.getP(nomineeId).name}`);
          LiveVoteOverlay.close();
        },
        allowClose: true,
        onCancel: () => {
          console.log('Voting cancelled');
          LiveVoteOverlay.close();
        }
      });
    };

    document.getElementById('btnClose').onclick = () => {
      LiveVoteOverlay.close();
    };

    console.log('Test page ready. Click buttons to open overlay.');
  </script>
</body>
</html>
