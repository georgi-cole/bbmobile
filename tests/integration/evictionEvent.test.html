<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eviction Event Integration Test</title>
  
  <link rel="stylesheet" href="../../css/eviction.css">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }

    h1 { color: #38bdf8; }
    h2 { color: #60a5fa; margin-top: 24px; }

    .test-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      margin: 16px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .test-case {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin: 12px 0;
      border-left: 4px solid #60a5fa;
    }

    .test-case.running {
      border-left-color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }

    .test-case.pass {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }

    .test-case.fail {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .test-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .test-status {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .test-error {
      color: #f87171;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      margin-top: 8px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    .summary {
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-top: 24px;
      font-size: 1.1rem;
    }

    .summary.all-pass {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .summary.some-fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button {
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
    }

    button:hover {
      background: #2563eb;
    }

    #tv {
      display: none;
    }
  </style>
</head>
<body>
  <h1>🧪 Eviction Event Integration Test</h1>
  <p>Tests that the eviction UI emits the correct event when a vote is cast.</p>

  <button id="runTests">Run All Tests</button>

  <div id="testResults"></div>
  <div id="summary"></div>

  <!-- Mock TV container -->
  <div id="tv">
    <div id="tvOverlay"></div>
  </div>

  <script src="../../js/bbGameBus.js"></script>
  <script src="../../js/ui/eviction/doubleTapUtil.js"></script>
  <script src="../../js/ui/eviction/evictionUI.js"></script>

  <script>
    // Test framework
    class TestRunner {
      constructor() {
        this.tests = [];
        this.results = [];
      }

      test(name, fn) {
        this.tests.push({ name, fn });
      }

      async runAll() {
        this.results = [];
        const resultsContainer = document.getElementById('testResults');
        resultsContainer.innerHTML = '<h2>Test Results</h2>';

        for (const test of this.tests) {
          const testDiv = document.createElement('div');
          testDiv.className = 'test-case running';
          testDiv.innerHTML = `
            <div class="test-name">${test.name}</div>
            <div class="test-status">Running...</div>
          `;
          resultsContainer.appendChild(testDiv);

          try {
            await test.fn();
            testDiv.className = 'test-case pass';
            testDiv.querySelector('.test-status').textContent = '✅ PASS';
            this.results.push({ name: test.name, pass: true });
          } catch (error) {
            testDiv.className = 'test-case fail';
            testDiv.querySelector('.test-status').textContent = '❌ FAIL';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'test-error';
            errorDiv.textContent = error.message || error;
            testDiv.appendChild(errorDiv);
            this.results.push({ name: test.name, pass: false, error });
          }

          // Small delay between tests
          await new Promise(resolve => setTimeout(resolve, 100));
        }

        this.showSummary();
      }

      showSummary() {
        const passed = this.results.filter(r => r.pass).length;
        const failed = this.results.filter(r => !r.pass).length;
        const total = this.results.length;

        const summary = document.getElementById('summary');
        const allPass = failed === 0;
        summary.className = `summary ${allPass ? 'all-pass' : 'some-fail'}`;
        summary.innerHTML = `
          <strong>Summary:</strong> ${passed} / ${total} tests passed
          ${failed > 0 ? `<br><span style="color: #f87171;">${failed} tests failed</span>` : ''}
        `;
      }
    }

    // Mock game object
    window.game = {
      humanId: 1,
      local: { id: 1 },
      players: [],
      cfg: {},
      bus: window.bbGameBus
    };

    // Test data
    const testNominees = [
      { id: 101, name: 'Alice', avatarUrl: 'https://api.dicebear.com/6.x/bottts/svg?seed=Alice', seatId: 1 },
      { id: 102, name: 'Bob', avatarUrl: 'https://api.dicebear.com/6.x/bottts/svg?seed=Bob', seatId: 2 }
    ];

    // Initialize test runner
    const runner = new TestRunner();

    // Test 1: Verify event is emitted on double-click
    runner.test('Should emit eviction:vote:cast event on double-click', async () => {
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout: Event not emitted within 5 seconds'));
        }, 5000);

        let eventReceived = false;

        const handler = (payload) => {
          if (eventReceived) {
            cleanup();
            reject(new Error('Event emitted multiple times (should be exactly once)'));
            return;
          }

          eventReceived = true;

          try {
            // Verify payload structure
            if (!payload || typeof payload !== 'object') {
              throw new Error('Payload is not an object');
            }
            if (!payload.voterId) {
              throw new Error('Payload missing voterId');
            }
            if (!payload.nomineeId) {
              throw new Error('Payload missing nomineeId');
            }
            if (!payload.timestamp) {
              throw new Error('Payload missing timestamp');
            }
            if (payload.nomineeId !== 101) {
              throw new Error(`Expected nomineeId=101, got ${payload.nomineeId}`);
            }

            cleanup();
            resolve();
          } catch (error) {
            cleanup();
            reject(error);
          }
        };

        function cleanup() {
          clearTimeout(timeout);
          window.bbGameBus.off('eviction:vote:cast', handler);
          window.EvictionUI.cleanup();
        }

        // Listen for event
        window.bbGameBus.on('eviction:vote:cast', handler);

        // Start eviction
        window.bbGameBus.emit('phase:eviction:start', {
          nominees: testNominees,
          eligible: true,
          phaseId: 'test-1'
        });

        // Wait for UI to render
        setTimeout(() => {
          const tile = document.querySelector('.eviction-nominee[data-nominee-id="101"]');
          if (!tile) {
            cleanup();
            reject(new Error('Nominee tile not found in DOM'));
            return;
          }

          // Simulate double-click (coordinates relative to element center)
          const rect = tile.getBoundingClientRect();
          const event = new MouseEvent('dblclick', {
            bubbles: true,
            cancelable: true,
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + rect.height / 2
          });
          tile.dispatchEvent(event);
        }, 500);
      });
    });

    // Test 2: Verify single click does NOT emit event
    runner.test('Should NOT emit event on single click', async () => {
      return new Promise((resolve, reject) => {
        const SINGLE_CLICK_WAIT_MS = 2000; // Wait time to confirm no event is emitted
        const timeout = setTimeout(() => {
          cleanup();
          resolve(); // Success - no event emitted
        }, SINGLE_CLICK_WAIT_MS);

        const handler = (payload) => {
          cleanup();
          reject(new Error('Event emitted on single click (should not happen)'));
        };

        function cleanup() {
          clearTimeout(timeout);
          window.bbGameBus.off('eviction:vote:cast', handler);
          window.EvictionUI.cleanup();
        }

        // Listen for event
        window.bbGameBus.on('eviction:vote:cast', handler);

        // Start eviction
        window.bbGameBus.emit('phase:eviction:start', {
          nominees: testNominees,
          eligible: true,
          phaseId: 'test-2'
        });

        // Wait for UI to render
        setTimeout(() => {
          const tile = document.querySelector('.eviction-nominee[data-nominee-id="101"]');
          if (!tile) {
            cleanup();
            reject(new Error('Nominee tile not found in DOM'));
            return;
          }

          // Simulate single click (not double) - coordinates relative to element center
          const rect = tile.getBoundingClientRect();
          const event = new MouseEvent('mousedown', {
            bubbles: true,
            cancelable: true,
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + rect.height / 2
          });
          tile.dispatchEvent(event);
        }, 500);
      });
    });

    // Test 3: Verify ineligible voter skips UI
    runner.test('Should skip voting UI when ineligible', async () => {
      return new Promise((resolve, reject) => {
        const FAUX_TV_NAVIGATION_TIMEOUT = 2000; // Time to wait for faux-TV navigation
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout: Expected faux-TV navigation within 2 seconds'));
        }, FAUX_TV_NAVIGATION_TIMEOUT);

        let fauxTvCalled = false;

        // Mock faux-TV function
        const originalFn = window.beginDiaryRoomSequence;
        window.beginDiaryRoomSequence = function() {
          fauxTvCalled = true;
          cleanup();
          resolve();
        };

        function cleanup() {
          clearTimeout(timeout);
          window.beginDiaryRoomSequence = originalFn;
          window.EvictionUI.cleanup();
        }

        // Start eviction with eligible=false
        window.bbGameBus.emit('phase:eviction:start', {
          nominees: testNominees,
          eligible: false,
          phaseId: 'test-3'
        });

        // Check that voting UI is NOT shown
        setTimeout(() => {
          const container = document.querySelector('.eviction-ui-container');
          if (container) {
            cleanup();
            reject(new Error('Voting UI shown for ineligible voter (should be hidden)'));
          }
        }, 500);
      });
    });

    // Test 4: Verify keyboard activation works
    runner.test('Should emit event on keyboard activation (Enter)', async () => {
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout: Event not emitted within 5 seconds'));
        }, 5000);

        const handler = (payload) => {
          try {
            if (!payload || !payload.nomineeId) {
              throw new Error('Invalid payload');
            }
            cleanup();
            resolve();
          } catch (error) {
            cleanup();
            reject(error);
          }
        };

        function cleanup() {
          clearTimeout(timeout);
          window.bbGameBus.off('eviction:vote:cast', handler);
          window.EvictionUI.cleanup();
        }

        // Listen for event
        window.bbGameBus.on('eviction:vote:cast', handler);

        // Start eviction
        window.bbGameBus.emit('phase:eviction:start', {
          nominees: testNominees,
          eligible: true,
          phaseId: 'test-4'
        });

        // Wait for UI to render
        setTimeout(() => {
          const tile = document.querySelector('.eviction-nominee[data-nominee-id="101"]');
          if (!tile) {
            cleanup();
            reject(new Error('Nominee tile not found in DOM'));
            return;
          }

          // Focus and press Enter
          tile.focus();
          const event = new KeyboardEvent('keydown', {
            key: 'Enter',
            bubbles: true,
            cancelable: true
          });
          tile.dispatchEvent(event);
        }, 500);
      });
    });

    // Run tests button
    document.getElementById('runTests').addEventListener('click', () => {
      runner.runAll();
    });

    // Auto-run on load (optional)
    window.addEventListener('load', () => {
      console.log('Integration tests ready. Click "Run All Tests" to start.');
    });
  </script>
</body>
</html>
