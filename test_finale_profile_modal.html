<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test: Finale Profile Modal Integration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
      background: #3563a7;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button:hover {
      background: #4573b7;
    }
    #testLog {
      background: #111;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .log-entry {
      margin: 2px 0;
    }
    .log-info { color: #4af; }
    .log-warn { color: #fa4; }
    .log-error { color: #f44; }
    .log-success { color: #4f4; }
  </style>
</head>
<body>
  <h1>Finale Profile Modal Integration Test</h1>
  
  <div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="testShowFinale()">1. Show Finale Winner Modal</button>
    <button onclick="testProfileModalExists()">2. Check ProfileModal/ProfileService</button>
    <button onclick="testNewSeasonButton()">3. Simulate NEW SEASON Click</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div class="test-section">
    <h2>Test Log</h2>
    <div id="testLog"></div>
  </div>

  <!-- Load profile system -->
  <script src="src/profile/profileStorage.js" onerror="console.error('Failed to load profileStorage.js')"></script>
  <script src="src/profile/profileService.js" onerror="console.error('Failed to load profileService.js')"></script>
  <script src="src/ui/ProfileModal.js" onerror="console.error('Failed to load ProfileModal.js')"></script>
  <script src="js/player-profile-modal.js" onerror="console.error('Failed to load player-profile-modal.js')"></script>
  
  <!-- Load finale -->
  <script src="js/finale.js" onerror="console.error('Failed to load finale.js')"></script>

  <!-- Test script -->
  <script>
    // Set up minimal game environment
    window.game = {
      players: [
        { id: 0, name: 'Alice', human: true, stats: { hohWins: 3, vetoWins: 2 }, nominatedCount: 1 },
        { id: 1, name: 'Bob', stats: { hohWins: 1, vetoWins: 4 }, nominatedCount: 3 },
        { id: 2, name: 'Charlie', stats: { hohWins: 2, vetoWins: 1 }, nominatedCount: 2 }
      ],
      humanId: 0
    };
    
    window.safeName = (id) => window.game.players.find(p => p.id === id)?.name || 'Unknown';
    window.getP = (id) => window.game.players.find(p => p.id === id);
    
    // Mock rebuildGame and startOpeningSequence
    window.rebuildGame = function(preservePlayers) {
      log('rebuildGame called with preservePlayers=' + preservePlayers, 'info');
    };
    
    window.startOpeningSequence = function() {
      log('startOpeningSequence called', 'info');
    };

    function log(message, type = 'info') {
      const logDiv = document.getElementById('testLog');
      const entry = document.createElement('div');
      entry.className = 'log-entry log-' + type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      
      // Also log to console
      console.log(`[test] ${message}`);
    }

    function clearLog() {
      document.getElementById('testLog').innerHTML = '';
    }

    function testProfileModalExists() {
      log('=== Checking ProfileModal and ProfileService ===', 'info');
      log('ProfileService exists: ' + (window.ProfileService ? 'YES' : 'NO'), 
          window.ProfileService ? 'success' : 'error');
      log('ProfileModal exists: ' + (window.ProfileModal ? 'YES' : 'NO'),
          window.ProfileModal ? 'success' : 'error');
      
      if (window.ProfileService) {
        log('ProfileService.incrementSeason exists: ' + 
            (typeof window.ProfileService.incrementSeason === 'function' ? 'YES' : 'NO'),
            typeof window.ProfileService.incrementSeason === 'function' ? 'success' : 'error');
        log('ProfileService.setCurrentProfile exists: ' + 
            (typeof window.ProfileService.setCurrentProfile === 'function' ? 'YES' : 'NO'),
            typeof window.ProfileService.setCurrentProfile === 'function' ? 'success' : 'error');
        log('ProfileService.setGuestMode exists: ' + 
            (typeof window.ProfileService.setGuestMode === 'function' ? 'YES' : 'NO'),
            typeof window.ProfileService.setGuestMode === 'function' ? 'success' : 'error');
      }
      
      if (window.ProfileModal) {
        log('ProfileModal.show exists: ' + 
            (typeof window.ProfileModal.show === 'function' ? 'YES' : 'NO'),
            typeof window.ProfileModal.show === 'function' ? 'success' : 'error');
        log('ProfileModal.hide exists: ' + 
            (typeof window.ProfileModal.hide === 'function' ? 'YES' : 'NO'),
            typeof window.ProfileModal.hide === 'function' ? 'success' : 'error');
      }
    }

    function testShowFinale() {
      log('=== Testing Finale Modal ===', 'info');
      
      if (typeof window.showFinaleCinematic === 'function') {
        log('showFinaleCinematic exists: YES', 'success');
        log('Showing finale for winner ID 0 (Alice)...', 'info');
        window.showFinaleCinematic(0);
        log('Finale modal should now be visible', 'success');
      } else {
        log('showFinaleCinematic not found!', 'error');
      }
    }

    function testNewSeasonButton() {
      log('=== Testing NEW SEASON Button ===', 'info');
      
      const newSeasonBtn = document.getElementById('cinNewSeason');
      if (newSeasonBtn) {
        log('NEW SEASON button found', 'success');
        log('Clicking NEW SEASON button...', 'info');
        newSeasonBtn.click();
        log('ProfileModal should now be open', 'success');
      } else {
        log('NEW SEASON button not found - show finale first', 'warn');
      }
    }

    // Override console methods to capture logs
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalInfo = console.info;
    const originalError = console.error;
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      if (args[0] && typeof args[0] === 'string' && 
          (args[0].includes('[finale]') || args[0].includes('[new-season]') || 
           args[0].includes('[ProfileModal]') || args[0].includes('[profileService]'))) {
        log(args.join(' '), 'info');
      }
    };
    
    console.info = function(...args) {
      originalInfo.apply(console, args);
      if (args[0] && typeof args[0] === 'string' && 
          (args[0].includes('[finale]') || args[0].includes('[new-season]') || 
           args[0].includes('[ProfileModal]') || args[0].includes('[profileService]'))) {
        log(args.join(' '), 'info');
      }
    };
    
    console.warn = function(...args) {
      originalWarn.apply(console, args);
      if (args[0] && typeof args[0] === 'string' && 
          (args[0].includes('[finale]') || args[0].includes('[new-season]') || 
           args[0].includes('[ProfileModal]') || args[0].includes('[profileService]'))) {
        log(args.join(' '), 'warn');
      }
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      if (args[0] && typeof args[0] === 'string' && 
          (args[0].includes('[finale]') || args[0].includes('[new-season]') || 
           args[0].includes('[ProfileModal]') || args[0].includes('[profileService]'))) {
        log(args.join(' '), 'error');
      }
    };

    // Auto-run tests on load
    window.addEventListener('DOMContentLoaded', () => {
      log('=== Test Page Loaded ===', 'success');
      log('Click buttons above to test the integration', 'info');
      testProfileModalExists();
    });
  </script>
</body>
</html>
