<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test: Veto Results Top-3 Display</title>
  <link rel="stylesheet" href="css/veto-results.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d151f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-header {
      background: rgba(120, 180, 240, 0.1);
      border: 1px solid rgba(120, 180, 240, 0.3);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-header h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      color: #78b4f0;
    }
    .test-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: 1px solid rgba(120, 180, 240, 0.5);
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(40, 60, 80, 0.8) 0%, rgba(25, 40, 55, 0.8) 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: linear-gradient(135deg, rgba(45, 68, 90, 0.9) 0%, rgba(30, 48, 65, 0.9) 100%);
      border-color: rgba(120, 180, 240, 0.8);
    }
    .btn-ffwd {
      background: linear-gradient(135deg, rgba(80, 40, 80, 0.8) 0%, rgba(55, 25, 55, 0.8) 100%);
    }
    .btn-ffwd:hover {
      background: linear-gradient(135deg, rgba(90, 45, 90, 0.9) 0%, rgba(65, 30, 65, 0.9) 100%);
    }
    .test-tv {
      position: relative;
      width: 100%;
      height: 600px;
      background: #1a2937;
      border: 2px solid rgba(120, 180, 240, 0.3);
      border-radius: 12px;
      overflow: visible;
    }
    .test-results {
      margin-top: 20px;
      padding: 15px;
      background: rgba(40, 60, 80, 0.5);
      border-radius: 8px;
    }
    .test-results h3 {
      margin: 0 0 10px 0;
      color: #78b4f0;
    }
    .test-status {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <h1>🛡️ Veto Results Top-3 Display Test</h1>
      <p>This test validates the top-3 veto competition results with auto-dismiss (5s) and FFWD close behavior.</p>
      <div class="test-controls">
        <button onclick="testTop3Render()">Test Top-3 Display</button>
        <button onclick="testAutoDismiss()">Test Auto-Dismiss (5s)</button>
        <button onclick="testLargeGroup()">Test Large Group (shows top 3 only)</button>
        <button onclick="testAvatarFallback()">Test Avatar Fallback</button>
        <button class="btn-ffwd" onclick="triggerFFWD()">⏭️ Test FFWD Close</button>
        <button onclick="clearResults()">Clear</button>
      </div>
    </div>

    <div id="tvOverlay" class="test-tv">
      <!-- Results will be rendered here -->
    </div>

    <div class="test-results">
      <h3>Test Results</h3>
      <div id="testLog"></div>
    </div>
  </div>

  <!-- Load dependencies -->
  <script>
    // Mock global functions for testing
    window.getP = function(id) {
      const mockPlayers = {
        1: { id: 1, name: 'Alice', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Alice' },
        2: { id: 2, name: 'Bob', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Bob' },
        3: { id: 3, name: 'Charlie', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Charlie' },
        4: { id: 4, name: 'Diana', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Diana' },
        5: { id: 5, name: 'Eve', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Eve' },
        6: { id: 6, name: 'Frank', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Frank' },
        7: { id: 7, name: 'Grace', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Grace' },
        8: { id: 8, name: 'Henry', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Henry' },
        9: { id: 9, name: 'Ivy', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Ivy' },
        10: { id: 10, name: 'Jack', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Jack' }
      };
      return mockPlayers[id] || null;
    };

    window.safeName = function(id) {
      const player = window.getP(id);
      return player ? player.name : 'Player ' + id;
    };

    window.getDicebearUrl = function(seed) {
      return 'https://api.dicebear.com/6.x/bottts/svg?seed=' + encodeURIComponent(seed || 'player');
    };

    window.Game = {
      resolveAvatar: function(playerOrId) {
        if (typeof playerOrId === 'object' && playerOrId.avatar) {
          return playerOrId.avatar;
        }
        const player = window.getP(playerOrId);
        return player ? player.avatar : window.getDicebearUrl(String(playerOrId));
      }
    };

    function log(message, type = 'info') {
      const logEl = document.getElementById('testLog');
      const statusEl = document.createElement('div');
      statusEl.className = 'test-status';
      statusEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      if (type === 'error') statusEl.style.color = '#ff6b6b';
      if (type === 'success') statusEl.style.color = '#51cf66';
      logEl.appendChild(statusEl);
      console.log(message);
    }
  </script>

  <script src="js/ui.veto-results.js"></script>

  <script>
    // Test functions
    function testTop3Render() {
      log('Testing top-3 display with 5 players (only top 3 should show)...');
      log('Testing score rounding to 1 decimal place...');
      
      const scores = {
        1: 75.233847,
        2: 88.956789,
        3: 92.499999,
        4: 81.012345,
        5: 70.387654
      };
      
      const participants = [1, 2, 3, 4, 5];
      
      try {
        const result = window.VetoResultsUI.renderVetoCompResults(scores, participants, {
          maxResults: 3,
          autoDismissMs: 5000
        });
        if (result) {
          log('✓ Top-3 render successful', 'success');
          log('Expected scores rounded to 1 decimal:');
          log('  Charlie (1st, 92.5 from 92.499999)');
          log('  Bob (2nd, 89.0 from 88.956789)');
          log('  Diana (3rd, 81.0 from 81.012345)');
          log('Panel will auto-dismiss in 5 seconds');
        } else {
          log('✗ Render returned null', 'error');
        }
      } catch (e) {
        log('✗ Error: ' + e.message, 'error');
      }
    }

    function testAutoDismiss() {
      log('Testing auto-dismiss behavior...');
      
      const scores = {
        1: 85.5,
        2: 92.3,
        3: 78.0
      };
      
      const participants = [1, 2, 3];
      
      try {
        const result = window.VetoResultsUI.renderVetoCompResults(scores, participants, {
          maxResults: 3,
          autoDismissMs: 5000
        });
        if (result) {
          log('✓ Panel displayed', 'success');
          log('⏱️ Panel will auto-dismiss in 5 seconds...');
          
          // Check if panel still exists after 5.5 seconds
          setTimeout(function() {
            const panel = document.querySelector('.veto-comp-results');
            if (!panel) {
              log('✓ Auto-dismiss successful - panel removed', 'success');
            } else {
              log('✗ Auto-dismiss failed - panel still present', 'error');
            }
          }, 5500);
        } else {
          log('✗ Render returned null', 'error');
        }
      } catch (e) {
        log('✗ Error: ' + e.message, 'error');
      }
    }

    function testLargeGroup() {
      log('Testing with 10 players (should only show top 3)...');
      
      const scores = {};
      const participants = [];
      
      for (let i = 1; i <= 10; i++) {
        scores[i] = Math.random() * 100;
        participants.push(i);
      }
      
      try {
        const result = window.VetoResultsUI.renderVetoCompResults(scores, participants, {
          maxResults: 3,
          autoDismissMs: 5000
        });
        if (result) {
          log('✓ Large group render successful', 'success');
          log('Top 3 of 10 players displayed');
          const tiles = result.querySelectorAll('.comp-player-tile');
          log('Tiles rendered: ' + tiles.length + ' (should be 3)');
          if (tiles.length === 3) {
            log('✓ Correct number of tiles displayed', 'success');
          } else {
            log('✗ Expected 3 tiles, got ' + tiles.length, 'error');
          }
        } else {
          log('✗ Render returned null', 'error');
        }
      } catch (e) {
        log('✗ Error: ' + e.message, 'error');
      }
    }

    function triggerFFWD() {
      log('Testing FFWD close behavior...');
      const panel = document.querySelector('.veto-comp-results');
      if (panel) {
        log('Panel found, dispatching fastForwardPressed event...');
        window.dispatchEvent(new Event('fastForwardPressed'));
        
        // Check if panel was removed after a short delay
        setTimeout(function() {
          const stillExists = document.querySelector('.veto-comp-results');
          if (!stillExists) {
            log('✓ FFWD close successful - panel removed', 'success');
          } else {
            log('✗ FFWD close failed - panel still present', 'error');
          }
        }, 400);
      } else {
        log('⚠ No panel to close. Run a test first.', 'error');
      }
    }

    function testAvatarFallback() {
      log('Testing avatar fallback with broken URLs...');
      
      // Override getP to return broken avatar URLs
      window.getP = function(id) {
        const mockPlayers = {
          1: { id: 1, name: 'Alice', avatar: 'https://invalid-url-that-will-fail.test/avatar1.jpg' },
          2: { id: 2, name: 'Bob', avatar: 'https://invalid-url-that-will-fail.test/avatar2.jpg' },
          3: { id: 3, name: 'Charlie', avatar: 'https://invalid-url-that-will-fail.test/avatar3.jpg' }
        };
        return mockPlayers[id] || null;
      };
      
      const scores = {
        1: 85.5,
        2: 92.3,
        3: 78.0
      };
      
      const participants = [1, 2, 3];
      
      try {
        const result = window.VetoResultsUI.renderVetoCompResults(scores, participants, {
          maxResults: 3,
          autoDismissMs: 10000 // Give 10s to see fallback
        });
        if (result) {
          log('✓ Panel displayed with broken avatar URLs', 'success');
          log('Check if fallback avatars (👤) appear after images fail to load');
          log('Panel will auto-dismiss in 10 seconds');
        } else {
          log('✗ Render returned null', 'error');
        }
      } catch (e) {
        log('✗ Error: ' + e.message, 'error');
      }
    }

    function clearResults() {
      const container = document.getElementById('tvOverlay');
      container.innerHTML = '';
      document.getElementById('testLog').innerHTML = '';
      log('Results cleared');
      
      // Restore getP to working state
      window.getP = function(id) {
        const mockPlayers = {
          1: { id: 1, name: 'Alice', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Alice' },
          2: { id: 2, name: 'Bob', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Bob' },
          3: { id: 3, name: 'Charlie', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Charlie' },
          4: { id: 4, name: 'Diana', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Diana' },
          5: { id: 5, name: 'Eve', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Eve' },
          6: { id: 6, name: 'Frank', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Frank' },
          7: { id: 7, name: 'Grace', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Grace' },
          8: { id: 8, name: 'Henry', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Henry' },
          9: { id: 9, name: 'Ivy', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Ivy' },
          10: { id: 10, name: 'Jack', avatar: 'https://api.dicebear.com/6.x/bottts/svg?seed=Jack' }
        };
        return mockPlayers[id] || null;
      };
    }

    // Run initial test on load
    window.addEventListener('load', function() {
      log('VetoResultsUI module loaded: ' + (!!window.VetoResultsUI ? 'YES' : 'NO'));
      if (window.VetoResultsUI) {
        log('renderVetoCompResults available: ' + (typeof window.VetoResultsUI.renderVetoCompResults === 'function' ? 'YES' : 'NO'));
      }
      log('Test ready. Click a button to test behavior.');
    });
  </script>
</body>
</html>
