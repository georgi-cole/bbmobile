<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <!-- Nokia 3310 Phone Shell -->
  
  <!-- Phone body -->
  <rect x="0" y="0" width="300" height="600" rx="30" fill="#1a1a1a"/>
  
  <!-- Top speaker grille -->
  <rect x="80" y="20" width="140" height="8" rx="4" fill="#0a0a0a"/>
  
  <!-- LCD Screen Area (green-tinted glass) -->
  <rect x="30" y="50" width="240" height="200" rx="8" fill="#2d3a2d" stroke="#0a0a0a" stroke-width="3"/>
  
  <!-- LCD Active Area (where the game will be positioned) -->
  <rect x="40" y="60" width="220" height="180" rx="4" fill="#b7d378"/>
  
  <!-- Nokia logo -->
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a9a9a" text-anchor="middle">NOKIA</text>
  
  <!-- Keypad background -->
  <rect x="40" y="290" width="220" height="280" rx="10" fill="#2a2a2a"/>
  
  <!-- D-pad center button (circular) -->
  <circle cx="150" cy="360" r="30" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="150" cy="360" r="20" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="1"/>
  
  <!-- Up arrow button -->
  <rect x="135" y="305" width="30" height="40" rx="5" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="150,315 145,325 155,325" fill="#5a5a5a"/>
  
  <!-- Down arrow button -->
  <rect x="135" y="395" width="30" height="40" rx="5" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="150,425 145,415 155,415" fill="#5a5a5a"/>
  
  <!-- Left arrow button -->
  <rect x="75" y="345" width="40" height="30" rx="5" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="85,360 95,355 95,365" fill="#5a5a5a"/>
  
  <!-- Right arrow button -->
  <rect x="185" y="345" width="40" height="30" rx="5" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="215,360 205,355 205,365" fill="#5a5a5a"/>
  
  <!-- Numeric keypad (3x4 grid) -->
  <!-- Row 1: 1, 2, 3 -->
  <rect x="60" y="450" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="470" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">1</text>
  
  <rect x="130" y="450" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="150" y="470" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">2</text>
  
  <rect x="200" y="450" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="470" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">3</text>
  
  <!-- Row 2: 4, 5, 6 -->
  <rect x="60" y="490" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">4</text>
  
  <rect x="130" y="490" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="150" y="510" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">5</text>
  
  <rect x="200" y="490" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="510" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">6</text>
  
  <!-- Row 3: 7, 8, 9 -->
  <rect x="60" y="530" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">7</text>
  
  <rect x="130" y="530" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="150" y="550" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">8</text>
  
  <rect x="200" y="530" width="40" height="30" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="550" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">9</text>
</svg>
