<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Highlights - Current Implementation Test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a1420;
      font-family: system-ui, -apple-system, sans-serif;
      color: #c8d5e6;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 30px;
    }
    h1 {
      color: #78b4f0;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    h2 {
      color: #a0c4e0;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    .description {
      color: #94a7bd;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="section">
      <h1>Social Highlights - Current Implementation</h1>
      <div class="description">
        This test shows the current Social Highlights card UI with icons, header, and card styling
        that will be simplified to text-only rendering.
      </div>
    </div>

    <div class="section">
      <h2>Current Card-Based Rendering:</h2>
      <div id="logSocial" class="log log-pane active" data-pane="social"></div>
    </div>

    <div class="section">
      <button onclick="renderCurrentHighlights()" style="padding: 10px 20px; background: #2d4b6a; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
        Render Sample Highlights (Current Style)
      </button>
    </div>
  </div>

  <script>
    // Simulate the current social-highlights.js rendering
    function renderCurrentHighlights() {
      const logPane = document.getElementById('logSocial');
      logPane.innerHTML = ''; // Clear existing

      // Create sample highlights data
      const highlights = [
        { 
          icon: '👥', 
          message: 'Danny had a positive group interaction with 4 others',
          className: 'highlight-success'
        },
        { 
          icon: '⚔️', 
          message: 'Rae confronted Nova and it backfired (-10)',
          className: 'highlight-negative'
        },
        { 
          icon: '💖', 
          message: 'You confided in Mimi (+10)',
          className: 'highlight-success'
        },
        { 
          icon: '📈', 
          message: 'Alex gained major influence with Jordan',
          className: 'highlight-success'
        },
        { 
          icon: '⚠️', 
          message: 'Sam was caught spreading rumors about Taylor!',
          className: 'highlight-warning'
        }
      ];

      // Create highlights card (current implementation)
      const card = document.createElement('div');
      card.className = 'revealCard diaryRoomCard social-highlights-card';
      
      const header = document.createElement('div');
      header.className = 'card-header';
      header.innerHTML = '<h3>🌟 Social Highlights</h3>';
      
      const body = document.createElement('div');
      body.className = 'card-body';
      
      // Add each highlight
      highlights.forEach(highlight => {
        const entry = document.createElement('div');
        entry.className = `highlight-entry ${highlight.className}`;
        entry.innerHTML = `
          <span class="highlight-icon">${highlight.icon}</span>
          <span class="highlight-message">${highlight.message}</span>
        `;
        body.appendChild(entry);
      });

      card.appendChild(header);
      card.appendChild(body);
      
      logPane.appendChild(card);
    }

    // Render on load
    window.addEventListener('load', renderCurrentHighlights);
  </script>
</body>
</html>
