<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond POV Ceremony - Both Nominees Selection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e1a;
      color: #e6e8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .tv-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .ceremony-card {
      background: linear-gradient(135deg, #1a2f44 0%, #243a50 100%);
      border: 2px solid #64c8ff;
      border-radius: 16px;
      padding: 35px 45px;
      max-width: 650px;
      width: 90%;
      box-shadow: 
        0 20px 60px -20px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(100, 200, 255, 0.2);
    }
    
    h2 {
      color: #64c8ff;
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    
    .info {
      font-size: 1rem;
      color: #b2c2d5;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }
    
    .info strong {
      color: #64c8ff;
    }
    
    .step-indicator {
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #ffd700;
      font-weight: 600;
    }
    
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    
    .player-option {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #3d5a75;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .player-option:hover {
      border-color: #64c8ff;
      background: rgba(100, 200, 255, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(100, 200, 255, 0.3);
    }
    
    .player-option.selected {
      border-color: #64c8ff;
      background: rgba(100, 200, 255, 0.2);
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
    }
    
    .player-option.selected::after {
      content: "✓";
      position: absolute;
      top: -8px;
      right: -8px;
      background: #64c8ff;
      color: #0a0e1a;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .player-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2877a0, #1a4a63);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 2px solid #3d5a75;
    }
    
    .player-name {
      font-size: 1rem;
      color: #e6e8ee;
      font-weight: 600;
    }
    
    .hint {
      margin-top: 25px;
      text-align: center;
      font-size: 0.9rem;
      color: #9aa3b2;
      font-style: italic;
    }
    
    .selection-count {
      background: rgba(100, 200, 255, 0.15);
      border: 1px solid #64c8ff;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      text-align: center;
      color: #64c8ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="tv-overlay">
    <div class="ceremony-card">
      <h2>💎 Replace Both Nominees</h2>
      <div class="info">
        <strong>POV Holder Alex</strong> will now choose TWO new nominees.<br>
        Cannot nominate: HOH or Self
      </div>
      
      <div class="selection-count">
        Selected: 1 of 2 nominees
      </div>
      
      <div class="player-grid">
        <div class="player-option selected">
          <div class="player-avatar">👤</div>
          <div class="player-name">Sarah</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">James</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">Emily</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">David</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">Lisa</div>
        </div>
        
        <div class="player-option">
          <div class="player-avatar">👤</div>
          <div class="player-name">Tom</div>
        </div>
      </div>
      
      <div class="hint">
        Select 2 houseguests to nominate (Sarah already selected)
      </div>
    </div>
  </div>
</body>
</html>
