<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Render Test</title>
</head>
<body>
  <button onclick="test()">Test Direct Render</button>
  
  <script src="./js/jury-viz.js"></script>
  <script>
    function test() {
      // Mount with dummy data
      const overlay = document.createElement('div');
      overlay.className = 'finale-fullscreen-overlay';
      overlay.style.cssText = 'display: flex !important; opacity: 1 !important;';
      document.body.appendChild(overlay);
      
      window.FinalFaceoff.mount({
        left: { name: 'Emma', avatar: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23ff0000" width="100" height="100"/></svg>' },
        right: { name: 'Nico', avatar: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%2300ff00" width="100" height="100"/></svg>' },
        majority: 5,
        container: overlay
      });
      
      setTimeout(() => {
        window.FinalFaceoff.showWinnerCelebration(
          { name: 'Emma', avatar: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%23ff0000" width="200" height="200"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="white" font-size="40">EMMA</text></svg>' },
          { name: 'Nico', avatar: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%2300ff00" width="100" height="100"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="white" font-size="30">NICO</text></svg>' },
          '5-2'
        );
      }, 500);
    }
  </script>
</body>
</html>
