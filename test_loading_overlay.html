<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Overlay Test</title>
  <link rel="stylesheet" href="css/loading-overlay.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 2rem;
      background: #1a1a2e;
      color: #ffffff;
    }
    
    h1 {
      margin-bottom: 2rem;
    }
    
    .test-controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 600px;
      margin-bottom: 2rem;
    }
    
    button {
      padding: 1rem;
      font-size: 1rem;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms;
    }
    
    button:hover {
      background: #1976D2;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .log {
      background: #0f0f1e;
      padding: 1rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .log-entry {
      margin-bottom: 0.5rem;
      padding: 0.25rem;
      border-left: 3px solid #2196F3;
      padding-left: 0.5rem;
    }
    
    .log-entry.error {
      border-left-color: #ff6b6b;
      color: #ff6b6b;
    }
    
    .status {
      padding: 1rem;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1>🔄 Loading Overlay Test Suite</h1>
  
  <div class="status">
    <strong>Status:</strong> <span id="statusText">Ready</span>
  </div>
  
  <div class="test-controls">
    <button onclick="testBasicShow()">Test 1: Show Overlay</button>
    <button onclick="testProgressUpdates()">Test 2: Progress Updates (0% → 100%)</button>
    <button onclick="testSimulatedLoad()">Test 3: Simulated Loading (5 seconds)</button>
    <button onclick="testErrorWithRetry()">Test 4: Error State with Retry</button>
    <button onclick="testErrorWithoutRetry()">Test 5: Error State without Retry</button>
    <button onclick="testHideOverlay()">Test 6: Hide Overlay</button>
    <button onclick="testFullCycle()">Test 7: Full Cycle (Load → Success → Hide)</button>
    <button onclick="testFullCycleWithError()">Test 8: Full Cycle (Load → Error → Retry)</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>
  
  <h2>Console Log:</h2>
  <div class="log" id="consoleLog"></div>
  
  <script src="src/ui/LoadingOverlay.js"></script>
  <script>
    // Capture console logs
    const originalLog = console.log;
    const originalInfo = console.info;
    const originalWarn = console.warn;
    const originalError = console.error;
    
    const logContainer = document.getElementById('consoleLog');
    const statusText = document.getElementById('statusText');
    
    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    
    function setStatus(text) {
      statusText.textContent = text;
      addLog(`Status: ${text}`);
    }
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog(args.join(' '), 'info');
    };
    
    console.info = function(...args) {
      originalInfo.apply(console, args);
      addLog(args.join(' '), 'info');
    };
    
    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog(args.join(' '), 'warn');
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      addLog(args.join(' '), 'error');
    };
    
    // Test functions
    function testBasicShow() {
      setStatus('Showing overlay...');
      window.LoadingOverlay.showOverlay();
    }
    
    function testProgressUpdates() {
      setStatus('Testing progress updates...');
      window.LoadingOverlay.showOverlay();
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        window.LoadingOverlay.updateProgress({ loaded: progress, total: 100 });
        
        if (progress >= 100) {
          clearInterval(interval);
          setStatus('Progress complete (100%)');
        }
      }, 300);
    }
    
    function testSimulatedLoad() {
      setStatus('Simulating 5-second load...');
      window.LoadingOverlay.showOverlay();
      
      const total = 16; // Simulate 16 avatars
      let loaded = 0;
      
      const interval = setInterval(() => {
        loaded++;
        window.LoadingOverlay.updateProgress({ loaded, total });
        
        if (loaded >= total) {
          clearInterval(interval);
          setStatus('Load complete!');
          setTimeout(() => {
            window.LoadingOverlay.hideOverlay();
            setStatus('Overlay hidden');
          }, 500);
        }
      }, 300);
    }
    
    function testErrorWithRetry() {
      setStatus('Showing error with retry...');
      window.LoadingOverlay.showOverlay();
      window.LoadingOverlay.updateProgress({ loaded: 8, total: 16 });
      
      setTimeout(() => {
        window.LoadingOverlay.showError(
          'Failed to load all houseguest profiles.\n\nLoaded: 8/16\nFailed: 8',
          {
            showRetry: true,
            onRetry: () => {
              setStatus('Retry clicked! Restarting...');
              testSimulatedLoad();
            }
          }
        );
      }, 2000);
    }
    
    function testErrorWithoutRetry() {
      setStatus('Showing error without retry...');
      window.LoadingOverlay.showOverlay();
      window.LoadingOverlay.updateProgress({ loaded: 5, total: 16 });
      
      setTimeout(() => {
        window.LoadingOverlay.showError(
          'Fatal error: Network unavailable.\n\nPlease check your connection.',
          {
            showRetry: false
          }
        );
      }, 2000);
    }
    
    function testHideOverlay() {
      setStatus('Hiding overlay...');
      window.LoadingOverlay.hideOverlay().then(() => {
        setStatus('Overlay hidden');
      });
    }
    
    async function testFullCycle() {
      setStatus('Starting full cycle test...');
      
      // Show overlay
      window.LoadingOverlay.showOverlay();
      await sleep(500);
      
      // Simulate progress
      const total = 16;
      for (let i = 0; i <= total; i++) {
        window.LoadingOverlay.updateProgress({ loaded: i, total });
        await sleep(200);
      }
      
      // Hide overlay
      await sleep(500);
      await window.LoadingOverlay.hideOverlay();
      setStatus('Full cycle complete!');
    }
    
    async function testFullCycleWithError() {
      setStatus('Starting full cycle with error test...');
      
      // Show overlay
      window.LoadingOverlay.showOverlay();
      await sleep(500);
      
      // Simulate partial progress
      const total = 16;
      for (let i = 0; i <= 8; i++) {
        window.LoadingOverlay.updateProgress({ loaded: i, total });
        await sleep(200);
      }
      
      // Show error with retry
      await sleep(500);
      window.LoadingOverlay.showError(
        'Simulated error after partial load.\n\nLoaded: 8/16\nFailed: 8',
        {
          showRetry: true,
          onRetry: async () => {
            setStatus('Retrying after error...');
            await testFullCycle();
          }
        }
      );
      
      setStatus('Error shown, waiting for user action...');
    }
    
    function clearLog() {
      logContainer.innerHTML = '';
      setStatus('Log cleared');
    }
    
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    // Initial log
    addLog('Loading Overlay Test Suite initialized');
    addLog('LoadingOverlay module loaded: ' + (!!window.LoadingOverlay));
  </script>
</body>
</html>
