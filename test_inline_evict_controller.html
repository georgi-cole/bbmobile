<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Eviction Controller Test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .test-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      border: 2px solid var(--line);
      z-index: 1000;
      max-width: 300px;
    }
    
    .test-controls h3 {
      margin-top: 0;
      font-size: 1rem;
      color: var(--accent);
    }
    
    .test-controls button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      background: var(--primary-2);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    .test-controls button:hover {
      background: var(--primary-3);
    }
    
    .test-controls .status {
      margin-top: 10px;
      padding: 10px;
      background: var(--card-2);
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    
    .test-controls .status.success {
      color: var(--good);
    }
    
    .test-controls .status.error {
      color: var(--bad);
    }
    
    #tv {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 600px;
      margin: 0 auto;
      background: linear-gradient(135deg, rgba(19, 33, 50, 0.8), rgba(13, 21, 31, 0.8));
      border: 3px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    
    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 20px;
    }
    
    .scenario-info {
      text-align: center;
      margin: 20px auto;
      padding: 15px;
      background: var(--card);
      border-radius: var(--radius);
      max-width: 600px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <h1>🎬 Inline Eviction Controller Test</h1>
  
  <div class="scenario-info">
    <strong>Current Scenario:</strong> <span id="scenario-name">None</span><br>
    <small id="scenario-desc"></small>
  </div>
  
  <div id="tv"></div>
  
  <div class="test-controls">
    <h3>Test Scenarios</h3>
    <button onclick="testNormalEviction()">Normal Eviction (2 Nominees)</button>
    <button onclick="testTieBreak()">Tie-Break Eviction</button>
    <button onclick="testFinal4()">Final 4 Sole Vote</button>
    <button onclick="testKeyboard()">Test Keyboard (1/2/Escape)</button>
    <button onclick="testReducedMotion()">Toggle Reduced Motion</button>
    <hr style="margin: 15px 0; border-color: var(--line);">
    <button onclick="showResult()">Show Result (Manual)</button>
    <button onclick="cleanup()">Cleanup</button>
    <div class="status" id="status">Ready</div>
  </div>
  
  <script src="js/inline-evict-controller.js"></script>
  
  <script>
    // Mock global helpers
    window.getP = (id) => {
      const players = {
        'p1': { id: 'p1', name: 'Alice', avatar: null },
        'p2': { id: 'p2', name: 'Bob', avatar: null },
        'p3': { id: 'p3', name: 'Carol', avatar: null },
        'p4': { id: 'p4', name: 'Dave', avatar: null }
      };
      return players[id];
    };
    
    window.safeName = (id) => {
      const player = window.getP(id);
      return player ? player.name : 'Unknown';
    };
    
    window.resolveAvatar = (player) => {
      return null; // Use dicebear fallback
    };
    
    // Global controller reference
    let controller = null;
    let currentScenario = 'none';
    
    function updateStatus(message, type = '') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status';
      if (type) status.classList.add(type);
      console.log(`[Status] ${message}`);
    }
    
    function updateScenario(name, desc) {
      document.getElementById('scenario-name').textContent = name;
      document.getElementById('scenario-desc').textContent = desc;
      currentScenario = name;
    }
    
    function testNormalEviction() {
      cleanup();
      updateScenario('Normal Eviction', 'Standard 2-nominee vote with Alice and Bob');
      
      try {
        controller = new window.InlineEvictController();
        
        const initialized = controller.init({
          leftId: 'p1',
          rightId: 'p2',
          leftName: 'Alice',
          rightName: 'Bob',
          flags: { tieBreak: false, final4: false },
          onVote: (votedId) => {
            updateStatus(`Vote cast for ${window.safeName(votedId)}!`, 'success');
            console.log('Vote callback:', votedId);
          }
        });
        
        if (initialized) {
          controller.enableVoting();
          updateStatus('Controller initialized. Click a nominee to vote!', 'success');
        } else {
          updateStatus('Failed to initialize controller', 'error');
        }
      } catch (error) {
        updateStatus(`Error: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    function testTieBreak() {
      cleanup();
      updateScenario('Tie-Break', 'HOH breaks a tied vote (Carol vs Dave)');
      
      try {
        controller = new window.InlineEvictController();
        
        const initialized = controller.init({
          leftId: 'p3',
          rightId: 'p4',
          leftName: 'Carol',
          rightName: 'Dave',
          flags: { tieBreak: true, final4: false },
          onVote: (votedId) => {
            updateStatus(`Tie-break vote cast for ${window.safeName(votedId)}!`, 'success');
            console.log('Tie-break vote:', votedId);
          }
        });
        
        if (initialized) {
          controller.enableVoting();
          updateStatus('Tie-break mode active. HOH must break the tie!', 'success');
        }
      } catch (error) {
        updateStatus(`Error: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    function testFinal4() {
      cleanup();
      updateScenario('Final 4', 'POV winner casts sole vote (Alice vs Bob)');
      
      try {
        controller = new window.InlineEvictController();
        
        const initialized = controller.init({
          leftId: 'p1',
          rightId: 'p2',
          leftName: 'Alice',
          rightName: 'Bob',
          flags: { tieBreak: false, final4: true },
          onVote: (votedId) => {
            updateStatus(`Sole vote cast for ${window.safeName(votedId)}!`, 'success');
            console.log('Final 4 sole vote:', votedId);
          }
        });
        
        if (initialized) {
          controller.enableVoting();
          updateStatus('Final 4 mode active. Cast sole vote!', 'success');
        }
      } catch (error) {
        updateStatus(`Error: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    function testKeyboard() {
      if (!controller) {
        testNormalEviction();
      }
      updateStatus('Keyboard test: Press 1 (left) or 2 (right). Press Escape to clear.', 'success');
      alert('Press 1 to select left nominee, 2 to select right nominee.\nPress the same key again to confirm vote.\nPress Escape to clear selection.');
    }
    
    function testReducedMotion() {
      const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      updateStatus(`Reduced motion: ${mediaQuery.matches ? 'ON' : 'OFF'}`, 'success');
      alert('Reduced motion is a system preference.\nCheck your OS accessibility settings to toggle it.\n\nCurrent state: ' + (mediaQuery.matches ? 'ON' : 'OFF'));
    }
    
    function showResult() {
      if (!controller) {
        updateStatus('No active controller. Run a test scenario first.', 'error');
        return;
      }
      
      try {
        // Simulate result with Alice evicted, Bob survives
        controller.renderInlineResult('p1', 'p2', {
          voteCounts: { 'p1': 3, 'p2': 2 }
        });
        updateStatus('Result displayed!', 'success');
      } catch (error) {
        updateStatus(`Error showing result: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    function cleanup() {
      if (controller) {
        try {
          controller.cleanup();
          updateStatus('Controller cleaned up', 'success');
        } catch (error) {
          updateStatus(`Cleanup error: ${error.message}`, 'error');
        }
        controller = null;
      }
      
      // Also clear TV manually to ensure clean state
      const tv = document.getElementById('tv');
      if (tv) {
        tv.innerHTML = '';
      }
    }
    
    // Auto-start with normal eviction
    window.addEventListener('load', () => {
      updateStatus('Page loaded. Click a test scenario to begin!');
    });
  </script>
</body>
</html>
