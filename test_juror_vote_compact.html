<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juror Return Vote UI - Compact & Consistent</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a1018;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .demo-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 30, 40, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      z-index: 10000;
      color: #e8f4ff;
    }
    
    .demo-controls h3 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      color: #00e0cc;
    }
    
    .demo-controls button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00e0cc, #00b8a3);
      color: #001a18;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .demo-controls button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,224,204,0.3);
    }
    
    .demo-controls label {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.85rem;
      color: #8fb4d4;
    }
    
    .demo-controls select {
      width: 100%;
      padding: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: #e8f4ff;
      font-size: 0.9rem;
    }
    
    /* TV Container for desktop view */
    .tv {
      background: #0d1b2a;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      overflow: hidden;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .tvHead {
      background: linear-gradient(135deg, rgba(0, 224, 204, 0.08), rgba(0, 184, 163, 0.08));
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tvTitle {
      font-size: 1.1rem;
      font-weight: 700;
      color: #00e0cc;
      text-shadow: 0 2px 8px rgba(0,224,204,0.3);
    }
    
    .tvViewport {
      min-height: 400px;
      padding: 40px 20px;
      position: relative;
    }
    
    @media (max-width: 767px) {
      .tv {
        border-radius: 0;
        max-width: 100%;
      }
      
      .tvHead {
        display: none;
      }
      
      .tvViewport {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="demo-controls">
    <h3>Demo Controls</h3>
    <button id="triggerBtn">Show Vote UI</button>
    <label for="jurorCount">Number of Jurors:</label>
    <select id="jurorCount">
      <option value="3">3 Jurors</option>
      <option value="4">4 Jurors</option>
      <option value="5" selected>5 Jurors</option>
      <option value="6">6 Jurors</option>
      <option value="7">7 Jurors</option>
    </select>
    <label for="voteTime">Vote Duration (seconds):</label>
    <select id="voteTime">
      <option value="5">5 seconds</option>
      <option value="10">10 seconds</option>
      <option value="12" selected>12 seconds</option>
      <option value="15">15 seconds</option>
    </select>
  </div>

  <div class="tv tv-screen" id="tv">
    <div class="tvHead">
      <div class="tvTitle">House Network Live</div>
    </div>
    <div class="tvViewport">
      <div id="panel"></div>
    </div>
  </div>
  
  <script>
    // Mock game environment
    window.game = {
      juryHouse: [1, 2, 3, 4, 5],
      cfg: { 
        tJuryReturnVote: 12,
        numPlayers: 12
      },
      __americaReturnDone: false,
      __jurorReturnDone: false
    };
    
    window.safeName = (id) => {
      const names = ['Alex', 'Blake', 'Casey', 'Drew', 'Ellis', 'Finley', 'Gray'];
      return names[id - 1] || `Juror ${id}`;
    };
    
    window.getDicebearUrl = (seed) => {
      return `https://api.dicebear.com/6.x/bottts/svg?seed=${encodeURIComponent(seed || 'player')}`;
    };
    
    window.getP = (id) => {
      return {
        id: id,
        name: window.safeName(id),
        avatar: window.getDicebearUrl(`player${id}`)
      };
    };
    
    window.getAvatarFallback = (name) => {
      return window.getDicebearUrl(name || 'fallback');
    };
    
    window.alivePlayers = () => {
      return [100, 101, 102, 103, 104, 105, 106];
    };
    
    window.decideJurorReturnThisWeek = () => {
      return !window.game.__americaReturnDone;
    };
    
    window.showBigCard = async (title, lines, duration) => {
      console.log('Big Card:', title, lines);
      return new Promise(resolve => setTimeout(resolve, duration || 1000));
    };
    
    window.setPhase = (phase, duration, callback) => {
      console.log('Set phase:', phase, duration);
      if (callback) setTimeout(callback, duration * 1000);
    };
    
    window.startHOH = () => {
      console.log('Starting HOH');
    };
    
    window.updateHud = () => {
      console.log('Update HUD');
    };
  </script>
  
  <script src="js/jury_return_vote.js"></script>
  
  <script>
    const triggerBtn = document.getElementById('triggerBtn');
    const jurorCountSelect = document.getElementById('jurorCount');
    const voteTimeSelect = document.getElementById('voteTime');
    
    triggerBtn.addEventListener('click', () => {
      // Reset flags
      window.game.__americaReturnDone = false;
      window.game.__jurorReturnDone = false;
      
      // Update juror count
      const count = parseInt(jurorCountSelect.value);
      window.game.juryHouse = [];
      for (let i = 1; i <= count; i++) {
        window.game.juryHouse.push(i);
      }
      
      // Update vote time
      window.game.cfg.tJuryReturnVote = parseInt(voteTimeSelect.value);
      
      // Clear panel
      const panel = document.getElementById('panel');
      panel.innerHTML = '';
      
      // Trigger the vote UI
      console.log('Triggering juror return vote with', count, 'jurors for', window.game.cfg.tJuryReturnVote, 'seconds');
      
      // Simulate the phase change that triggers the vote
      if (typeof runJurorReturnTwist === 'function') {
        runJurorReturnTwist();
      } else {
        console.error('runJurorReturnTwist not found');
      }
    });
    
    // Auto-trigger on load
    setTimeout(() => {
      triggerBtn.click();
    }, 500);
  </script>
</body>
</html>
