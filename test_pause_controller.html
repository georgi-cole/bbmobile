<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause Controller Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #0a0e1a;
      color: #e6e8ee;
    }
    .test-section {
      background: #141a23;
      border: 1px solid #2b3546;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }
    .test-section h2 {
      margin-top: 0;
      color: #9fb5ff;
    }
    button {
      background: #172034;
      border: 1px solid #2c3446;
      color: #e6e8ee;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1d2840;
    }
    button.primary {
      background: linear-gradient(135deg, #2877a0, #1a4a63);
      border-color: #2d8ab4;
    }
    button.danger {
      background: #8b3838;
      border-color: #a04545;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 14px;
    }
    .status.paused {
      background: rgba(242, 200, 98, 0.1);
      border: 1px solid #f2c862;
      color: #f2c862;
    }
    .status.running {
      background: rgba(121, 209, 154, 0.1);
      border: 1px solid #79d19a;
      color: #79d19a;
    }
    .timer-display {
      font-size: 48px;
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
      color: #9fb5ff;
    }
    .log {
      background: #0a0e1a;
      border: 1px solid #1d2742;
      border-radius: 6px;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #1d2742;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-entry.pause {
      color: #f2c862;
    }
    .log-entry.resume {
      color: #79d19a;
    }
    .log-entry.guard {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <h1>⏸️ Pause Controller Test Suite</h1>

  <div class="test-section">
    <h2>Status</h2>
    <div id="status" class="status running">
      <strong>State:</strong> <span id="state-text">Running</span><br>
      <strong>Reason:</strong> <span id="reason-text">—</span><br>
      <strong>RefCount:</strong> <span id="refcount-text">0</span>
    </div>
  </div>

  <div class="test-section">
    <h2>Timer Test</h2>
    <div class="timer-display" id="timer-display">5:00</div>
    <div>
      <button id="start-timer" class="primary">Start Timer (5min)</button>
      <button id="stop-timer" class="danger">Stop Timer</button>
    </div>
    <p><small>This simulates a phase timer that should pause when settings open</small></p>
  </div>

  <div class="test-section">
    <h2>Pause Controls</h2>
    <div>
      <button id="pause-btn" class="primary">⏸ Pause (Settings)</button>
      <button id="resume-btn" class="primary">▶ Resume</button>
      <button id="debug-pause">⏸ Debug Pause</button>
      <button id="debug-resume">▶ Debug Resume</button>
    </div>
    <div style="margin-top: 10px">
      <button id="test-double-pause">Test Double Pause (Should be Safe)</button>
      <button id="test-nested-resume">Test Nested Resume</button>
    </div>
  </div>

  <div class="test-section">
    <h2>Guard Tests</h2>
    <div>
      <button id="test-set-phase">Test setPhase (should block when paused)</button>
      <button id="test-start-hoh">Test startHOH (should block when paused)</button>
      <button id="test-ffwd">Test FFWD (should block when paused)</button>
    </div>
  </div>

  <div class="test-section">
    <h2>Event Log</h2>
    <button id="clear-log" class="danger">Clear Log</button>
    <div class="log" id="event-log"></div>
  </div>

  <script>
    // Mock game object
    window.game = window.game || {
      phase: 'hoh',
      week: 2,
      endAt: null,
      timerPaused: false,
      bus: {
        emit: function(event, data) {
          log(`Bus event: ${event}`, 'info', data);
        }
      }
    };

    // Mock functions that should be guarded
    window.setPhase = function(phase, seconds, callback) {
      if (window.PauseController && window.PauseController.isPaused && window.PauseController.isPaused()) {
        log('setPhase BLOCKED (paused)', 'guard');
        return;
      }
      log(`setPhase called: ${phase}, ${seconds}s`, 'info');
    };

    window.startHOH = function() {
      if (window.PauseController && window.PauseController.isPaused && window.PauseController.isPaused()) {
        log('startHOH BLOCKED (paused)', 'guard');
        return;
      }
      log('startHOH called', 'info');
    };

    window.activateFastForward = function() {
      if (window.PauseController && window.PauseController.isPaused && window.PauseController.isPaused()) {
        log('activateFastForward BLOCKED (paused)', 'guard');
        return false;
      }
      log('activateFastForward called', 'info');
      return true;
    };

    // Logger
    function log(message, type = 'info', data = null) {
      const logEl = document.getElementById('event-log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      if (data) {
        entry.textContent += ' ' + JSON.stringify(data);
      }
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message, data);
    }

    // Timer simulation
    let timerInterval = null;
    let timerSeconds = 0;
    let timerPausedAt = null;

    function updateTimerDisplay() {
      const minutes = Math.floor(timerSeconds / 60);
      const seconds = timerSeconds % 60;
      document.getElementById('timer-display').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
      }
      timerSeconds = 300; // 5 minutes
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        if (!window.game.timerPaused) {
          timerSeconds--;
          updateTimerDisplay();
          
          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            log('Timer expired!', 'info');
          }
        }
      }, 1000);
      
      log('Timer started (5 minutes)', 'info');
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerSeconds = 0;
      updateTimerDisplay();
      log('Timer stopped', 'info');
    }

    // Status update
    function updateStatus() {
      if (!window.PauseController) {
        document.getElementById('state-text').textContent = 'PauseController not loaded';
        return;
      }

      const state = window.PauseController.getState();
      const statusEl = document.getElementById('status');
      
      if (state.isPaused) {
        statusEl.className = 'status paused';
        document.getElementById('state-text').textContent = '⏸ PAUSED';
      } else {
        statusEl.className = 'status running';
        document.getElementById('state-text').textContent = '▶ Running';
      }
      
      document.getElementById('reason-text').textContent = state.reason || '—';
      document.getElementById('refcount-text').textContent = state.refCount || 0;
    }

    // Event handlers
    document.getElementById('start-timer').addEventListener('click', startTimer);
    document.getElementById('stop-timer').addEventListener('click', stopTimer);

    document.getElementById('pause-btn').addEventListener('click', () => {
      if (window.PauseController) {
        window.PauseController.pause('settings');
        log('Paused (settings)', 'pause');
        updateStatus();
      }
    });

    document.getElementById('resume-btn').addEventListener('click', () => {
      if (window.PauseController) {
        window.PauseController.resume();
        log('Resumed', 'resume');
        updateStatus();
      }
    });

    document.getElementById('debug-pause').addEventListener('click', () => {
      if (window.__debugPauseGame) {
        window.__debugPauseGame();
        log('Debug pause called', 'pause');
        updateStatus();
      }
    });

    document.getElementById('debug-resume').addEventListener('click', () => {
      if (window.__debugResumeGame) {
        window.__debugResumeGame();
        log('Debug resume called', 'resume');
        updateStatus();
      }
    });

    document.getElementById('test-double-pause').addEventListener('click', () => {
      if (window.PauseController) {
        window.PauseController.pause('test1');
        log('First pause', 'pause');
        window.PauseController.pause('test2');
        log('Second pause (should increment refCount)', 'pause');
        updateStatus();
      }
    });

    document.getElementById('test-nested-resume').addEventListener('click', () => {
      if (window.PauseController) {
        window.PauseController.resume();
        log('First resume (should decrement refCount)', 'resume');
        window.PauseController.resume();
        log('Second resume (should clear pause if refCount=0)', 'resume');
        updateStatus();
      }
    });

    document.getElementById('test-set-phase').addEventListener('click', () => {
      window.setPhase('nominations', 25, null);
    });

    document.getElementById('test-start-hoh').addEventListener('click', () => {
      window.startHOH();
    });

    document.getElementById('test-ffwd').addEventListener('click', () => {
      window.activateFastForward();
    });

    document.getElementById('clear-log').addEventListener('click', () => {
      document.getElementById('event-log').innerHTML = '';
    });

    // Initial status
    window.addEventListener('load', () => {
      updateStatus();
      setInterval(updateStatus, 1000);
      log('Test page loaded', 'info');
    });
  </script>

  <!-- Load PauseController -->
  <script defer src="js/flow/PauseController.js"></script>
</body>
</html>
