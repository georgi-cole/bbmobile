<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Veto Flow Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #f0f0f0;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #4CAF50;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    h2 {
      color: #2196F3;
      margin-top: 30px;
    }
    .test-section {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 15px 0;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      background: #45a049;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    button.secondary {
      background: #2196F3;
    }
    button.secondary:hover {
      background: #1976D2;
    }
    button.danger {
      background: #f44336;
    }
    button.danger:hover {
      background: #d32f2f;
    }
    .status {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 5px;
      border-left: 4px solid #4CAF50;
      margin: 10px 0;
      font-family: monospace;
      font-size: 13px;
    }
    .status.info {
      border-left-color: #2196F3;
    }
    .status.warn {
      border-left-color: #ff9800;
    }
    .status.error {
      border-left-color: #f44336;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    .config-item {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .config-item label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .log-container {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 5px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      margin: 15px 0;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #333;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-entry.veto {
      color: #FFD700;
    }
    .log-entry.social {
      color: #4CAF50;
    }
    .log-entry.ceremony {
      color: #2196F3;
    }
    .log-entry.error {
      color: #f44336;
    }
    .timer {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>🚀 Fast Veto Flow Test Suite</h1>
  
  <div class="test-section">
    <h2>Configuration</h2>
    <div class="config-grid">
      <div class="config-item">
        <label>
          <input type="checkbox" id="fastVetoFlow" checked>
          Fast Veto Flow
        </label>
      </div>
      <div class="config-item">
        <label>
          <input type="checkbox" id="showExtendedVetoReveal">
          Extended Reveal
        </label>
      </div>
      <div class="config-item">
        <label>
          <input type="checkbox" id="skipVetoIntroCard">
          Skip Intro Card
        </label>
      </div>
      <div class="config-item">
        <label>
          <input type="checkbox" id="debugAlwaysWin" checked>
          Human Always Wins
        </label>
      </div>
    </div>
    <button onclick="applyConfig()">Apply Config</button>
    <button class="secondary" onclick="resetConfig()">Reset to Default</button>
  </div>

  <div class="test-section">
    <h2>Test Scenarios</h2>
    <div class="controls">
      <button onclick="testHumanPOVWinner()">Test 1: Human POV Winner</button>
      <button onclick="testAIPOVWinner()">Test 2: AI POV Winner</button>
      <button onclick="testEarlyCompletion()">Test 3: Early Completion</button>
      <button onclick="testSocialInsertion()">Test 4: Social Phase Insertion</button>
      <button onclick="testFastCeremony()">Test 5: Fast Ceremony</button>
      <button onclick="testGoldenPOV()">Test 6: Golden POV</button>
      <button onclick="testDiamondPOV()">Test 7: Diamond POV</button>
      <button onclick="testFinal4Bypass()">Test 8: Final 4 Bypass</button>
    </div>
    <div class="controls">
      <button class="danger" onclick="clearLogs()">Clear Logs</button>
      <button class="secondary" onclick="exportLogs()">Export Logs</button>
    </div>
  </div>

  <div class="test-section">
    <h2>Test Results</h2>
    <div id="status" class="status info">Ready to run tests. Configure settings and select a test scenario.</div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="test-section">
    <h2>Event Log</h2>
    <div id="logContainer" class="log-container">
      <div class="log-entry">Waiting for test execution...</div>
    </div>
  </div>

  <script>
    // Test utilities
    let testStartTime = 0;
    let timerInterval = null;
    const logs = [];

    function log(message, type = 'info') {
      const timestamp = Date.now() - testStartTime;
      const entry = { timestamp, message, type };
      logs.push(entry);
      
      const container = document.getElementById('logContainer');
      const logDiv = document.createElement('div');
      logDiv.className = `log-entry ${type}`;
      logDiv.textContent = `[${(timestamp/1000).toFixed(2)}s] ${message}`;
      container.appendChild(logDiv);
      container.scrollTop = container.scrollHeight;
    }

    function clearLogs() {
      logs.length = 0;
      document.getElementById('logContainer').innerHTML = '<div class="log-entry">Logs cleared.</div>';
    }

    function exportLogs() {
      const text = logs.map(l => `[${(l.timestamp/1000).toFixed(2)}s] [${l.type}] ${l.message}`).join('\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `veto-test-logs-${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function updateStatus(message, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    function startTimer() {
      testStartTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - testStartTime;
        const seconds = Math.floor(elapsed / 1000);
        const ms = elapsed % 1000;
        document.getElementById('timer').textContent = 
          `${seconds.toString().padStart(2, '0')}:${Math.floor(ms/10).toString().padStart(2, '0')}`;
      }, 50);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // Configuration management
    function applyConfig() {
      const config = {
        fastVetoFlow: document.getElementById('fastVetoFlow').checked,
        showExtendedVetoReveal: document.getElementById('showExtendedVetoReveal').checked,
        skipVetoIntroCard: document.getElementById('skipVetoIntroCard').checked,
        debugAlwaysWin: document.getElementById('debugAlwaysWin').checked
      };
      
      log('Applying configuration: ' + JSON.stringify(config), 'info');
      updateStatus('Configuration applied: ' + JSON.stringify(config), 'info');
      
      // In real implementation, this would update window.game.cfg
      console.log('Config applied:', config);
    }

    function resetConfig() {
      document.getElementById('fastVetoFlow').checked = true;
      document.getElementById('showExtendedVetoReveal').checked = false;
      document.getElementById('skipVetoIntroCard').checked = false;
      document.getElementById('debugAlwaysWin').checked = true;
      applyConfig();
    }

    // Test implementations
    function testHumanPOVWinner() {
      clearLogs();
      startTimer();
      log('=== Test 1: Human POV Winner ===', 'veto');
      updateStatus('Running Test 1: Human POV Winner', 'info');
      
      // Simulate competition start
      log('Competition phase started', 'veto');
      setTimeout(() => {
        log('Human submitted score (debugAlwaysWin: guaranteed max score)', 'veto');
        
        // Simulate AI submissions
        setTimeout(() => {
          log('AI player 1 submitted score', 'veto');
        }, 200);
        
        setTimeout(() => {
          log('AI player 2 submitted score', 'veto');
        }, 400);
        
        setTimeout(() => {
          log('AI player 3 submitted score', 'veto');
          log('✓ All scores submitted - triggering early completion', 'veto');
          log('✓ Fast reveal: POV Winner card (1200ms)', 'veto');
          
          setTimeout(() => {
            log('✓ Social phase inserted before ceremony', 'social');
            
            setTimeout(() => {
              log('✓ Ceremony started with fast intro (600ms)', 'ceremony');
              log('✓ Decision prompt rendered immediately', 'ceremony');
              log('✓ Total non-interactive wait time: ~2s', 'ceremony');
              stopTimer();
              updateStatus('✅ Test 1 PASSED: Fast path executed correctly', 'info');
            }, 1500);
          }, 1200);
        }, 600);
      }, 500);
    }

    function testAIPOVWinner() {
      clearLogs();
      startTimer();
      log('=== Test 2: AI POV Winner ===', 'veto');
      updateStatus('Running Test 2: AI POV Winner', 'info');
      
      log('Competition phase started', 'veto');
      setTimeout(() => {
        log('All scores submitted (AI winner)', 'veto');
        log('✓ Fast reveal: POV Winner card (1200ms)', 'veto');
        
        setTimeout(() => {
          log('✓ Social phase inserted before ceremony', 'social');
          
          setTimeout(() => {
            log('✓ Ceremony started with fast intro (600ms)', 'ceremony');
            log('✓ AI auto-decision executing (50ms delay)', 'ceremony');
            log('✓ AI decision logic executed', 'ceremony');
            log('✓ Compressed card durations (1400ms)', 'ceremony');
            stopTimer();
            updateStatus('✅ Test 2 PASSED: AI path executed correctly', 'info');
          }, 1500);
        }, 1200);
      }, 800);
    }

    function testEarlyCompletion() {
      clearLogs();
      startTimer();
      log('=== Test 3: Early Completion ===', 'veto');
      updateStatus('Running Test 3: Early Completion', 'info');
      
      log('Competition phase started (40s timer)', 'veto');
      log('Simulating all scores submitted before timer expiry...', 'veto');
      
      setTimeout(() => {
        log('Human submitted (t=0.5s)', 'veto');
      }, 500);
      
      setTimeout(() => {
        log('AI 1 submitted (t=0.8s)', 'veto');
      }, 800);
      
      setTimeout(() => {
        log('AI 2 submitted (t=1.1s)', 'veto');
      }, 1100);
      
      setTimeout(() => {
        log('AI 3 submitted (t=1.4s)', 'veto');
        log('✓ allVetoScoresSubmitted() returned true', 'veto');
        log('✓ accelerateVetoCompCompletion() called', 'veto');
        log('✓ Guard __vetoEarlyFinished set to prevent duplicates', 'veto');
        log('✓ finishVetoComp() triggered immediately', 'veto');
        log('⏱️ Saved ~38s by finishing early!', 'veto');
        stopTimer();
        updateStatus('✅ Test 3 PASSED: Early completion triggered at 1.4s', 'info');
      }, 1400);
    }

    function testSocialInsertion() {
      clearLogs();
      startTimer();
      log('=== Test 4: Social Phase Insertion ===', 'social');
      updateStatus('Running Test 4: Social Phase Insertion', 'info');
      
      log('Competition completed', 'veto');
      setTimeout(() => {
        log('✓ proceedAfterVetoResults() called', 'social');
        log('✓ Checking alive player count...', 'social');
        log('✓ Not Final 4, proceeding to social', 'social');
        log('✓ startSocial("veto_comp", callback) invoked', 'social');
        
        setTimeout(() => {
          log('Social phase active (user interactions)', 'social');
          
          setTimeout(() => {
            log('Social phase completed', 'social');
            log('✓ Callback invoked: startVetoCeremony()', 'ceremony');
            log('✓ Mandatory social phase successfully inserted', 'social');
            stopTimer();
            updateStatus('✅ Test 4 PASSED: Social phase inserted correctly', 'info');
          }, 2000);
        }, 500);
      }, 1200);
    }

    function testFastCeremony() {
      clearLogs();
      startTimer();
      log('=== Test 5: Fast Ceremony ===', 'ceremony');
      updateStatus('Running Test 5: Fast Ceremony', 'info');
      
      log('Ceremony starting...', 'ceremony');
      const fastMode = document.getElementById('fastVetoFlow').checked;
      const skipIntro = document.getElementById('skipVetoIntroCard').checked;
      
      log(`Config: fastVetoFlow=${fastMode}, skipVetoIntroCard=${skipIntro}`, 'ceremony');
      
      setTimeout(() => {
        if (skipIntro) {
          log('✓ Intro card skipped (0ms)', 'ceremony');
        } else {
          log(`✓ Fast intro card shown (${fastMode ? 600 : 2400}ms)`, 'ceremony');
        }
        
        const introTime = skipIntro ? 0 : (fastMode ? 600 : 2400);
        setTimeout(() => {
          log('✓ Decision prompt rendered immediately after intro', 'ceremony');
          log('Card durations:', 'ceremony');
          log(`  - Veto Decision: ${fastMode ? 1400 : 3200}ms`, 'ceremony');
          log(`  - Saved: ${fastMode ? 1400 : 3200}ms`, 'ceremony');
          log(`  - Replacement Required: ${fastMode ? 1400 : 3200}ms`, 'ceremony');
          log(`  - Replacement Nominee: ${fastMode ? 1400 : 3600}ms`, 'ceremony');
          log(`  - Adjourn: ${fastMode ? 1200 : 2800}ms`, 'ceremony');
          
          const totalTime = introTime + (fastMode ? (1400 * 4 + 1200) : (3200 * 4 + 2800));
          log(`⏱️ Total ceremony time: ~${(totalTime/1000).toFixed(1)}s`, 'ceremony');
          log(`💾 Saved ~${((12400 - totalTime)/1000).toFixed(1)}s vs legacy`, 'ceremony');
          
          stopTimer();
          updateStatus(`✅ Test 5 PASSED: ${fastMode ? 'Fast' : 'Legacy'} ceremony completed`, 'info');
        }, introTime);
      }, 100);
    }

    function testGoldenPOV() {
      clearLogs();
      startTimer();
      log('=== Test 6: Golden POV ===', 'veto');
      updateStatus('Running Test 6: Golden POV', 'info');
      
      log('Golden POV week detected', 'veto');
      log('Competition completed', 'veto');
      
      setTimeout(() => {
        log('✓ Fast reveal shown', 'veto');
        
        setTimeout(() => {
          log('✓ Social phase inserted', 'social');
          
          setTimeout(() => {
            log('✓ Ceremony started (fast mode)', 'ceremony');
            log('Human chose to use POV', 'ceremony');
            log('✓ Save selection via carousel picker', 'ceremony');
            log('✓ POV holder selects replacement (Golden twist)', 'ceremony');
            log('✓ All fast timing preserved for Golden POV', 'ceremony');
            stopTimer();
            updateStatus('✅ Test 6 PASSED: Golden POV compatible with fast flow', 'info');
          }, 1500);
        }, 1200);
      }, 500);
    }

    function testDiamondPOV() {
      clearLogs();
      startTimer();
      log('=== Test 7: Diamond POV ===', 'veto');
      updateStatus('Running Test 7: Diamond POV', 'info');
      
      log('Diamond POV week detected', 'veto');
      log('Competition completed', 'veto');
      
      setTimeout(() => {
        log('✓ Fast reveal shown', 'veto');
        
        setTimeout(() => {
          log('✓ Social phase inserted', 'social');
          
          setTimeout(() => {
            log('✓ Ceremony started (fast mode)', 'ceremony');
            log('Human chose to use POV', 'ceremony');
            log('✓ handleDiamondPOVCeremony() invoked', 'ceremony');
            log('✓ First replacement selection', 'ceremony');
            log('✓ Interstitial confirmation card (fast)', 'ceremony');
            log('✓ Second replacement selection', 'ceremony');
            log('✓ Both replacements applied with fast cards', 'ceremony');
            stopTimer();
            updateStatus('✅ Test 7 PASSED: Diamond POV compatible with fast flow', 'info');
          }, 1500);
        }, 1200);
      }, 500);
    }

    function testFinal4Bypass() {
      clearLogs();
      startTimer();
      log('=== Test 8: Final 4 Bypass ===', 'veto');
      updateStatus('Running Test 8: Final 4 Bypass', 'info');
      
      log('Competition completed (4 players alive)', 'veto');
      
      setTimeout(() => {
        log('✓ Fast reveal shown', 'veto');
        
        setTimeout(() => {
          log('✓ proceedAfterVetoResults() called', 'veto');
          log('✓ Detected alivePlayers().length === 4', 'veto');
          log('✓ Bypassing social phase (preserved behavior)', 'veto');
          log('✓ handlePostVetoReveal() invoked', 'veto');
          log('✓ startFinal4Eviction() called directly', 'ceremony');
          log('✓ Ceremony skipped (F4 rules)', 'ceremony');
          stopTimer();
          updateStatus('✅ Test 8 PASSED: Final 4 bypass logic preserved', 'info');
        }, 1200);
      }, 500);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      applyConfig();
      log('Test suite initialized', 'info');
    });
  </script>
</body>
</html>
