<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Scoring Fix Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0a0e14;
      color: #e3ecf5;
    }
    h1 { color: #4a90e2; }
    .test-section {
      background: #1a1f2e;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #2c3a4d;
    }
    button {
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }
    button:hover {
      opacity: 0.9;
    }
    #gameContainer {
      min-height: 400px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-weight: bold;
    }
    .result.success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4caf50;
      color: #4caf50;
    }
    .result.error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #f44336;
      color: #f44336;
    }
    .result.info {
      background: rgba(74, 144, 226, 0.2);
      border: 1px solid #4a90e2;
      color: #4a90e2;
    }
    pre {
      background: #0d1117;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🐍 Snake Scoring Fix Test</h1>
  
  <div class="test-section">
    <h2>Test: Snake Score Validation</h2>
    <p>This test verifies that the snake minigame returns valid scores (not NaN)</p>
    
    <button onclick="testSnakeDirect()">Test 1: Direct Snake Render</button>
    <button onclick="testSnakeWithErrorHandler()">Test 2: Snake via Error Handler</button>
    <button onclick="testScoreDataObject()">Test 3: Mock scoreData Object</button>
    <button onclick="testLegacyScore()">Test 4: Mock Legacy Number Score</button>
    
    <div id="testResults"></div>
    <div id="gameContainer"></div>
  </div>

  <!-- Load required modules -->
  <script src="js/minigames/central-scoring.js"></script>
  <script src="js/minigames/high-score-manager.js"></script>
  <script src="js/minigames/error-handler.js"></script>
  <script src="js/minigames/snake.js"></script>
  
  <script>
    function addResult(message, type = 'info') {
      const resultsDiv = document.getElementById('testResults');
      const resultEl = document.createElement('div');
      resultEl.className = `result ${type}`;
      resultEl.textContent = message;
      resultsDiv.appendChild(resultEl);
    }

    function clearResults() {
      document.getElementById('testResults').innerHTML = '';
      document.getElementById('gameContainer').innerHTML = '';
    }

    // Test 1: Direct snake render
    function testSnakeDirect() {
      clearResults();
      addResult('Test 1: Starting direct snake render...', 'info');
      
      const container = document.getElementById('gameContainer');
      
      window.MiniGames.snake.render(container, (score) => {
        console.log('Direct snake result:', score);
        
        if (typeof score === 'object' && score !== null && typeof score.score === 'number') {
          addResult(`✓ Test 1 PASSED: Received valid scoreData object`, 'success');
          addResult(`  - Score: ${score.score}`, 'info');
          addResult(`  - Raw: ${score.rawScore} (${score.rawScoreDisplay})`, 'info');
          addResult(`  - isNaN(score.score): ${isNaN(score.score)}`, 'info');
        } else if (typeof score === 'number') {
          if (isNaN(score)) {
            addResult(`✗ Test 1 FAILED: Score is NaN`, 'error');
          } else {
            addResult(`✓ Test 1 PASSED: Received valid number score: ${score}`, 'success');
          }
        } else {
          addResult(`✗ Test 1 FAILED: Invalid score type: ${typeof score}`, 'error');
        }
      }, { variant: 'normal', debugMode: true });
      
      addResult('Playing snake... Game will end automatically', 'info');
    }

    // Test 2: Snake via error handler wrapper
    function testSnakeWithErrorHandler() {
      clearResults();
      addResult('Test 2: Testing snake via MinigameErrorHandler...', 'info');
      
      const container = document.getElementById('gameContainer');
      
      window.MinigameErrorHandler.safeRender('snake', container, (score) => {
        console.log('Error handler wrapped result:', score);
        
        if (typeof score === 'object' && score !== null && typeof score.score === 'number') {
          if (isNaN(score.score)) {
            addResult(`✗ Test 2 FAILED: scoreData.score is NaN`, 'error');
          } else {
            addResult(`✓ Test 2 PASSED: Valid scoreData object`, 'success');
            addResult(`  - Score: ${score.score}`, 'info');
            addResult(`  - Raw: ${score.rawScore} (${score.rawScoreDisplay})`, 'info');
          }
        } else if (typeof score === 'number') {
          if (isNaN(score)) {
            addResult(`✗ Test 2 FAILED: Score is NaN`, 'error');
          } else {
            addResult(`✓ Test 2 PASSED: Valid number score: ${score}`, 'success');
          }
        } else {
          addResult(`✗ Test 2 FAILED: Invalid score type: ${typeof score}`, 'error');
        }
      }, { playerId: 'test-player', phase: 'hoh' });
      
      addResult('Playing snake via error handler... Game will end automatically', 'info');
    }

    // Test 3: Mock scoreData object
    function testScoreDataObject() {
      clearResults();
      addResult('Test 3: Testing mock scoreData object...', 'info');
      
      const mockScoreData = {
        score: 450,
        rawScore: 45,
        rawScoreDisplay: '45 food eaten',
        isNewPersonalBest: false
      };
      
      // Simulate what error handler does
      const container = document.getElementById('gameContainer');
      container.innerHTML = '<p style="padding: 20px;">Simulating scoreData object validation...</p>';
      
      setTimeout(() => {
        // Test the validation logic
        let result = 'UNKNOWN';
        let finalScore = mockScoreData;
        
        if (typeof mockScoreData === 'object' && mockScoreData !== null) {
          if (typeof mockScoreData.score === 'number' && !isNaN(mockScoreData.score)) {
            result = 'PASSED - Valid scoreData object';
          } else {
            result = 'FAILED - Invalid score in scoreData';
            finalScore = 50;
          }
        }
        
        if (result.includes('PASSED')) {
          addResult(`✓ Test 3 ${result}`, 'success');
          addResult(`  - Score type: ${typeof finalScore}`, 'info');
          addResult(`  - Score value: ${JSON.stringify(finalScore, null, 2)}`, 'info');
        } else {
          addResult(`✗ Test 3 ${result}`, 'error');
        }
      }, 500);
    }

    // Test 4: Mock legacy number score
    function testLegacyScore() {
      clearResults();
      addResult('Test 4: Testing mock legacy number score...', 'info');
      
      const mockScore = 450;
      
      // Simulate what error handler does
      const container = document.getElementById('gameContainer');
      container.innerHTML = '<p style="padding: 20px;">Simulating legacy number score validation...</p>';
      
      setTimeout(() => {
        // Test the validation logic
        let result = 'UNKNOWN';
        let finalScore = mockScore;
        
        if (typeof mockScore === 'number') {
          if (isNaN(mockScore)) {
            result = 'FAILED - Score is NaN';
            finalScore = 50;
          } else {
            result = 'PASSED - Valid number score';
            finalScore = Math.max(0, Math.min(1500, mockScore));
          }
        }
        
        if (result.includes('PASSED')) {
          addResult(`✓ Test 4 ${result}`, 'success');
          addResult(`  - Score: ${finalScore}`, 'info');
          addResult(`  - isNaN: ${isNaN(finalScore)}`, 'info');
        } else {
          addResult(`✗ Test 4 ${result}`, 'error');
        }
      }, 500);
    }

    // Log module availability on page load
    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Module Availability ===');
      console.log('MinigameScoring:', typeof window.MinigameScoring);
      console.log('MinigameErrorHandler:', typeof window.MinigameErrorHandler);
      console.log('MiniGames.snake:', typeof window.MiniGames?.snake);
      console.log('HighScoreManager:', typeof window.HighScoreManager);
      
      addResult('Modules loaded successfully. Click a test button to begin.', 'info');
    });
  </script>
</body>
</html>
