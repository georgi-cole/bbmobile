<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twist Architecture Refactor - Unit Tests</title>
  <style>
    body {
      padding: 20px;
      background: #0a0e14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .test-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 { color: #4a9eff; margin-bottom: 30px; }
    h2 { color: #6abeef; margin-top: 30px; }
    .test-section {
      background: #1a2530;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #2a3540;
    }
    .pass { color: #3ad56a; }
    .fail { color: #d53a3a; }
    .info { color: #8a9fb5; }
    .test-result {
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 4px;
      background: #0a1520;
      font-family: monospace;
      font-size: 13px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #3a7bd5;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin: 5px;
    }
    button:hover { background: #4a8be5; }
    button.success { background: #3ad56a; }
    button.success:hover { background: #4ae57a; }
    #summary {
      margin-top: 30px;
      padding: 20px;
      background: #0a1520;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🧪 Twist Architecture Refactor - Unit Tests</h1>
    <p class="info">Testing helper functions, twist selection logic, idempotency, and interval cleanup.</p>
    
    <div class="test-section">
      <button class="success" onclick="runAllTests()">▶ Run All Tests</button>
      <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>
    <div id="summary"></div>
  </div>

  <!-- Load test dependencies -->
  <script src="js/twists.js"></script>
  
  <script>
    let testsPassed = 0;
    let testsFailed = 0;

    function log(message, status = 'info') {
      const results = document.getElementById('results');
      const div = document.createElement('div');
      div.className = `test-result ${status}`;
      div.innerHTML = message;
      results.appendChild(div);
      
      if (status === 'pass') testsPassed++;
      if (status === 'fail') testsFailed++;
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').innerHTML = '';
      testsPassed = 0;
      testsFailed = 0;
    }

    function assert(condition, message) {
      if (condition) {
        log(`✓ ${message}`, 'pass');
        return true;
      } else {
        log(`✗ ${message}`, 'fail');
        return false;
      }
    }

    function setupMockGame(overrides = {}) {
      window.game = {
        cfg: { numPlayers: 12, enableJuryHouse: true, doubleChance: 0, tripleChance: 0 },
        players: [],
        juryHouse: [],
        week: 1,
        phase: 'intermission',
        ...overrides
      };
      
      // Mock helpers
      window.alivePlayers = () => window.game.players.filter(p => !p.evicted);
      window.getP = (id) => window.game.players.find(p => p.id === id);
      window.safeName = (id) => window.getP(id)?.name || `Player ${id}`;
      window.rng = Math.random;
      window.updateHud = () => {};
    }

    async function runAllTests() {
      clearResults();
      log('=== Starting Twist Architecture Unit Tests ===', 'info');
      
      // Test 1: Helper functions
      log('<h2>Test Suite 1: Twist State Helpers</h2>', 'info');
      testTwistHelpers();
      
      // Test 2: Twist selection logic
      log('<h2>Test Suite 2: Twist Selection Logic</h2>', 'info');
      testTwistSelection();
      
      // Test 3: Juror return eligibility
      log('<h2>Test Suite 3: Juror Return Eligibility</h2>', 'info');
      testJurorReturnEligibility();
      
      // Test 4: Idempotency and cleanup
      log('<h2>Test Suite 4: Finalize Idempotency</h2>', 'info');
      testFinalizeIdempotency();
      
      // Test 5: DOM cache and performance
      log('<h2>Test Suite 5: DOM Caching</h2>', 'info');
      testDOMCaching();
      
      // Summary
      const total = testsPassed + testsFailed;
      const passRate = total > 0 ? Math.round((testsPassed / total) * 100) : 0;
      const summaryEl = document.getElementById('summary');
      const color = testsFailed === 0 ? '#3ad56a' : '#d53a3a';
      summaryEl.innerHTML = `
        <div style="color: ${color};">
          <strong>Test Results:</strong> ${testsPassed} passed, ${testsFailed} failed (${passRate}% pass rate)
        </div>
      `;
    }

    function testTwistHelpers() {
      // Test isTwist
      setupMockGame();
      assert(!window.isTwist(window.game), 'isTwist returns false when no twist active');
      
      window.game.__twistMode = 'double';
      assert(window.isTwist(window.game), 'isTwist returns true when double twist active');
      
      window.game.__twistMode = 'triple';
      assert(window.isTwist(window.game), 'isTwist returns true when triple twist active');
      
      // Test getTwistNomSlots
      window.game.__twistMode = null;
      assert(window.getTwistNomSlots(window.game) === 2, 'getTwistNomSlots returns 2 for no twist');
      
      window.game.__twistMode = 'double';
      assert(window.getTwistNomSlots(window.game) === 3, 'getTwistNomSlots returns 3 for double');
      
      window.game.__twistMode = 'triple';
      assert(window.getTwistNomSlots(window.game) === 4, 'getTwistNomSlots returns 4 for triple');
      
      // Test getPlannedEvictions
      window.game.__twistMode = null;
      assert(window.getPlannedEvictions(window.game) === 1, 'getPlannedEvictions returns 1 for no twist');
      
      window.game.__twistMode = 'double';
      assert(window.getPlannedEvictions(window.game) === 2, 'getPlannedEvictions returns 2 for double');
      
      window.game.__twistMode = 'triple';
      assert(window.getPlannedEvictions(window.game) === 3, 'getPlannedEvictions returns 3 for triple');
    }

    function testTwistSelection() {
      // Test no twists when <= 6 alive
      setupMockGame({ players: Array(6).fill(0).map((_, i) => ({ id: i, evicted: false })) });
      window.twists.decideForWeek();
      assert(window.game.__twistMode === null, 'No twist selected when 6 or fewer alive');
      
      // Test triple priority over double
      setupMockGame({
        cfg: { doubleChance: 50, tripleChance: 100 },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: false }))
      });
      window.rng = () => 0.5; // 50% roll
      window.twists.decideForWeek();
      assert(window.game.__twistMode === 'triple', 'Triple twist selected when roll < tripleChance');
      
      // Test double when no triple
      setupMockGame({
        cfg: { doubleChance: 100, tripleChance: 0 },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: false }))
      });
      window.rng = () => 0.5;
      window.twists.decideForWeek();
      assert(window.game.__twistMode === 'double', 'Double twist selected when no triple configured');
      
      // Test no twist when roll fails
      setupMockGame({
        cfg: { doubleChance: 20, tripleChance: 10 },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: false }))
      });
      window.rng = () => 0.9; // 90% roll
      window.twists.decideForWeek();
      assert(window.game.__twistMode === null, 'No twist selected when roll exceeds all chances');
    }

    function testJurorReturnEligibility() {
      // Test insufficient jurors
      setupMockGame({
        cfg: { enableJuryHouse: true },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: i < 5 })),
        juryHouse: [0, 1] // Only 2 jurors, need 4-5
      });
      assert(!window.isJurorReturnEligible(window.game), 'Not eligible with insufficient jurors');
      
      // Test already run
      setupMockGame({
        cfg: { enableJuryHouse: true },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: i < 5 })),
        juryHouse: [0, 1, 2, 3, 4],
        __americaReturnDone: true
      });
      assert(!window.isJurorReturnEligible(window.game), 'Not eligible when already run');
      
      // Test eligible case
      setupMockGame({
        cfg: { enableJuryHouse: true },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: i < 5 })),
        juryHouse: [0, 1, 2, 3, 4] // 5 jurors
      });
      assert(window.isJurorReturnEligible(window.game), 'Eligible with sufficient jurors and alive players');
      
      // Test caching of decision
      setupMockGame({
        cfg: { enableJuryHouse: true, juryReturnChance: 100 },
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: i < 5 })),
        juryHouse: [0, 1, 2, 3, 4],
        week: 5
      });
      window.rng = () => 0.1; // Passes
      const firstCall = window.decideJurorReturnThisWeek(window.game);
      window.rng = () => 0.9; // Would fail if re-rolled
      const secondCall = window.decideJurorReturnThisWeek(window.game);
      assert(firstCall === secondCall, 'Decision is cached for the same week');
    }

    function testFinalizeIdempotency() {
      // Mock setup for return twist
      setupMockGame({
        players: Array(10).fill(0).map((_, i) => ({ id: i, evicted: i < 5, name: `Player ${i}` })),
        juryHouse: [0, 1, 2, 3],
        __returnTwist: {
          jurors: [0, 1, 2, 3],
          counts: new Map([[0, 10], [1, 8], [2, 6], [3, 5]]),
          finished: false,
          _tick: setInterval(() => {}, 100),
          _heartbeat: setInterval(() => {}, 500)
        }
      });
      
      // Mock required functions
      window.showCard = () => {};
      window.addJuryLog = () => {};
      window.setMusic = () => {};
      window.cardQueueWaitIdle = () => Promise.resolve();
      
      const tickBefore = window.game.__returnTwist._tick;
      const heartbeatBefore = window.game.__returnTwist._heartbeat;
      
      // Call finalize once (can't use async in this context, so we'll check sync parts)
      const st = window.game.__returnTwist;
      assert(!st.finished, 'Return twist not finished before finalize');
      
      // Manually test the idempotency parts
      if (!st.finished) {
        st.finished = true;
        if (st._tick) {
          clearInterval(st._tick);
          st._tick = null;
        }
        if (st._heartbeat) {
          clearInterval(st._heartbeat);
          st._heartbeat = null;
        }
      }
      
      assert(st.finished === true, 'Return twist marked as finished');
      assert(st._tick === null, 'Tick interval cleared and nulled');
      assert(st._heartbeat === null, 'Heartbeat interval cleared and nulled');
      
      // Call again - should be no-op
      const finishedBefore = st.finished;
      if (!st.finished) {
        st.finished = true; // Won't execute
      }
      assert(st.finished === finishedBefore, 'Second call is no-op (idempotent)');
    }

    function testDOMCaching() {
      setupMockGame({
        __returnTwist: {
          jurors: [1, 2, 3],
          counts: new Map([[1, 10], [2, 8], [3, 6]]),
          started: Date.now(),
          durationMs: 10000,
          finished: false,
          lastLeader: null,
          _domCache: {
            1: { card: {}, bar: { style: {} }, pct: {} },
            2: { card: {}, bar: { style: {} }, pct: {} },
            3: { card: {}, bar: { style: {} }, pct: {} },
            countdown: {},
            liveRegion: {}
          }
        }
      });
      
      const st = window.game.__returnTwist;
      assert(st._domCache !== null, 'DOM cache initialized in return twist state');
      assert(st._domCache[1] !== undefined, 'DOM cache contains entry for juror 1');
      assert(st._domCache.countdown !== undefined, 'DOM cache contains countdown reference');
      assert(st._domCache.liveRegion !== undefined, 'DOM cache contains ARIA live region reference');
    }
  </script>
</body>
</html>
