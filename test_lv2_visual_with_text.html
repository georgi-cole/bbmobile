<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LV2 Layout Test - With Instruction Text</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/livevote-compact.css">
  <link rel="stylesheet" href="css/livevote-compact-fullyfit.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0f16;
      font-family: system-ui, sans-serif;
      color: #e8f4ff;
    }
    
    .test-info {
      max-width: 900px;
      margin: 0 auto 20px;
      padding: 16px;
      background: rgba(20,35,55,0.8);
      border-radius: 12px;
      border: 1px solid rgba(143,211,255,0.2);
      font-size: 0.9rem;
    }
    
    .test-info h2 {
      margin: 0 0 12px 0;
      color: #00e0cc;
      font-size: 1.2rem;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto 20px;
    }
    
    #tv {
      position: relative;
      height: 600px;
      background: linear-gradient(to bottom, rgba(14,23,48,0.7), rgba(14,23,48,0.8));
      background-color: #0e1730;
      border: 2px solid rgba(0,0,0,0.35);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px -22px rgba(0,0,0,.75);
    }
    
    .controls {
      text-align: center;
      margin-top: 20px;
    }
    
    .controls button {
      background: linear-gradient(135deg, #00e0cc, #00b8a3);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      color: #001a18;
      font-weight: 700;
      cursor: pointer;
      margin: 5px;
    }
    
    .marker {
      position: absolute;
      pointer-events: none;
      z-index: 1000;
    }
    
    .marker-h {
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 0, 0, 0.5);
      border-top: 1px dashed red;
    }
    
    .marker-label {
      position: absolute;
      background: red;
      color: white;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 3px;
      left: 4px;
      top: -18px;
    }
  </style>
</head>
<body>
  <div class="test-info">
    <h2>📐 LV2 Layout with Instruction Text</h2>
    <p><strong>Viewport:</strong> <span id="viewport-size"></span></p>
    <p>Click buttons to toggle between states and see instruction text behavior.</p>
  </div>

  <div class="container">
    <div id="tv">
      <!-- TV boundary markers -->
      <div class="marker marker-h" style="top: 0;">
        <span class="marker-label">TV TOP</span>
      </div>
      <div class="marker marker-h" style="top: 50%;">
        <span class="marker-label">CENTER</span>
      </div>
      <div class="marker marker-h" style="bottom: 0;">
        <span class="marker-label" style="top: auto; bottom: -18px;">TV BOTTOM</span>
      </div>
      
      <div class="lv2-overlay">
        <div class="lv2-panel">
          <div class="lv2-header">
            <h3>Live Vote</h3>
          </div>
          
          <!-- Instructions text -->
          <div class="lv2-instructions" id="instructions">
            Cast your vote to evict
          </div>
          
          <div class="lv2-grid">
            <div class="lv2-contestant left" onclick="selectNominee('Alice')">
              <div class="lv2-avatar" style="background: conic-gradient(from 45deg, rgba(131,191,255,0.4), rgba(102,217,255,0.2), rgba(131,191,255,0.4)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                👤
              </div>
              <div class="lv2-name" id="alice-name">Alice</div>
            </div>
            
            <div class="lv2-contestant right" onclick="selectNominee('Bob')">
              <div class="lv2-avatar" style="background: conic-gradient(from 45deg, rgba(131,191,255,0.4), rgba(102,217,255,0.2), rgba(131,191,255,0.4)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                👤
              </div>
              <div class="lv2-name" id="bob-name">Bob</div>
            </div>
          </div>
          
          <div class="lv2-cta-row" id="cta-row" style="display: none;">
            <button class="lv2-name-btn-selected">Evict Alice</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="showInitialState()">Initial State</button>
    <button onclick="selectNominee('Alice')">Select Alice</button>
    <button onclick="selectNominee('Bob')">Select Bob</button>
    <button onclick="showMarkers()">Toggle Markers</button>
  </div>

  <div class="test-info">
    <h2>✨ Current State</h2>
    <p id="state-info">Initial: "Cast your vote to evict"</p>
  </div>

  <script>
    let selectedName = null;
    
    function updateViewportSize() {
      document.getElementById('viewport-size').textContent = 
        `${window.innerWidth}px × ${window.innerHeight}px`;
    }
    
    function showInitialState() {
      selectedName = null;
      document.getElementById('instructions').textContent = 'Cast your vote to evict';
      document.getElementById('cta-row').style.display = 'none';
      document.getElementById('alice-name').textContent = 'Alice';
      document.getElementById('bob-name').textContent = 'Bob';
      document.getElementById('state-info').textContent = 'Initial: "Cast your vote to evict"';
    }
    
    function selectNominee(name) {
      selectedName = name;
      const instructions = document.getElementById('instructions');
      const ctaRow = document.getElementById('cta-row');
      const ctaButton = ctaRow.querySelector('.lv2-name-btn-selected');
      
      // Update instruction text
      instructions.textContent = `You are about to evict ${name}. Tap again to confirm.`;
      
      // Show CTA button
      ctaRow.style.display = 'flex';
      ctaButton.textContent = `Evict ${name}`;
      
      // Update state info
      document.getElementById('state-info').textContent = 
        `Selected ${name}: "You are about to evict ${name}. Tap again to confirm."`;
    }
    
    function showMarkers() {
      const markers = document.querySelectorAll('.marker');
      markers.forEach(m => {
        m.style.display = m.style.display === 'none' ? 'block' : 'none';
      });
    }
    
    window.addEventListener('resize', updateViewportSize);
    updateViewportSize();
  </script>
</body>
</html>
