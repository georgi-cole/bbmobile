<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomination Risk — Smoke Tests</title>
  <style>
    body { margin: 0; padding: 20px; background: #0a0f16; color: #e0e0e0; font-family: Arial, sans-serif; font-size: 14px; }
    h1 { color: #ffd700; font-size: 1.3rem; margin-bottom: 16px; }
    .suite { margin-bottom: 24px; }
    .suite h2 { font-size: 1rem; color: #7ec8e3; border-bottom: 1px solid rgba(126,200,227,0.3); padding-bottom: 4px; margin-bottom: 10px; }
    .test { display: flex; align-items: flex-start; gap: 10px; margin: 6px 0; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.04); }
    .test.pass { background: rgba(40,120,60,0.25); border-left: 3px solid #4caf50; }
    .test.fail { background: rgba(120,40,40,0.35); border-left: 3px solid #f44336; }
    .badge { font-weight: bold; min-width: 40px; font-size: 0.82rem; }
    .pass .badge { color: #4caf50; }
    .fail .badge { color: #f44336; }
    .desc { flex: 1; }
    .detail { font-size: 0.78rem; color: #a0a0a0; margin-top: 3px; }
    #summary { margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 1rem; font-weight: bold; }
    #summary.all-pass { background: rgba(40,120,60,0.3); color: #4caf50; border: 1px solid #4caf50; }
    #summary.has-fail { background: rgba(120,40,40,0.3); color: #f44336; border: 1px solid #f44336; }
    button.demo-btn {
      margin: 10px 0; padding: 9px 18px; background: #2a4766; color: #e0e0e0;
      border: 1px solid #356089; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    button.demo-btn:hover { background: #356089; }
  </style>
</head>
<body>
  <h1>🔬 Nomination Risk &amp; Plea Modal — Smoke Tests</h1>
  <div id="results"></div>
  <div id="summary"></div>
  <div id="plea-demo" style="margin-top:24px">
    <div class="suite">
      <h2>Interactive Demo</h2>
      <button class="demo-btn" id="openPleaBtn">Open Plea Modal (demo)</button>
      <div id="pleaResult" style="margin-top:8px;font-size:0.85rem;color:#a0b4c8;"></div>
    </div>
  </div>

  <!-- Load the modules under test -->
  <script src="js/ai/nomination-risk.js"></script>
  <script src="js/ui/plea-modal.js"></script>

  <script>
    // ── Mini test runner ────────────────────────────────────────────────
    const tests = [];
    let passed = 0, failed = 0;

    function assert(description, condition, detail) {
      tests.push({ description, condition: !!condition, detail: detail || '' });
    }

    function assertEqual(description, actual, expected) {
      const ok = actual === expected;
      assert(description, ok, 'expected: ' + JSON.stringify(expected) + '  got: ' + JSON.stringify(actual));
    }

    function assertApprox(description, actual, expected, tol) {
      tol = tol || 0.0001;
      const ok = Math.abs(actual - expected) <= tol;
      assert(description, ok, 'expected ≈ ' + expected + '  got: ' + actual.toFixed(6));
    }

    function assertRange(description, actual, lo, hi) {
      const ok = actual >= lo && actual <= hi;
      assert(description, ok, 'expected in [' + lo + ', ' + hi + ']  got: ' + actual);
    }

    // ── Suite 1: Module presence ─────────────────────────────────────────
    assert('window.NominationRisk is defined', typeof window.NominationRisk === 'object');
    assert('NominationRisk.computeNominationRisk is a function', typeof NominationRisk.computeNominationRisk === 'function');
    assert('NominationRisk.categorizeRisk is a function', typeof NominationRisk.categorizeRisk === 'function');
    assert('NominationRisk.normalizeBond is a function', typeof NominationRisk.normalizeBond === 'function');
    assert('NominationRisk.chooseNomineeByRisk is a function', typeof NominationRisk.chooseNomineeByRisk === 'function');
    assert('window.PleaUI is defined', typeof window.PleaUI === 'object');
    assert('PleaUI.show is a function', typeof PleaUI.show === 'function');
    assert('PleaUI.isActive is a function', typeof PleaUI.isActive === 'function');

    // ── Suite 2: normalizeBond ────────────────────────────────────────────
    const nb = NominationRisk.normalizeBond;
    assertApprox('normalizeBond(0, -100, 100) = 0.5', nb(0, -100, 100), 0.5);
    assertApprox('normalizeBond(-100, -100, 100) = 0', nb(-100, -100, 100), 0);
    assertApprox('normalizeBond(100, -100, 100) = 1', nb(100, -100, 100), 1);
    assertApprox('normalizeBond(0, -1, 1) = 0.5', nb(0, -1, 1), 0.5);
    assertApprox('normalizeBond(1, -1, 1) = 1', nb(1, -1, 1), 1);
    assertApprox('normalizeBond(-1, -1, 1) = 0', nb(-1, -1, 1), 0);
    // Clamp out-of-range values
    assertApprox('normalizeBond(200, -100, 100) clamps to 1', nb(200, -100, 100), 1);
    assertApprox('normalizeBond(-200, -100, 100) clamps to 0', nb(-200, -100, 100), 0);
    // Default range
    assertApprox('normalizeBond(0) uses default [-100,100] → 0.5', nb(0), 0.5);

    // ── Suite 3: computeNominationRisk ────────────────────────────────────
    const cnr = NominationRisk.computeNominationRisk;
    // With neutral bond (0 on [-100,100]) and 5 eligible: base=0.2, bondNorm=0.5, hoh=2*(1-0.5)=1, raw=1.2 → clamped to 1
    assertApprox('neutral bond, 5 eligible → risk=1 (clamped)', cnr({eligibleCount:5, socialBond:0}), 1.0);
    // With perfect positive bond (100) and 5 eligible: bondNorm=1, hoh=2*(0)=0, raw=0.2
    assertApprox('max bond, 5 eligible → risk=0.2', cnr({eligibleCount:5, socialBond:100}), 0.2);
    // With max negative bond (-100) and 5 eligible: bondNorm=0, hoh=2*1=2, raw=2.2 → clamped to 1
    assertApprox('min bond, 5 eligible → risk=1 (clamped)', cnr({eligibleCount:5, socialBond:-100}), 1.0);
    // Higher eligible count → lower base chance
    const r10 = cnr({eligibleCount:10, socialBond:100});
    const r5  = cnr({eligibleCount:5,  socialBond:100});
    assert('more eligible players → lower base risk (with same high bond)', r10 < r5, 'r10=' + r10 + ' r5=' + r5);
    // Higher bond → lower risk
    const rLow  = cnr({eligibleCount:5, socialBond:100, bondMin:-100, bondMax:100});
    const rHigh = cnr({eligibleCount:5, socialBond:-100, bondMin:-100, bondMax:100});
    assert('higher social bond → lower nomination risk', rLow < rHigh, 'low bond risk=' + rLow + ' high bond risk=' + rHigh);
    // Result is always 0..1
    assertRange('result clamped to [0,1]', cnr({eligibleCount:3, socialBond:-100}), 0, 1);
    assertRange('result clamped to [0,1] with max bond', cnr({eligibleCount:3, socialBond:100}), 0, 1);
    // Custom hohWeight
    const r2 = cnr({eligibleCount:5, socialBond:100, hohWeight:2.0});
    const r0 = cnr({eligibleCount:5, socialBond:100, hohWeight:0});
    assert('hohWeight=0 → risk = baseChance only', Math.abs(r0 - 0.2) < 0.001, 'expected 0.2, got ' + r0);
    // bondMin/bondMax in game range [-1,1]
    const gameRisk = cnr({eligibleCount:6, socialBond:0.5, bondMin:-1, bondMax:1});
    assertRange('game-scale bond [-1,1] → risk in [0,1]', gameRisk, 0, 1);

    // ── Suite 4: categorizeRisk ───────────────────────────────────────────
    const cat = NominationRisk.categorizeRisk;
    assertEqual('categorize 0.05 → very low',  cat(0.05), 'very low');
    assertEqual('categorize 0.10 → low',        cat(0.10), 'low');
    assertEqual('categorize 0.15 → low',        cat(0.15), 'low');
    assertEqual('categorize 0.25 → medium',     cat(0.25), 'medium');
    assertEqual('categorize 0.49 → medium',     cat(0.49), 'medium');
    assertEqual('categorize 0.50 → high',       cat(0.50), 'high');
    assertEqual('categorize 0.69 → high',       cat(0.69), 'high');
    assertEqual('categorize 0.70 → very high',  cat(0.70), 'very high');
    assertEqual('categorize 0.89 → very high',  cat(0.89), 'very high');
    assertEqual('categorize 0.90 → extreme',    cat(0.90), 'extreme');
    assertEqual('categorize 1.00 → extreme',    cat(1.00), 'extreme');

    // ── Suite 5: chooseNomineeByRisk ─────────────────────────────────────
    const choose = NominationRisk.chooseNomineeByRisk;

    // Deterministic: should pick highest-risk player (lowest bond)
    const eligIds = ['p1','p2','p3'];
    const bonds = { p1: 0.8, p2: -0.8, p3: 0.0 }; // p2 has worst bond → highest risk
    const getBond = (hohId, pid) => bonds[pid];
    const detResult = choose(eligIds, 'hoh1', getBond, Math.random, true, 1, -1, 1);
    assert('deterministic pick = highest risk (p2 with bond -0.8)', detResult[0] === 'p2', 'got: ' + detResult[0]);

    // Pick 2 deterministic: should be p2 then p3 (next highest risk)
    const det2 = choose(eligIds, 'hoh1', getBond, Math.random, true, 2, -1, 1);
    assert('deterministic 2 picks: first is p2', det2[0] === 'p2', 'got: ' + JSON.stringify(det2));
    assert('deterministic 2 picks: no duplicates', det2[0] !== det2[1], 'got: ' + JSON.stringify(det2));
    assertEqual('deterministic 2 picks: returns 2', det2.length, 2);

    // Empty input → empty output
    const emptyResult = choose([], 'hoh1', getBond);
    assert('empty eligibleIds → empty result', emptyResult.length === 0);

    // Stochastic: run many trials, p2 (highest risk) should be chosen most often
    let p2Count = 0;
    const TRIALS = 500;
    for(let i = 0; i < TRIALS; i++){
      const r = choose(eligIds, 'hoh1', getBond, Math.random, false, 1, -1, 1);
      if(r[0] === 'p2') p2Count++;
    }
    const p2Rate = p2Count / TRIALS;
    assert('stochastic: highest-risk player chosen more than 50% of time', p2Rate > 0.5, 'p2 rate = ' + p2Rate.toFixed(2));

    // ── Suite 6: PleaUI.isActive ──────────────────────────────────────────
    assert('PleaUI.isActive() = false when no modal open', PleaUI.isActive() === false);

    // ── Render results ────────────────────────────────────────────────────
    const container = document.getElementById('results');
    const suiteNames = [
      'Module presence',
      'normalizeBond',
      'computeNominationRisk',
      'categorizeRisk',
      'chooseNomineeByRisk',
      'PleaUI.isActive',
    ];
    const suiteSizes = [8, 9, 10, 11, 7, 1];
    let testIdx = 0;
    suiteNames.forEach(function(name, si) {
      const suiteDiv = document.createElement('div');
      suiteDiv.className = 'suite';
      const h2 = document.createElement('h2');
      h2.textContent = 'Suite ' + (si + 1) + ': ' + name;
      suiteDiv.appendChild(h2);
      const count = suiteSizes[si];
      for(let i = 0; i < count && testIdx < tests.length; i++, testIdx++){
        const t = tests[testIdx];
        const div = document.createElement('div');
        div.className = 'test ' + (t.condition ? 'pass' : 'fail');
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = t.condition ? 'PASS' : 'FAIL';
        div.appendChild(badge);
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = t.description;
        if(t.detail){
          const detail = document.createElement('div');
          detail.className = 'detail';
          detail.textContent = t.detail;
          desc.appendChild(detail);
        }
        div.appendChild(desc);
        suiteDiv.appendChild(div);
        if(t.condition) passed++; else failed++;
      }
      container.appendChild(suiteDiv);
    });

    const summary = document.getElementById('summary');
    const allPass = failed === 0;
    summary.className = allPass ? 'all-pass' : 'has-fail';
    summary.textContent = allPass
      ? '✅ All ' + passed + ' tests passed'
      : '❌ ' + failed + ' test(s) failed  /  ' + passed + ' passed';

    // ── Interactive PleaUI demo ───────────────────────────────────────────
    document.getElementById('openPleaBtn').addEventListener('click', function() {
      PleaUI.show({
        nomineeId: 'player1',
        nomineeName: 'Jordan',
        onSubmit: function(text) { console.log('[demo] plea submitted:', text); }
      }).then(function(result) {
        const el = document.getElementById('pleaResult');
        if(result.submitted){
          el.style.color = '#4caf50';
          el.textContent = '✓ Plea submitted: "' + result.text + '"';
        } else {
          el.style.color = '#a0a0a0';
          el.textContent = '(skipped / closed)';
        }
      });
    });
  </script>
</body>
</html>
