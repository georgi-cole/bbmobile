<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Energy Modal - Screenshot Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 18, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      padding: 20px;
    }
    
    .modal {
      background: linear-gradient(135deg, #1a2f44 0%, #243a50 100%);
      border: 3px solid #ff4444;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.95), 0 8px 24px -8px rgba(0, 0, 0, 0.8);
      max-width: 480px;
      width: 100%;
      position: relative;
    }
    
    .battery-icon {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 20px;
      animation: battery-blink 1s ease-in-out infinite;
      opacity: 0.7;
    }
    
    @keyframes battery-blink {
      0%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
    
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ff4444;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    
    .message {
      font-size: 1rem;
      color: #d5e0f0;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    
    .button-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 120px;
      font-family: inherit;
      border: 2px solid;
    }
    
    .skip-button {
      border-color: #4a5a6a;
      background: #2a3a4a;
      color: #e0e8f0;
    }
    
    .skip-button:hover {
      background: #3a4a5a;
      border-color: #5a6a7a;
    }
    
    .recharge-button {
      border-color: #ffa500;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      color: #ffffff;
    }
    
    .recharge-button:hover {
      background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
      transform: scale(1.05);
    }
    
    .info-box {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.9rem;
      max-width: 300px;
      z-index: 10000000;
    }
    
    .info-box h3 {
      margin-bottom: 8px;
      color: #4fc3f7;
    }
    
    .info-box ul {
      list-style: none;
      padding-left: 0;
    }
    
    .info-box li {
      margin: 5px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .info-box li:before {
      content: "→";
      position: absolute;
      left: 0;
      color: #4fc3f7;
    }
    
    @media (max-width: 768px) {
      .modal {
        padding: 24px;
      }
      
      .battery-icon {
        font-size: 60px;
      }
      
      .title {
        font-size: 1.5rem;
      }
      
      .message {
        font-size: 0.9rem;
      }
      
      .info-box {
        position: static;
        margin-bottom: 20px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h3>🔋 Zero Energy Modal</h3>
    <ul>
      <li>Empty battery icon with animation</li>
      <li>SKIP: advances to next phase</li>
      <li>🎬 Recharge: grants +5 energy, +5 influence, +5 information</li>
    </ul>
  </div>
  
  <div class="modal-overlay">
    <div class="modal">
      <div class="battery-icon">🔋</div>
      <div class="title">No Social Energy</div>
      <div class="message">You have no energy remaining for social interactions.</div>
      <div class="button-container">
        <button class="skip-button" onclick="alert('SKIP clicked - would advance to next phase')">SKIP</button>
        <button class="recharge-button" onclick="alert('Recharge clicked - would grant +5 energy, +5 influence, +5 information')">🎬 Recharge</button>
      </div>
    </div>
  </div>
  
  <script>
    // Add a note to console
    console.log('%c🔋 Zero Energy Modal Demo', 'font-size: 20px; font-weight: bold; color: #4fc3f7;');
    console.log('This is a static demo of the new 0 social energy modal.');
    console.log('');
    console.log('Features:');
    console.log('  • Empty battery icon with blinking animation');
    console.log('  • SKIP button: advances to next phase');
    console.log('  • 🎬 Recharge button: grants +5 energy, +5 influence, +5 information');
    console.log('');
    console.log('The modal appears when a player has 0 social energy at the start of the social phase.');
  </script>
</body>
</html>
